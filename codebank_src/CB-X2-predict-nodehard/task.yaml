id: CB-X2-predict-nodehard
category: codebank
family: predict
difficulty: hard
max_tokens: 4096
issue: |
  These snippets come from the household services' Node helpers (the
  reminder queue, the calendar, the settings store). Each one is runnable as
  shown. Say exactly what each prints.
snippets:
- title: reminder queue order
  lang: node
  code: |
    const log = [];
    setTimeout(() => log.push("t1"), 0);
    Promise.resolve().then(() => log.push("p1")).then(() => log.push("p2"));
    queueMicrotask(() => log.push("m1"));
    process.nextTick(() => log.push("n1"));
    (async () => {
      log.push("a0");
      await null;
      log.push("a1");
      await new Promise((r) => setTimeout(r, 0));
      log.push("a2");
    })();
    log.push("sync");
    setTimeout(() => console.log(log.join(" ")), 5);
- title: parsing form fields
  lang: node
  code: |
    console.log(parseInt(0.0000005), parseInt("0x1f"), parseInt("1e3"), Number("1e3"), Number(""), Number(" 12 "), Number("12px"));
    console.log([1, 2, 3].map(parseInt).join(","), Math.max(), Math.min() > 0, typeof (() => {}).prototype);
- title: month-end reminders
  lang: node
  code: |
    const d = new Date(Date.UTC(2026, 0, 31));
    d.setUTCMonth(1);
    console.log(d.toISOString().slice(0, 10));
    const e = new Date(Date.UTC(2024, 1, 29));
    e.setUTCFullYear(2025);
    console.log(e.toISOString().slice(0, 10), new Date(Date.UTC(2026, 11, 32)).getUTCMonth());
- title: saving settings
  lang: node
  code: |
    const o = { b: 1, 2: "two", a: 2, 1: "one", "-1": "neg", "01": "z" };
    console.log(Object.keys(o).join(","));
    console.log(JSON.stringify({ x: undefined, y: () => 1, z: NaN, w: -0, v: [undefined, Infinity], d: new Date(0) }));
- title: cleanup paths
  lang: node
  code: |
    function f() {
      try { return "try"; }
      finally { console.log("fin"); }
    }
    function g() {
      try { throw new Error("x"); }
      catch (e) { return "catch"; }
      finally { return "finally"; }
    }
    console.log(f(), g());
- title: label templates
  lang: node
  code: |
    const s = "a-b-c";
    console.log(s.replace("-", "+"), s.replaceAll("-", "$&$&"), s.replace(/-/g, "$$"), s.split("-", 2).join("|"));
    console.log("abc".at(-1), "abc".substring(2, 0), "ß".toUpperCase(), "İ".toLowerCase().length);
- title: sparse lists and money
  lang: node
  code: |
    const arr = [3, , 1];
    console.log(arr.length, arr.map((x) => x * 2).length, Object.keys(arr).join(","), arr.indexOf(undefined), arr.includes(undefined));
    console.log(Number.MAX_SAFE_INTEGER + 2, 2 ** 53 === 2 ** 53 + 1, 0.1 * 3, 1.005.toFixed(2), (1234.5).toFixed(0), (-1.5).toFixed(0));
- title: device ids
  lang: node
  code: |
    class A {
      static count = 0;
      #id;
      constructor() { this.#id = ++A.count; }
      get id() { return this.#id; }
      toJSON() { return { id: this.#id }; }
    }
    class B extends A { static count = 100; }
    const a = new A(), b = new B(), c = new B();
    console.log(a.id, b.id, c.id, A.count, B.count, JSON.stringify([b]), Object.keys(c).length);
