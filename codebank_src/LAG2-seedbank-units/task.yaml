id: LAG2-seedbank-units
category: codeagent_long
family: agent
difficulty: hard
max_tokens: 4096
allowed_paths: ["seedbank/*.py"]
new_paths: ["seedbank/*.py"]
pythonpath: ["."]
per_test_timeout_s: 20
group_timeout_s: 60
issue: |
  Please build schema v3 of seedbank: structured amounts. We agreed the whole
  thing at the kitchen table and Mia wrote it down in docs/AMOUNTS.md: the new
  seedbank/quantity.py module, the database change and the v2 -> v3
  migration, the API, using seed up when we sow, the CSV export and the new
  CSV import, and the CLI. Our real database is v2
  (some old copies on the laptops are still v1) and it has years of sowing
  records in it, so the migration must not lose anything and must be all or
  nothing. Gran's spreadsheet import and the kitchen tablet both read the new
  shapes exactly as the document says. Everything else must keep working.
groups:
  - {id: parser, file: test_parser.py, kind: f2p, why: "AMOUNTS.md 1-3: Amount/QuantityError/UNITS, every number/unit/marker form, exact half-up rounding (oz, 1/3, 0.0005 g), whole seeds, errors, format_amount, round trip, 600 random grammar strings vs an oracle"}
  - {id: migrate, file: test_migrate.py, kind: f2p, why: "AMOUNTS.md 4: v2 rows converted (parsed / empty / unparseable -> [quantity: q] note with newline join), quantity column gone, other columns + indexes kept, sowings survive, FK cascade still works, store reads Amounts"}
  - {id: safety, file: test_safety.py, kind: f2p, why: "AMOUNTS.md 4 'How migrations run': v1 -> v3 in one run, idempotent, SchemaTooNew leaves file untouched, a failing later step rolls back everything (one transaction incl. DDL, FK on, no open transaction), fresh schema == migrated, CHECK constraints"}
  - {id: api, file: test_api.py, kind: f2p, why: "AMOUNTS.md 5: amount object + quantity compat in output, POST/PATCH with either, both -> 400 exact message, all invalid forms 400 and nothing saved, clearing, ?unit= filter, /totals"}
  - {id: sowing_use, file: test_sowing_use.py, kind: f2p, why: "AMOUNTS.md 6: used (object or string, oz into a gram stock) taken off the stock with the sowing, 0 stays an amount, approx kept, 409 messages (no amount / unit mismatch / not enough), 400 invalid, nothing saved on any error"}
  - {id: import, file: test_import.py, kind: f2p, why: "AMOUNTS.md 7 import: v3 + v2 headers exactly, add/replace by id, family fill, half-up rounding, record-number line N (multi-line notes), unknown/duplicate id, all-or-nothing rollback, CLI import exit codes"}
  - {id: export_cli, file: test_export_cli.py, kind: f2p, why: "AMOUNTS.md 6: CSV header/columns (amount/unit/approx, empty cells), CLI add --qty / --amount --unit --approx, exit 2 for bad combinations, exit 1 + 'error:' for invalid values, list column"}
  - {id: existing, file: test_existing.py, kind: p2p, why: "store, search, viability, sowing windows, API basics (sowings, viability, delete cascade) unchanged"}
