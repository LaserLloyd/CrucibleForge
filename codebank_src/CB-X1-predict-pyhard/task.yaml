snippets:
- title: chores rota
  lang: python
  code: |
    rows = [("ann", 2), ("bo", 1), ("cy", 2), ("di", 1), ("ed", 3)]
    print([n for n, _ in sorted(rows, key=lambda r: r[1], reverse=True)])
    print([n for n, _ in sorted(rows, key=lambda r: -r[1])][::-1])
    print(round(0.125, 2), round(0.375, 2), round(2.675, 2), round(1250, -2), round(-0.5))
