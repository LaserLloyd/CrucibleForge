- title: refresh order
  lang: node
  code: |
    const log = [];
    setTimeout(() => log.push("timeout"), 0);
    Promise.resolve().then(() => { log.push("a1"); return Promise.resolve(); }).then(() => log.push("a2"));
    Promise.resolve().then(() => log.push("b1")).then(() => log.push("b2")).then(() => log.push("b3")).then(() => log.push("b4"));
    queueMicrotask(() => log.push("micro"));
    (async () => { log.push("async-start"); await null; log.push("after-await"); })();
    log.push("sync");
    setTimeout(() => console.log(log.join(",")), 5);
