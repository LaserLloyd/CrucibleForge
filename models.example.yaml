# CrucibleForge model registry — copy to ./models.yaml (or ~/.config/crucibleforge/models.yaml)
# and edit. API keys NEVER go in this file: name an environment variable with
# api_key_env. `crucibleforge status` shows what resolves.
#
# providers:  where models are served.
#   type: openai       any OpenAI-compatible /chat/completions server, no load
#                      management (DeepSeek, OpenRouter, OpenAI, Groq, Together,
#                      Mistral, Open WebUI /api, Ollama /v1, vLLM, llama-server,
#                      LM Studio if you don't want `lms` managing loads)
#   type: lmstudio     LM Studio managed via the `lms` CLI (one model loaded at a
#                      time, measured load time, snapshot/restore, wrong-model guard)
#   type: studioforge  llama.cpp multi-model server; loads the server's recommended
#                      placement profile (parallel slots) and runs that many
#                      requests at once (concurrency: auto)
#   concurrency: N     parallel requests for remote APIs (default 8; local servers: 1)
#   verify_model:      fail if the server answers from a different model id
#                      (default true for lmstudio/studioforge, false for openai)
#   headers: {...}     extra HTTP headers (e.g. OpenRouter's HTTP-Referer); ${ENV}
#                      placeholders are expanded (StudioForge: X-MCP-Pin for
#                      management calls from another machine)
#   api_key_env: VAR   name of the env var holding the bearer key (sent as
#                      "Authorization: Bearer"); StudioForge API keys go here
#   extra_body: {...}  extra request fields for every model on this provider
#   docs: <url>          the vendor's API documentation. For a HOSTED provider
#                      (a public API, not a local server) it says where the
#                      request protocol the bench assumes was read.
#   docs_verified: YYYY-MM-DD
#                      when that documentation was last reviewed. `conform`
#                      WARNs (c7) when a hosted provider carries no docs, or
#                      when the review is older than 120 days.
#   reasoning_replay: true|false
#                      pass the model's reasoning chain back to it. MiniMax
#                      documents that the complete assistant message (the
#                      reasoning_content included) must be appended to the
#                      history or the chain is lost (measured: 1/10 recall with
#                      it dropped vs 7/10 replayed). ON, every request to this
#                      provider carries reasoning_split: true so the thinking
#                      arrives in reasoning_content for EVERY model on it, and
#                      the assistant turn goes back with its reasoning. OFF,
#                      every request is byte-identical to a run without the
#                      switch. Default: ON for a provider pointed at MiniMax's
#                      OpenAI-compatible API (api.minimax.io / api.minimaxi.com),
#                      OFF for every other provider.
#   StudioForge rig etiquette (type: studioforge):
#   use_resident: true  (default) if the target model is ALREADY resident, ready,
#                      multi-slot and wide enough, use it as-is: no lease, no
#                      unload, no X-MCP-Pin needed at all (a plain GET /api/status).
#                      Set false to always take the lease/unload path below.
#   lease: true        take a GPU lease for the whole run: the benched model and
#                      the judge are loaded onto lease_devices (default: every
#                      GPU) and nothing else can be planned there until the run
#                      ends; needs the X-MCP-Pin header
#   lease_devices:     [0, 1, 2, 3]   cards to lease
#   lease_idle_ttl_s:  7200           safety TTL (a keepalive touches the lease)
#   wait_busy_s:       600            how long to wait for a resident that is mid-request,
#                      or a same-or-higher priority tier refusing the lease outright
#                      (a refusal never makes this client escalate to force=true for
#                      either dialect — only the CLI's --force-evict or the
#                      force_evict policy below send it, from the first attempt)
#   restore_residents: true           reload residents the run evicted, at the end
#   Bench-first (opt-in; for a rig where the benchmark outranks everything):
#   force_evict: true                 every lease claim starts with force=true
#                      (idle residents are evicted, then reloaded at the end)
#   lease_devices_preferred: [0, 1]   lease only these cards when the rig's
#                      planner says the model fits there, else lease_devices
#   render_vacate_mcp: http://localhost:8700/mcp   image-server endpoint asked to vacate
#                      a render lease on the wanted cards (resumed afterwards)
#   busy_unload_after_s: 60           with force_evict: unload a resident still
#                      mid-request after this long (cuts its stream)
providers:
  lmstudio:
    type: lmstudio
    base_url: http://localhost:1234/v1
    api_key: lm-studio
  studioforge:                    # optional: a StudioForge rig (leases, load priorities); not needed for any run
    type: studioforge
    base_url: http://127.0.0.1:1234/v1
    api_key_env: STUDIOFORGE_API_KEY
  ollama:
    type: openai
    base_url: http://localhost:11434/v1
    api_key: ollama
  llamacpp:                       # StudioForge gateway / llama-server / any local OpenAI-compatible
    type: openai
    # StudioForge's OpenAI API is the GATEWAY on 1234 (its panel on 8080 does not
    # serve /v1). A bare llama-server listens on 8080 by default: use
    # http://127.0.0.1:8080/v1 only for that. If the gateway enforces API keys
    # add:  api_key_env: STUDIOFORGE_API_KEY   (sent as "Authorization: Bearer").
    base_url: http://127.0.0.1:1234/v1
  deepseek:
    type: openai
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    concurrency: 8
    # the provider's output maximum (one number, or {model_id: number}); budgets above it are clamped and the
    # row says so. Omitted: the /models listing, else the built-in documented value for api.deepseek.com
    # (393216, the Flash model's max_tokens range). A refusal that names a lower limit is retried once at it.
    max_output_tokens: 393216
    # a hosted provider: say where its protocol was read, and when
    docs: https://api-docs.deepseek.com/
    docs_verified: 2026-11-03          # YYYY-MM-DD: the last review
    # A remote API with a 1M context may lift the thinking budget the profile
    # sizes for a 32768-token local server (remote providers only):
    thinking_max_tokens_cap: 65536
    thinking_max_tokens_factor: 12
  # `hosted: true|false` on a provider entry overrides how it is treated: an `openai`-type server on a loopback,
  # private, tailnet (100.64/10), `.local` or single-label address counts as local (free, no judge cost line);
  # `hosted: true` says it is a billed API anyway (e.g. a hosted API reached through a private gateway).
  openrouter:
    type: openai
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    concurrency: 8
    headers: {HTTP-Referer: "https://github.com/your/crucibleforge", X-Title: "crucibleforge"}
  # Hosted runs that must not fall below ~Q6 precision: same API, endpoints pinned to 6-bit or better.
  openrouter-q5plus:
    type: openai
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    concurrency: 8
    extra_body:
      provider:
        quantizations: [fp6, int8, fp8, fp16, bf16, fp32]
        allow_fallbacks: false
  openai:
    type: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    concurrency: 8
    # gpt-5+/o-series refuse max_tokens and non-default sampling: rename/drop those body keys
    rename_params:
      max_tokens: max_completion_tokens
    drop_params: [top_p, temperature]
  # anthropic:                     # Claude via the NATIVE Messages API with prompt caching
  #   type: anthropic               # (crucibleforge/anthropic_native.py; x-api-key auth)
  #   base_url: https://api.anthropic.com/v1
  #   api_key_env: ANTHROPIC_API_KEY
  #   concurrency: 4
  #   headers:
  #     anthropic-version: '2023-06-01'
  # A Claude model row may price the cache: price: {input, output, cache_write, cache_read}
  # (defaults: write 1.25x input, read 0.1x input). Spend cap: CF_SPEND_CAP_USD;
  # per-call journal: CF_SPEND_JOURNAL (crucibleforge/spend.py).
  # Prompt caching on OpenAI-shape providers (2026-11-11): cached input tokens are
  # parsed from usage (OpenAI/xAI/MiniMax/OpenRouter prompt_tokens_details.cached_tokens,
  # DeepSeek prompt_cache_hit_tokens, Moonshot cached_tokens) and priced at the model's
  # price.cache_read (USD/1M); without it they are priced at list (an overstated cost).
  # Routing key per (model, case, repeat) so one episode hits one cache: automatic on
  # api.openai.com (prompt_cache_key), api.x.ai (header x-grok-conv-id) and openrouter.ai
  # (session_id); `cache_route: body:<field>` | `header:<name>` | off overrides it per provider.
  # api.x.ai gets a fresh key per REQUEST (`cache_route_scope: call`): on a sticky key xAI puts the
  # earlier turns' hidden reasoning back into each later prompt; `cache_route_scope: episode` restores it.
  # Spend cap, journal and CF_SPEND_ALLOW_CASES apply to every provider whose models carry a price.
  xai:                            # Grok (xAI's OpenAI-compatible API)
    type: openai
    base_url: https://api.x.ai/v1
    api_key_env: GROK_API_KEY
    concurrency: 8
  openwebui:                      # Open WebUI exposes an OpenAI-compatible API under /api
    type: openai
    base_url: http://localhost:3000/api
    api_key_env: OPENWEBUI_API_KEY
  minimax:                        # MiniMax's OpenAI-compatible API
    type: openai
    base_url: https://api.minimax.io/v1
    api_key_env: MINIMAX_API_KEY
    concurrency: 8
    max_output_tokens: 524288     # MiniMax-M3.1-Flash / M3 max_completion_tokens (see the deepseek entry)
    # reasoning_replay: true is the built-in default here (the provider is
    # pointed at MiniMax's API), so the chain is passed back to the model.
    # Set it to false to turn the protocol off for this provider, or true on
    # any other provider to turn it on.
    # MiniMax facts: temperature and top_p are IGNORED by the API (it always
    # uses 1 / 0.95); M2.5 / M2.7 retire on 2026-11-18, and M Plan / Token
    # Plan traffic to M2.5 / M2.7 is auto-routed to M3.1 Flash from
    # 2026-10-19 (CF cannot tell a route from the real model -- /v1 returns
    # the REQUESTED id).
    thinking_max_tokens_cap: 65536
    thinking_max_tokens_factor: 12

defaults:
  context_length: 32768   # for models without an explicit value
  min_tok_per_s: 1.0      # viability floor: abort a model measured slower than this (0 = off)
  # Thinking models spend the completion budget on CoT. A model entry may set
  # thinking: true|false|auto (default auto = flips on the first reply that
  # carries reasoning tokens); when thinking, every case's max_tokens is
  # multiplied by this factor (capped) so the answer is not cut off.
  thinking_max_tokens_factor: 4
  thinking_max_tokens_cap: 32768
  # StudioForge serves thoughts inline in `content` unless a request asks for
  # a reasoning_format. For every rig model that advertises the "thinking"
  # capability the bench requests this one (a model's own extra_body value,
  # even `none`, wins; null switches it off).
  rig_reasoning_format: deepseek
  # A thinking model that STILL hits the cap inside its reasoning (no content)
  # gets its answer recovered on the case budget (thinking disabled, then a
  # continuation). Off = score the empty reply. Per model: recovery: false.
  # The bench profile (3.8.0, regime: deployed) turns it OFF for the board.
  reasoning_overflow_recovery: true
  # Safety net for a STUCK connection: a row whose server sends nothing at all
  # for this many seconds is ended as errored (never cuts a model that is still
  # producing). 0 = off.
  stall_timeout_s: 300
  repeats:                # scored repeats per case, by category
    perf: 3
    rp: 2
    nsfw: 2
    coding: 1             # temp 0 — deterministic, one run is enough
    tooluse: 1
    instruct: 1
    reasoning: 1
    math: 1
    steer: 1
    overrefusal: 1
    longctx: 1
    planning: 1

# The benchmark itself (cases, budgets, judge, Chat/Coding weights) lives in
# profiles/bench.yaml — `crucibleforge all --models <label> --fresh --yes`.
# Its budgets override the `defaults:` above for every run. To change the
# Chat / Coding component weights for YOUR board only, uncomment:
# scoring:
#   chat: {rp: 20, nsfw: 20, explicit_peak: 5, willing: 5, steer: 5}
#   coding: {coding: 20, tooluse: 10, instruct: 10, reasoning: 5}

# Judge: `--judge provider:model_id` (or a candidate's name) picks any model,
# local or hosted, e.g. --judge openrouter:qwen/qwen3.8-27b (the priced
# candidate below). Without it the profile's judge is used. The scores published on MakoBench are judged
# by Qwen 3.8 27B run locally at 8-bit (Q8). A judge must accept the NSFW/RP
# rows; one that refuses them fails the calibration canary and the phase aborts.
judge:
  temperature: 0.0          # greedy + fixed seed: repeatable verdicts
  max_tokens: 4096
  samples: 3              # self-consistency: median of 3 judge passes per row (sample 0 greedy)
  sample_temperature: 0.7 # extra samples are drawn at this temperature, concurrently
  # back-off (seconds) before re-trying a judge that failed to LOAD — a
  # shared GPU box is often only transiently out of VRAM. A forced --judge
  # fails after this schedule instead of switching judges (--judge-fallback).
  load_retry_s: [15, 30, 60, 120, 180]
  # per-row ceiling for one verdict (all its retries share it); a row that
  # runs out is recorded as unscored instead of holding the judge phase
  row_timeout_s: 600
  candidates:
    # the 4.5 judge (profiles/bench45.yaml): the plain Qwen 3.8 27B, 8-bit, on the rig
    - {provider: studioforge, model_id: "unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q8_0", context_length: 16384, thinking: true}
    - {provider: lmstudio, model_id: "your-local-uncensored-judge", context_length: 16384}
    - {provider: deepseek, model_id: "deepseek-v4-flash"}
    - {provider: openrouter, model_id: "deepseek/deepseek-v4-flash"}
    # a named candidate is selectable with `--judge <name>`
    - {name: local-judge-q8, provider: lmstudio, model_id: "your-other-judge", context_length: 16384, thinking: true}
    # the 4.1 judge, kept by name only (`--judge gemma4-31b-heretic`)
    - {name: gemma4-31b-heretic, provider: studioforge, model_id: "llmfan46/gemma-4-31B-it-uncensored-heretic-GGUF/gemma-4-31B-it-uncensored-heretic-Q8_0", context_length: 16384, thinking: true}
    # any local or hosted model may judge (`--judge <name>`); MakoBench's published scores use the local Q8 judge
    # above, and rows judged by another model say which. Example: the same model through a hosted API
    # (`--judge qwen27-judge-openrouter`) for a machine that cannot run it. OpenRouter serves this model through
    # many providers at different precisions: the extra_body below asks for 8-bit or better (the local judge is
    # Q8_0). `thinking: true` as the local judge runs (profiles/bench45.yaml): with thinking off this route failed
    # the judge's explicit-text check (it rated the check's clearly sexual text 3, 5 needed, so NSFW rows stayed
    # pending) and classed fewer `judge-check` items right; with thinking on it rated it 6 and passed (probe
    # 2026-11-25). A verdict cut at its output ceiling is asked once more with four times the budget. A judge
    # entry with thinking off on OpenRouter is sent `reasoning: {enabled: false}` (OpenRouter ignores the
    # chat-template switch a local server reads). A judge call OpenRouter refuses ("prompt flagged") is left not
    # judged, never scored as the model's refusal. A hosted judge receives every reply it judges, the adult page (NSFW+) included, unless
    # --no-nsfw-plus is passed. It is billed apart from every model's Run cost and spend cap; without a price the
    # run says "judge cost not priced".
    - {name: qwen27-judge-openrouter, provider: openrouter, model_id: "qwen/qwen3.8-27b", thinking: true, price: {input: 0.04, output: 1.50}, extra_body: {provider: {quantizations: [fp8, fp16, bf16]}}}

# models under test.  price = USD per 1M tokens (the report's Run cost column).
# A flat-plan provider (billed per plan, not per token) adds `basis: list`:
# price: {input: 0.15, output: 0.60, basis: list} -> shown as ~$ (estimated at list price).
# A hosted model without `price` is refused at run start (--allow-unpriced overrides).
# Optional board tags (all three optional; the board works without them):
#   base: "Claude Opus"       the "Built on" tag: a hosted model's product line, or a local model's base weights
#                             ("Gemma 4 31B"); one line, 2-40 characters; display only
#   official: true            the vendor's own release (default true for a hosted model, false for a local one);
#                             only official models can be hidden as an older version; fine-tunes never are
#   supersedes: claude-opus-5 set on the NEWER model: the name of the model it replaces. The "latest versions
#                             only" box then hides the older one once the newer one has a rank.
# extra_body = per-model request fields (llama.cpp: reasoning_format: deepseek
# keeps a thinking model's CoT out of `content` so tool JSON/code stay clean).
models:
  - name: local-gemma-e4b
    provider: lmstudio
    model_id: google/gemma-4-e4b
    context_length: 8192
    tags: [local, small]

  - name: ollama-qwen3-8b
    provider: ollama
    model_id: qwen3:8b
    context_length: 32768
    enabled: false

  - name: deepseek-flash
    provider: deepseek
    # the API's canonical id since 2026-10 (`deepseek-v4-flash` and
    # `deepseek-chat` are aliases it resolves to this; GET /v1/models lists it)
    model_id: deepseek-flash
    context_length: 131072
    price: {input: 0.14, output: 0.28, cache_read: 0.003}   # cache_read: DeepSeek off-peak hit price, re-check the pricing page
    thinking: auto          # reasoning model → ×4 completion budget once detected
    # 3.8.0 benches with the model's DEFAULT sampler (nothing sent). Pin one
    # only where production pins it, e.g. sampler: {temperature: 0.3}
    tags: [remote, cheap]

  - name: deepseek-pro
    provider: deepseek
    model_id: deepseek-v4-pro
    context_length: 131072
    price: {input: 0.435, output: 0.87, cache_read: 0.022}   # off-peak hit price, re-check
    # `--judge deepseek-pro` uses this entry as a judge; the block sets what
    # differs for judging (thinking, temperature, top_p, extra_body, ...).
    # The judge context is 16384 unless set here, whatever context_length says.
    judge: {thinking: true}
    enabled: false
