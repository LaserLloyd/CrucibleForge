# CrucibleForge model registry — copy to ./models.yaml (or ~/.config/crucibleforge/models.yaml)
# and edit. API keys NEVER go in this file: name an environment variable with
# api_key_env. `crucibleforge status` shows what resolves.
#
# providers:  where models are served.
#   type: openai       any OpenAI-compatible /chat/completions server, no load
#                      management (DeepSeek, OpenRouter, OpenAI, Groq, Together,
#                      Mistral, Open WebUI /api, Ollama /v1, vLLM, llama-server,
#                      LM Studio if you don't want `lms` managing loads)
#   type: lmstudio     LM Studio managed via the `lms` CLI (one model loaded at a
#                      time, measured load time, snapshot/restore, wrong-model guard)
#   type: studioforge  llama.cpp multi-model server; loads the server's recommended
#                      placement profile (parallel slots) and runs that many
#                      requests at once (concurrency: auto)
#   concurrency: N     parallel requests for remote APIs (local servers: 1)
#   verify_model:      fail if the server answers from a different model id
#                      (default true for lmstudio/studioforge, false for openai)
#   headers: {...}     extra HTTP headers (e.g. OpenRouter's HTTP-Referer); ${ENV}
#                      placeholders are expanded (StudioForge: X-MCP-Pin for
#                      management calls from another machine)
#   extra_body: {...}  extra request fields for every model on this provider
#   StudioForge rig etiquette (type: studioforge):
#   use_resident: true  (default) if the target model is ALREADY resident, ready,
#                      multi-slot and wide enough, use it as-is: no lease, no
#                      unload, no X-MCP-Pin needed at all (a plain GET /api/status).
#                      Set false to always take the lease/unload path below.
#   lease: true        take a GPU lease for the whole run: the benched model and
#                      the judge are loaded onto lease_devices (default: every
#                      GPU) and nothing else can be planned there until the run
#                      ends; needs the X-MCP-Pin header
#   lease_devices:     [0, 1, 2, 3]   cards to lease
#   lease_idle_ttl_s:  7200           safety TTL (a keepalive touches the lease)
#   wait_busy_s:       600            how long to wait for a resident that is mid-request,
#                      or a same-or-higher priority tier refusing the lease outright
#                      (a refusal never makes this client escalate to force=true for
#                      either dialect — only the CLI's --force-evict or the
#                      force_evict policy below send it, from the first attempt)
#   restore_residents: true           reload residents the run evicted, at the end
#   Bench-first (opt-in; for a rig where the benchmark outranks everything):
#   force_evict: true                 every lease claim starts with force=true
#                      (idle residents are evicted, then reloaded at the end)
#   lease_devices_preferred: [0, 1]   lease only these cards when the rig's
#                      planner says the model fits there, else lease_devices
#   clawforge_mcp: http://localhost:8700/mcp   ClawForge endpoint asked to vacate
#                      a render lease on the wanted cards (resumed afterwards)
#   busy_unload_after_s: 60           with force_evict: unload a resident still
#                      mid-request after this long (cuts its stream)
providers:
  lmstudio:
    type: lmstudio
    base_url: http://localhost:1234/v1
    api_key: lm-studio
  ollama:
    type: openai
    base_url: http://localhost:11434/v1
    api_key: ollama
  llamacpp:                       # llama-server / StudioForge / any local OpenAI-compatible
    type: openai
    base_url: http://localhost:8080/v1
  deepseek:
    type: openai
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    concurrency: 4
    # A remote API with a 1M context may lift the thinking budget the profile
    # sizes for a 32768-token local server (remote providers only):
    thinking_max_tokens_cap: 65536
    thinking_max_tokens_factor: 12
  openrouter:
    type: openai
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    concurrency: 4
    headers: {HTTP-Referer: "https://github.com/your/crucibleforge", X-Title: "crucibleforge"}
  openai:
    type: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    concurrency: 4
  openwebui:                      # Open WebUI exposes an OpenAI-compatible API under /api
    type: openai
    base_url: http://localhost:3000/api
    api_key_env: OPENWEBUI_API_KEY

defaults:
  context_length: 32768   # for models without an explicit value
  min_tok_per_s: 1.0      # viability floor: abort a model measured slower than this (0 = off)
  # Thinking models spend the completion budget on CoT. A model entry may set
  # thinking: true|false|auto (default auto = flips on the first reply that
  # carries reasoning tokens); when thinking, every case's max_tokens is
  # multiplied by this factor (capped) so the answer is not cut off.
  thinking_max_tokens_factor: 4
  thinking_max_tokens_cap: 32768
  # A thinking model that STILL hits the cap inside its reasoning (no content)
  # gets its answer recovered on the case budget (thinking disabled, then a
  # continuation). Off = score the empty reply. Per model: recovery: false
  reasoning_overflow_recovery: true
  # Safety net for a STUCK connection: a row whose server sends nothing at all
  # for this many seconds is ended as errored (never cuts a model that is still
  # producing). 0 = off.
  stall_timeout_s: 300
  repeats:                # scored repeats per case, by category
    perf: 3
    rp: 2
    nsfw: 2
    coding: 1             # temp 0 — deterministic, one run is enough
    tooluse: 1
    instruct: 1
    reasoning: 1
    math: 1
    steer: 1
    overrefusal: 1
    longctx: 1
    planning: 1

# The benchmark itself (cases, budgets, judge, Chat/Coding weights) lives in
# profiles/bench.yaml — `crucibleforge all --models <label> --fresh --yes`.
# Its budgets override the `defaults:` above for every run. To change the
# Chat / Coding component weights for YOUR board only, uncomment:
# scoring:
#   chat: {rp: 20, nsfw: 20, explicit_peak: 5, willing: 5, steer: 5}
#   coding: {coding: 20, tooluse: 10, instruct: 10, reasoning: 5}

# Judge: first candidate whose provider is up, serves the model, and is not
# itself under test. A local UNCENSORED model is needed to score the NSFW/RP
# rows (hosted judges may refuse them — the calibration canary aborts if so);
# any small instruct model is enough for the `reference` rubric (hard
# questions with a gold answer). `--judge provider:model_id` forces one.
judge:
  temperature: 0.0          # greedy + fixed seed: repeatable verdicts
  max_tokens: 4096
  samples: 3              # self-consistency: median of 3 judge passes per row (sample 0 greedy)
  sample_temperature: 0.7 # extra samples are drawn at this temperature, concurrently
  # back-off (seconds) before re-trying a judge that failed to LOAD — a
  # shared GPU box is often only transiently out of VRAM. A forced --judge
  # fails after this schedule instead of switching judges (--judge-fallback).
  load_retry_s: [15, 30, 60, 120, 180]
  # per-row ceiling for one verdict (all its retries share it); a row that
  # runs out is recorded as unscored instead of holding the judge phase
  row_timeout_s: 600
  candidates:
    - {provider: lmstudio, model_id: "your-local-uncensored-judge", context_length: 16384}
    - {provider: deepseek, model_id: "deepseek-v4-flash"}
    - {provider: openrouter, model_id: "deepseek/deepseek-v4-flash"}
    # a named candidate is selectable with `--judge <name>`
    - {name: local-judge-q8, provider: lmstudio, model_id: "your-other-judge", context_length: 16384, thinking: true}

# models under test.  price = USD per 1M tokens (report shows total cost).
# extra_body = per-model request fields (llama.cpp: reasoning_format: deepseek
# keeps a thinking model's CoT out of `content` so tool JSON/code stay clean).
models:
  - name: local-gemma-e4b
    provider: lmstudio
    model_id: google/gemma-4-e4b
    context_length: 8192
    tags: [local, small]

  - name: ollama-qwen3-8b
    provider: ollama
    model_id: qwen3:8b
    context_length: 32768
    enabled: false

  - name: deepseek-flash
    provider: deepseek
    model_id: deepseek-v4-flash
    context_length: 131072
    price: {input: 0.14, output: 0.28}
    thinking: auto          # reasoning model → ×4 completion budget once detected
    tags: [remote, cheap]

  - name: deepseek-pro
    provider: deepseek
    model_id: deepseek-v4-pro
    context_length: 131072
    price: {input: 0.435, output: 0.87}
    # `--judge deepseek-pro` uses this entry as a judge; the block sets what
    # differs for judging (thinking, temperature, top_p, extra_body, ...).
    # The judge context is 16384 unless set here, whatever context_length says.
    judge: {thinking: true}
    enabled: false
