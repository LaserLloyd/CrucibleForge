# "bench" — THE benchmark. One run per model, two headline scores:
#
#   Chat   = RP, NSFW, Story, explicit peak, willingness, steer
#            (judged by Gemma-4-31B heretic Q8 + deterministic identity/continuity checks)
#   Coding = programs, tools, instruct, reasoning+math    (deterministic)
#
# One command per model:  uv run crucibleforge all --models <label> --fresh --yes
# The model is loaded once, every case is generated (longest categories first),
# then the judge scores the 24 chat rows. Target on an 8-slot 27B
# thinking model: generation < 20 min, judging < 20 min (README "Run time").
# Generation wall-clock is set by the longest single row: a 24576-token coding
# answer at ~30-34 tok/s per slot (measured on the rig's 27Bs, 8-way) is
# ~12-14 min; the other rows fit around it on the remaining slots. The three
# multi-turn chat sessions (6, 5 and 6 DEPENDENT turns) are the chat half's
# long pole, so they are scheduled first, alongside the coding rows.
#
# Case set (2026-09-23): the smallest set that still separates models — maintainer:
# "shrink the test, don't limit models". Budgets are unchanged from the old
# standard profile (thinking x4 up to 24576); the time box comes from FEWER
# cases, chosen on the 2026-09 board (30 models, graders fixed) by how well a
# case splits the field, especially the ~16 competent models. Dropped from
# the benchmark (they stay in the suite files): cases every competent model
# passes or nearly all do (TZ02/03/04/07/10, IZ02/07, RX08, RH5; CZ07 94%,
# CY01 81%), the weaker splitters of an already-covered skill (TZ05, IZ05,
# IZ06), cases (almost) no model passes (CZ01, CZ03, MH16, MH22) and long
# ones with few passes (CZ04, CZ10, MH01, MH20). Only 7 cases can run long (4 programs, 2 math, RX13) so they
# fit in ONE wave on an 8-slot model; they are scheduled first.
#   perf      the 4 speed probes (1 repeat)                 -> tok/s
#   programs  CZ02 CZ08 CZ09 (split the top 16: 56/62/50%), CZ05 (47% overall)
#   tools     TZ01 multi-step chain (53%), TZ06 parallel (63%), TZ08 injection
#             (67%), TZ09 rounding (60%) — the tool rows that still split weak
#             from strong; cheap
#   instruct  IZ01 IZ03 IZ04 IZ08 (43-47% overall, 75-88% of the top 16)
#   reason    RX13 (43%), RX02 (70%, cheap); math MH06 (37%), MH11 (33%)
#   chat      (3.4.0, docs/CHAT.md) — harder, fewer rows, each packing several
#             checks, with deterministic identity/continuity checks next to the judge:
#     rp      RPS1 6-turn session (retcon + who-knows-what + POV switch + recall),
#             RPS2 5-turn seat swap ("who's me and who's it", 2nd person),
#             RPX1 3-NPC ensemble with speech rules, RPX2 the user writes the NPC
#     nsfw    NX1 graphic scene under 10 craft constraints, NX2 negotiated rope
#             scene (POV/tense per section, limits regex-checked), NX3 tension
#             with NO explicit content, NMX1 6-turn ERP (never narrate the user,
#             OOC pacing, injury + limit continuity, recall)
#     story   ST1 ten required elements that must change the plot, ST2 continue
#             a given opening in the same voice keeping every planted detail
#     steer   S1-S3 unchanged
#   3.5.0 differentiation round (2026-09-25, docs/differentiation-2026-09-25.md):
#     every new case has >= 5 separately graded elements (per-element results
#     on the row; the case still passes only when all do):
#     steer   SX1-SX3 five-turn sessions, several rules at once (format + persona
#             + forbidden topic + an ALLOWED adjacent topic), spoofed authority,
#             an instruction hidden in a pasted document, a flattery/role wrapper
#     tools   TZ11-TZ13 ask for a missing required arg, say a tool doesn't exist,
#             fix args after a server error, chain args from a result, no call
#             on an irrelevant turn — one step = one element
#     reason  RX20 5 houses x 4 attributes (20 cells), RX21 find the two wrong
#             steps of a 10-step cost chain and correct it (7 answer numbers)
#             — one element per answer word
#     rp      RPX3 contradictory card lore + a secret the character can't know
#     nsfw    XP1-XP3 explicit peak (explicit at >= 3 of 4 points, vocabulary
#             variety, no fade/skip, a named act on the page; tagged
#             explicit_required), WL1/WL2 must-write dark-but-legal briefs
#             (degradation with on-page negotiation; villain POV) and their
#             must-refuse twins WL1R/WL2R (same brief + a real-world-harm
#             request; rubric safety, tagged willing) — feed the Explicit peak
#             and Willing formulas (report.explicit_peak_block / willing_block)
#   Replaced RP1-4, RPM1-2, N1-N4, NM1 (still in the suite files). Budgets:
#   2000 tokens a chat turn, 3000 a story; thinking models x4 (8000 / 12000 —
#   under the 24576 cap, so it never binds on chat).
name: bench
# A local, git-ignored profiles/bench.private.yaml may add PRIVATE components
# (cases in cases/private/, their weight, label and budgets) on top of this
# file — they count on the local board and are scrubbed from every public
# artifact (`crucibleforge report --public`). README "Private categories".
description: the single benchmark — Chat (judged + checks) + Coding (deterministic); < 20 min generation + < 20 min judging on an 8-slot 27B
# Judge (2026-09-24 comparison of 8 judge runs on the same 65 chat rows): the
# Gemma-4-31B heretic Q8 reproduces the former 122B judge's verdicts (per-dim
# MAD 0.73, offset -0.05, Chat within 2.1, same bottom-two) on the two 5090s
# only, ~4x faster per row, canary 46 s. Was Qwen3.5-122B-A10B heretic v2
# Q5_K_M (all four cards). Rows judged by the 122B must be re-judged
# (`judge --models all --force`) — the board flags mixed judges.
judge:
  provider: studioforge
  model_id: llmfan46/gemma-4-31B-it-uncensored-heretic-GGUF/gemma-4-31B-it-uncensored-heretic-Q8_0
  context_length: 16384
  thinking: true
# 3.8.0 "as deployed" (2026-10-24, runner.REGIME_DEPLOYED): the model is
# measured the way its maker says to run it — chat-template default thinking,
# the maker's RECOMMENDED sampler (`recommended_samplers` below; a registry
# entry may pin its own `sampler:`; no rule = nothing sent), the SAME budget for rig and hosted models (provider
# overrides ignored), a 16k floor for thinking models so short chat cases do
# not starve them, and NO thinking-off retry: an answer that never arrives
# scores as missing. Sampled answers vary, so the deterministic categories run
# 3 repeats (one case flip used to move Coding ~11 points).
regime: deployed
thinking_max_tokens_factor: 4
thinking_max_tokens_cap: 24576
thinking_max_tokens_floor: 16384
reasoning_overflow_recovery: false
# Escalation round ("Room" column, 2026-10-25, runner.DEFAULT_ESCALATION_RUNGS):
# after a run, every job whose answer ran out of the 24576 budget (thinking
# model, finish=length) is re-run at 65536, and what still runs out at 131072,
# the model reloaded with a wider context (fewer slots). Those rows never count
# on the board (same budget for everyone); Room = Overall with them swapped in.
# Maintainer: "smaller context with an increased retry round for anything that
# doesn't have enough". [] turns it off.
escalation_rungs: [65536, 131072]
# The maker's (or fine-tuner's) published sampler, first match wins (regex on
# "<provider>:<model_id>" or the label; runner.resolve_sampler). Maintainer
# 2026-10-25: "make sure we're using the recommended settings for all models".
# Why rules at all: llama-server takes temp/top_p/top_k from a GGUF's
# general.sampling.* keys (llama.cpp PR #17120) but none of these files sets
# min_p, so its built-in min_p 0.05 stayed on where Qwen/Gemma recommend 0, and
# Qwen's presence_penalty has no GGUF key. Values a card does not state are left
# to the GGUF/server, except min_p 0 for families whose maker publishes a
# transformers config (transformers has no min_p). Hosted APIs fix or ignore
# their sampler: nothing is sent. No rule (Noromaid, Celeste, Cydonia, SmolVLM,
# gemma-2-2b: their cards state nothing) = the server's defaults, stamped
# "default". Sources checked 2026-10-25.
recommended_samplers:
  - id: api-vendor-fixed
    match: '^(deepseek|minimax|moonshot):'
    sampler: {}
    source: https://api-docs.deepseek.com/guides/thinking_mode https://platform.minimax.io/docs/api-reference/text-openai-api https://platform.kimi.ai/docs/guide/kimi-k3-quickstart
  - id: readyart-dark-scarlett
    match: 'Dark(er)?-Scarlett'
    sampler: {temperature: 1.0, top_p: 0.92, top_k: 20, min_p: 0.0}
    source: https://huggingface.co/ReadyArt/Dark-Scarlett-27B-v3.0-GGUF
  - id: readyart-gemma4
    match: 'ReadyArt/(Omega-Arsenal|Swish|Wicked-Tutu)'
    sampler: {temperature: 1.0, top_p: 0.92, top_k: 64, min_p: 0.0}
    source: https://huggingface.co/ReadyArt/Swish-31B-Final-GGUF
  - id: loki-scotoma
    match: 'Loki-Scotoma'
    sampler: {temperature: 1.0, min_p: 0.02, top_p: 1.0, top_k: 0}
    source: https://huggingface.co/CrucibleLab/Gemma-4-31B-Loki-Scotoma-V2.0-Swa-4096-GGUF
  - id: split-untied
    match: 'Split-Untied'
    sampler: {temperature: 1.0, min_p: 0.03, top_p: 1.0, top_k: 0, repeat_penalty: 1.0, dry_multiplier: 0.8}
    source: https://huggingface.co/Blazed-Forge/Split-Untied-31B
  - id: artemis
    match: 'Artemis-31B'
    sampler: {temperature: 1.0, min_p: 0.08, top_p: 1.0, top_k: 0, repeat_penalty: 1.06}
    source: https://huggingface.co/Abiray/Artemis-31B-v1.2-GGUF
  - id: orion
    match: 'Orion-26B'
    sampler: {temperature: 0.9, top_p: 0.95, top_k: 64, min_p: 0.0}
    source: https://huggingface.co/TheDrummer/Orion-26B-A4B-v1.1 (temp) + google/gemma-4 base
  - id: joyfox-thinking
    match: 'JoyFox'
    sampler: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
    source: https://huggingface.co/joyfox/JoyFox-Qwen3.6-35B-A3B-RP-Aggressive
  - id: qwen3-moe-thinking
    match: 'Qwen3\.5-122B|Qwen3\.6-35B'
    sampler: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
    source: https://huggingface.co/Qwen/Qwen3.5-122B-A10B https://huggingface.co/Qwen/Qwen3.6-35B-A3B
  - id: qwen3-thinking
    match: 'Qwen3\.[68]|JAX-XORTRON'
    sampler: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0}
    source: https://huggingface.co/Qwen/Qwen3.8-27B https://huggingface.co/Qwen/Qwen3.6-27B
  - id: ling-thinking
    match: 'Ling-3\.0'
    sampler: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
    source: https://huggingface.co/trohrbaugh/Ling-3.0-flash-heretic
  - id: laguna
    match: 'Laguna-S'
    sampler: {temperature: 1.0, top_p: 1.0, top_k: 20, min_p: 0.0}
    source: https://huggingface.co/poolside/Laguna-S-2.1
  - id: deepseek-r1-distill
    match: 'DeepSeek-R1-0528-Qwen3-8B'
    sampler: {temperature: 0.6, top_p: 0.95, min_p: 0.0}
    source: https://huggingface.co/deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
  - id: hy-mt2
    match: 'Hy-MT2'
    sampler: {temperature: 0.7, top_p: 1.0, top_k: 0, min_p: 0.0, repeat_penalty: 1.0}
    source: https://huggingface.co/tencent/Hy-MT2-30B-A3B
  - id: qwen2.5-vl
    match: 'Qwen2\.5-VL'
    sampler: {temperature: 0.0, repeat_penalty: 1.05}
    source: https://huggingface.co/Qwen/Qwen2.5-VL-7B-Instruct (generation_config, greedy)
  - id: qwen2.5
    match: 'Qwen2\.5-'
    sampler: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, repeat_penalty: 1.1}
    source: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct (generation_config)
  - id: gemma4
    match: 'gemma-4|Goetia|Spectre|Broken-Tutu'
    sampler: {temperature: 1.0, top_p: 0.95, top_k: 64, min_p: 0.0}
    source: https://huggingface.co/google/gemma-4-31B-it
# reasoning-overflow recovery (re-ask the answer with thinking off) is skipped
# for these categories: 0 of 85 math recoveries ever produced a pass.
no_recovery: [math]
repeats: {perf: 1, rp: 1, nsfw: 1, story: 1, steer: 1, coding: 3, tooluse: 3, instruct: 3,
          reasoning: 3, math: 3}
max_tokens: {rp: 2000, nsfw: 2000, story: 3000, steer: 768, coding: 6144, tooluse: 1024,
             instruct: 768, reasoning: 4096, math: 4096}
cases:
  perf: [P1-tiny, P2-short, P3-gen, P4-longctx]
  rp: [RPS1-hollow-reach, RPS2-swap-seats, RPX1-card-table, RPX2-user-writes-npc, RPX3-ferry-at-veln]
  nsfw: [NX1-tuning-fork, NX2-juniper, NX3-thaw, NMX1-needle-and-gull,
         XP1-three-rooms, XP2-blindfold, XP3-named-peak,
         WL1-amber, WL1R-amber-twin, WL2-lighthouse, WL2R-lighthouse-twin]
  story: [ST1-ten-elements, ST2-green-door]
  steer: [S1-sfw-enforce, S2-stay-in-character, S3-sfw-pressure, SX1-harborline-ledger,
          SX2-brightdesk-pip, SX3-kestrel-wren]
  coding: [CZ02-segment-crossings, CZ05-optimal-bst-cost, CZ08-triple-substring, CZ09-range-kth]
  tooluse: [TZ01-contradicts-user-assumption, TZ06-three-parallel-one-turn, TZ08-doc-injection-no-exfil,
            TZ09-tax-round-half-up, TZ11-clinic-ask-then-correct, TZ12-stock-transfer-pallets,
            TZ13-meeting-dependent-args]
  instruct: [IZ01-logistics-47-words, IZ03-no-letter-e-three-lines, IZ04-lowercase-except-http,
             IZ08-two-questions-only]
  reasoning: [RX02-knights-knaves, RX13-recurrence-term, RX20-five-houses-four-attributes,
              RX21-flawed-cost-chain]
  math: [MH06-fermat-mod-prime, MH11-strings-no-adjacent-no-ABC]
# Weights of the two headline scores (0-100 each). To add a Chat component:
# add cases/<category>.json, a rubric in judge.RUBRICS, list the category
# under `cases:` above, and give it a weight here (README "Adding a Chat
# component"). models.yaml `scoring:` still overrides this block.
scoring:
  chat: {rp: 20, nsfw: 15, story: 10, explicit_peak: 5, willing: 5, steer: 5}
  coding: {coding: 20, tooluse: 10, instruct: 10, reasoning: 5}
