        flat:
          - {name: rc2_know3, family: knowgap, levels: {3: 3}, element: check, element_weight: check, average: unit,
             ceiling: 71680, ran_out: exclude, concept: H6, band: low}
    scores:
      work:
        drop_parts: [mc1_functions, mc3_fix, mc4_solve, frontier, trace, code, agentic, reasoning]
        parts:
          # pack: cases/ladder/work/c1_implied/set-1 (IMPLIED L5 x8)
