             ran_out: exclude, concept: H2, band: low}
      chat/h2_ledger:
        flat:
          - {name: rc2_ledger1, family: session_ledger, levels: {1: 3}, element: check, ceiling_per_turn: 16384,
             history_budget: 49000, ran_out: exclude, concept: H2, band: low}
