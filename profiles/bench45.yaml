             element_weight: check, average: unit, ceiling: 21000, deal: true, concept: C1, band: low}
          - {name: rt_implied3, family: implied, levels: {3: 9}, items_per_prompt: 3, element: check,
             element_weight: check, average: unit, ceiling: 21845, deal: true, concept: C1, band: mid}
          - {name: rt_implied3_top, seed_as: rt_implied3, family: implied, levels: {3: 12}, items_per_prompt: 3,
             element: check, element_weight: check, average: unit, ceiling: 21845, deal: true, concept: C1, band: mid}
          - {name: rt_implied5_pack, family: implied, levels: {5: 4}, element: check, element_weight: check,
             average: unit, ceiling: 65536, deal: true, ran_out: exclude, concept: C1, band: top}
      work/bk_trace:
