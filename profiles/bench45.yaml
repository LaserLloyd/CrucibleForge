  lockout: {label: Lockout, file: cases/ladder/nsfw/uncensored/lockout.json}
# Bonus packs (ladder.py): sets live in cases/ladder/<score>/<part>/set-N.json.
# Generated sets hold {"generator": {family, variant, rungs, per_rung}}; a set
# runs rung r+1 only when rung r scored >= rung_stop; a set unlocks at `unlock`.
# Run settings (2026-11-13, lead after EXP-20261113-25): identical for every rig model and recorded
# on the meta (`run_settings`, and the live `plan.kv_cache_type`). q8_0 KV doubles the slots that fit at
# 73,728 ctx (3090 pair: 4 slots). A provider's own `kv_cache_type` overrides; A/B pending (calibration).
run_settings: {kv_cache_type: q8_0}
# Subject placement (crucibleforge/subject_copies.py, EXP-20261113-44; design EXP-20261113-25): where the
# rig copies of a model under test go. Each copy is leased on exactly its cards (class 3, never force) and
# loaded explicitly there with the run's KV type and the widest slot count of its ladder that fits, at the
# run's context per slot; parity (file, template, sampler flags, KV, engine) is proven before the first job;
# one job pool across the copies; rows keep the canonical model id (`subject_copy` = audit). The judge
# schedule is DERIVED: subject copies off the judge's cards -> the judge runs beside generation
# (judge_overlap.py); on them -> judging after generation. Absent = the classic single-copy path.
# OFF until the lead picks P1/P2 (the 5090 sweep and EXP-44's two-copy run are pending):
# subject_placement:
#   match: 'Qwen3\.[68]-27B|27B.*Q8_0|Q8_0.*27B'   # models the cards hold at 73,728 ctx/slot; others: classic
#   copies:                                      # P1: one copy on the 5090 pair, judge beside it
#     - {name: a, devices: [0, 1], slots: [10, 9, 8]}   # serves as <model>@mb-a (admin-made alias, reused)
#   #  - {name: b, devices: [2, 3], slots: [4, 3]}      # P2: add a 3090 copy as <model>@mb-b (judging then waits)
#   # every copy is its own pre-created alias (copy_serve_id); a missing alias refuses the run by name.
#   # fits at 73,728/slot q8_0 (rig 2026-11-14): ~9-10 slots on the 5090 pair, 4 on the 3090 pair
#   judge: {name: b, devices: [2, 3], parallel: [4, 3, 2]}   # the profile judge, canonical id, on the 3090s
# Run length (SYSTEM-45 section 16, the owner R21): derived, not fixed. Compose to a 2.5-point margin of error
# (pass bar 5), most efficient design; ceiling a few hours on the rig (working figure 3 h, grading included).
# Reported, never asserted: each row and the staged board show measured minutes and margin of error.
default_run: {ceiling_minutes: 180, design_margin_points: 2.5, pass_margin_points: 5}
ladder: {unlock: 0.9, rung_stop: 0.5}
# INTENT-45 (owner 2026-11-21): each model's own accuracy. The 90% range of every score, from the model's own repeats
# (crucibleforge/accuracy45.py), should be within accuracy_target_pct of the score's maximum and is flagged above
# accuracy_limit_pct ("range x% (above the 5% limit)"); nothing is withheld. A pack opens when the TOP of that range
# reaches `ladder.unlock` of its part (DECISIONS amendment q). repeat_resamples = draws of the repeats-only bootstrap.
intent: {accuracy_target_pct: 2.5, accuracy_limit_pct: 5, repeat_resamples: 200}   # the owner 2026-11-14: "The unlock is .9." (the published 90% rule)
# One value for every bench45 composition (compositions cannot override `ladder`): a routed part's pack opens at 0.9
# of the part's weighted share and of every lower set; a section-gated pack (unlock_part) at 0.9 of its section.
# T7 had set 0.8 for the Frontier section gate; the owner's ruling replaces it.
# Custom tests (docs/CUSTOM-TESTS.md): a user's own categories, declared
# under `custom:` (usually in the git-ignored profiles/bench.private.yaml),
# shown as extra columns and added to Overall / a category only when their
# `include_in` says so. A private category without a declaration is a custom
# test of its own (include_in: none) — never part of NSFW, Chat or Overall.
# Partial credit (EVAL-FABLE M2): these components score the share of a
# row's parts instead of pass/fail — programs by hidden-test group (cases
# with grader_config.test_groups), tools by script step, instruct and
# reasoning by element (e.g. RX20's 20 positions), steer by its judge
# verdict + elements + checks. A row with no parts is its pass/fail.
partial_credit: [coding, tooluse, instruct, reasoning, steer]
# Errored rows (EVAL-FABLE M4): a row whose request failed counts as failed
# (never dropped and renormalised away); Notes say n/N, a resume re-runs them.
errored_rows: fail
# 4.5 (WP-13b): missing is not zero. An infrastructure-failed, empty, ctx_short,
# unjudged or judge-failed job leaves the scored rows; the model is `pending`
# (ranked: false) until it is re-run. A job that ran out of its budget is still
# the model's own failure. errored_rows above applies to profiles without this.
missing_rows: pending
# 4.5 board-time rescoring of stored verdicts (both absent on bench = 4.1 unchanged):
# a lone judge out-of-character flag no longer zeroes facts it passed with
# verified quotes unless the judge-side votes/quote or the format gate back it
# (rpdeep.ooc_flag_counts; verdicts without the judge-side keys keep the zeroing),
# and a stored element that failed only on quote verification is re-verified.
ooc_gate: votes
quote_recheck: true
# harness v2 board-time scoring (merged r2): Uncensored W/4 x (elements + checks), no_puppeting
# penalty item, stored element credits. Absent on bench (4.1): that board must not move.
scoring_rules: v2
# Long scenes (the eight 4.1 deep cases) graded the 4.5 way (scrub audit 2026-11-15, lead items 10-12; absent on
# bench = 4.1 unchanged): this profile's own overrides of shared case elements (rpdeep.apply_overrides) and a YES
# quote checked against the element's own turns (rpdeep.quote_in_own_turns). gold_quote reaches neither the judge
# prompt nor the board: a corrected gold moves no stored score; it fixes the example the gold-vs-question checks read.
quote_own_turns: true
rpdeep_overrides:
  RD4-kettle-saddle:
    # the gold now answers its own question (the koru / the name); the stored verdicts were judged on the question
    I1a-onsen-customs: {gold_quote: 'Your koru may be a problem at a lot of public baths, so ask first or book a private family bath.'}
    I2a-elfstedentocht: {gold_quote: 'That is the Elfstedentocht, the Eleven Cities Tour, and it only runs when the natural ice is thick enough.'}
    # "this year's birthday" has no antecedent in turn 12 (Pip? Theo? Mina?): unscored, the question cannot be fixed
    # without a new judge pass
    N2-pip-age-now: {scored: false}
    # the barometer read aloud digit by digit ("Nine-nine-six. Dropping.", Sonnet t3/t10)
    H2-barometer-aloud: {pattern_sub: ['\bnine[- ](?:fifty|sixty|seventy|eighty|ninety)', '\bnine[- ](?:fifty|sixty|seventy|eighty|ninety)|\bnine[- ]nine[- ]\w+\b|\bone[- ]oh[- ]\w+\b']}
  CC3-tea-hut:
    # 70-word cap on a two-sentence turn that asks for five facts and a sign-off (5 of 6 fail, the best included);
    # S1 is the sentence rule. As CC4 W2 (A5)
    W2-short-on-request: {scored: false}
  CC4-second-pitch:
    J2a-jet-lag: {gold_quote: 'You land at 07:05 on Friday off the overnight flight from Vancouver, so sleep on Friday and get an early night before the 8am start.'}
  RV1-three-at-the-table:
    # quote_turns widened where the element's own question spans replies (scrub owner confirmed 2026-11-15); the
    # strict own-turns check (quote_own_turns) reads these turns
    N1-others-do-not-know: {quote_turns: [1, 2]}
    CB1-the-mare-shoe: {quote_turns: [1, 2]}
    CB2-water-for-daro: {quote_turns: [1, 2]}
  RV2-skarren-hut:
    CB1-the-leaking-boot: {quote_turns: [2, 3, 4, 5, 6]}
    CB2-the-lost-glove: {quote_turns: [2, 3, 4, 5, 6]}
    # NO "if they say Tuesday" reads Dom's own lie against the table, and a correct relative answer ("the evening
    # after the lad") names no day: over-literal, 0 of 6; unscored (the question is what the judge saw). The shared
    # case already carries scored: false (pruned); this line keeps it unscored on 4.5 whatever the case file says
    E1-dom-arrived-wednesday: {scored: false}
    # compound question: the judge says yes on 5 of 6 models, both independent readers say no (EXP-20261115-39
    # Appendix B); a question fault like E1 and RD4 N2, unscored
    N1-nobody-else-tells: {scored: false}
  # Paragraph breaks (scrub pass 2, BACKLOG-46; SPEC-REALIGN-45 1.2): a correct reply whose paragraphs are separated by
  # a single line break was failed because the checks wanted a blank line (three stored rows: ref, qher, grok). Report-time
  # only: checks are neither case-hash nor grading-hash input, so no stored row goes stale.
  WR1-ninth-string:
    Z5-last-paragraph-20-words: {pattern_sub: ['(?:\A|\n[ \t]*\n)\s*(?:', '(?:\A|\n)\s*(?:']}
  WR2-red-thread-key:
    P2-three-paragraphs: {pattern_sub: ['\A\s*\S[^\n]*(?:\n[ \t]*\S[^\n]*)*(?:\n[ \t]*\n\s*\S[^\n]*(?:\n[ \t]*\S[^\n]*)*){2}\s*\Z', '(?:\A\s*\S[^\n]*(?:\n[ \t]*\S[^\n]*)*(?:\n[ \t]*\n\s*\S[^\n]*(?:\n[ \t]*\S[^\n]*)*){2}\s*\Z)|(?:\A\s*\S[^\n]*(?:\n\s*\S[^\n]*){2}\s*\Z)']}
# Agentic history (CACHE-COMPACT, 2026-11-12; absent on bench = the 4.1 per-turn rule):
# past 60% of the case's conversation cap the oldest tool results are shortened in ONE
# step down to about 40%, then nothing earlier changes until it has grown by 20% again,
# so prompt caches keep the prefix (codeenv.compact). The rule is in the system prompt.
compaction: hysteresis
headline:
  # step 8 (review A Q6): 200 draws of the item bootstrap, not 1000. It feeds only the item-sampling second figure,
  # the rank ties and the pack-gate counts' display; the printed range comes from replicate runs. A render was
  # 13-15 minutes on one core, most of it in these draws.
  resamples: 200
  variance_components: true      # case / generation / judge-sample spread in report.json
  separation_top_n: 10           # simultaneous (max-statistic) pair intervals
  overall: sum          # Overall = Coding + Chat on the 0-10 scales (max 20 without packs)
  # 4.0 Class (from Overall) and Lean (Chat - Coding), headline.capability_class /
  # headline.lean. Bands set from the 4.0 board on the 2026-10-31 results
  # (DeepSeek 17.2-17.6, best locals 14.3-14.9, MiniMax + other locals 11.4-12.2);
  # re-check once the CL function set has rows (it is half of Coding).
  classes: {S: 16, A: 13, B: 10, C: 0}
  # Lean = (Chat - board median) - (Coding - board median), tagged at >= 1.5
  lean_gap: 1.5
# Calibration (`crucibleforge calibrate`): a sub-score the reference model
# scores >= too_easy on is flagged "too easy: rethink difficulty / add
# examples" (the maintainer: "if minimax aces any section we need to rethink").
calibration:
  reference: minimax-m3
  too_easy: 0.9

# ---- Judge policy (step 5 judge) ----
# Per-row judge sample policy (judge.judge_policy, EVAL-FABLE S6). Derived from
# each row's rubric / elements / case tags, never from case ids:
#   craft-only rows (dimensions only)                      -> samples 1
#   an element decides a binary component (flag element,
#   willing / explicit_required tag + elements), PRIVATE
#   elements, willingness (W 0-4) rows                      -> samples 3
#   element/flag-only calls (no 0-10 dimensions)            -> samples 1, thinking
#                                                              off, max_tokens <= 4096
# An explicit `--samples N` overrides every row's count. The verdict records the
# policy used as judge["policy"]. samples3_rows / samples1_rows are case-id
# override lists (3 wins).
judge_policy:
  enabled: true
  # 4.5 (WP-13): samples by element class; craft elements stop at a sequential majority
  element_class: {fact: 1, craft: 3}
  sequential_majority: true
  craft_samples: 1
  binary_samples: 3
  private_samples: 3
  flag_only_thinking_off: true
  flag_only_max_tokens: 4096
  flag_only_exclude_rubrics: [reference]
  # 4.5 fix pass (review F10): the 4.1 samples3_rows / samples1_rows case-id
  # lists are dropped here. Sampling is by element class (above); a
  # willingness row follows binary_samples. The lists live on in bench.yaml.
  long_canary: true
  # cut-ladder rung 2 (PLAN-45-v3 2.5), OFF by default: `turn_window` merges the
  # fact elements of one turn window into one judge call (rpdeep.fact_groups)
  # fix pass: bench45 gates its judge on the public level-6 canary (>= 5) and
  # stores the OOC evidence rpdeep's rescue needs (refused / ooc_quote / votes)
  public_canary: true
  ooc_evidence: true
  # 4.5 (PLAN-45-v4 section 5): element-only judge, <= 8 fact elements per call,
  # thinking off, 800 tokens (400 cut 8-element verdicts with long quotes, 2026-11-14), one sample; a model family never judges its own
  # family's rows (D15).
  # judge call grouping: the fact elements of one turn window share one call
  group_facts: turn_window
  group_window: 4
  mode: elements
  elements_batch: 8
  elements_max_tokens: 800
  self_judge_by_family: true
  self_judge_families: {grok: xai, xai: xai, gemma: google, google: google, qwen: qwen,
                        deepseek: deepseek, kimi: moonshot, moonshot: moonshot,
                        claude: anthropic, anthropic: anthropic, minimax: minimax,
                        gpt: openai, openai: openai}

# ---- Run plan (step 5 runner) ----
# How `all` runs a model (crucibleforge/runner.py run_plan(); EVAL-FABLE M7, S8, S10).
run_plan:
  # Rig models: the rows that need a wide window (code-bank rows: bank_budget
  # 65,536 -> ctx 73,728; ladder sets with a budget or context) run in their
  # own load round AFTER the standard rows, which load at context_floor
  # (40,960), where the rig gives 8 parallel slots instead of 4 (STEP4).
  # Hosted APIs (nothing is loaded) always run one round.
  # 4.0 lite (time budget, 2026-10-31): ONE load at the bank window (73,728)
  # instead of two rounds and a reload. The 3.9 rounds showed the rig gives
  # gemma-26b / trohrbaugh-122b 8 slots at 73,728 too and omega-31b 4 at both,
  # so the split only cost the second round's tail (gemma -12 min, troh -28).
  # A model the rig serves with fewer slots at 73,728 runs slower; the planner
  # times it from its measured workers (estimate.measured_speed).
  split_rig_rounds: false
  # One output budget per row for every model (S8): a model the run does not
  # see as a thinker gets the same board budget (case x factor, floor, cap)
  # as one it does; bank rows keep bank_budget, ladder rows their set budget.
  one_budget: true
  # Escalation is opt-in (`all --escalate`, `bench-all --escalate`); a rung
  # round's requests are cut at this wall clock (a 131k rung at 30 tok/s
  # is over an hour) and the row is scored as run out, not errored.
  escalation_max_wall_s: 2700

# ---- Time budget (PLAN-45-v3 section 9.3; WP-07 implements `crucibleforge budget`) ----
# Gates apply to the MAIN test only; hard sets are reported separately.
budget:
  anchor: trohrbaugh-122b-heretic
  anchor_tps_stream: 12.3        # measured, tok/s per stream
  anchor_slots: 8
  occupancy: 0.92                # assumed
  anchor_load_min: 1.25          # measured
  anchor_limit_min: 49.5         # target 45 + 10%
  board_avg_limit_min: 33        # target 30 + 10%
  judge_rate_calls_per_min: 5.9  # measured before GJ
  # pilot models: PROXY = median over these of (their tokens x their anchor ratio)
  # nominal tokens = median output tokens of these non-thinking models (PLAN 1)
  reference_models: [deepseek-flash, minimax-m3-1-flash, gemma-26b-qat, dark-scarlett-27b-v3.0-q8-0-hb16]
  # home budget (REPORTED, 2026-11-14): 20 tok/s, one slot (PLAN 1; judge_s measured in WP-7). The enforced
  # limit is default_run.ceiling_minutes (R21: derived, never a fixed 30), so no limit_min here or under rig.
  home: {tps: 20, slots: 1, judge_s_per_call: 25, load_min: 3}
  # rig budget from anchors/rig_throughput.yaml (EXP-20261113-25, measured 2026-11-13): reference on the
  # 3090 pair, ctx 73728/slot, q8_0 KV, MTP: 131.7 tok/s aggregate at 4 slots (= 32.9 per stream).
  # The M1 placement (5090 pair, 8-10 slots) is ESTIMATED at 260; replace with a measured row when swept.
  rig: {tps: 32.9, slots: 4, load_min: 2}
  hosted_occupancy: 0.9          # assumed (board model, hosted APIs)
  tail_contention_b: 0.3105      # measured: per-stream speed s(n) = s1 / (1 + b (n-1)), anchor only
  targets: budget/targets-45.json     # committed per-case design targets (ESTIMATE source)
  reference: budget/reference.json    # committed digest of per-model speeds and per-case tokens
  # A8 request 1: a reference model that thinks is not a NOMINAL source (its answer tokens are a
  # different quantity); the digest carries thought_share per model (scripts/budget_thinkoff rule).
  # Until a thinking-off reference run exists (S12) every Core item reads its committed target.
  thinking_off_required: true
  max_thought_share: 0.02
# Automatic per-model board notes (crucibleforge/notes45.py): zeros with their
# cause, category refusals, a closed list of abnormalities.
notes: {zeros: true, refusals: true, anomalies: true}
