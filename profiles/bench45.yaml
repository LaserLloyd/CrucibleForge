        flat:
          - {name: rc2_trace4, family: tracevm, levels: {4: 3}, ceiling: 71680, ran_out: exclude, concept: C2, band: low}
          - {name: rc2_trace6, family: tracevm, levels: {6: 3}, ceiling: 70656, ran_out: exclude, concept: C2, band: mid}
          - {name: rc2_trace8, family: tracevm, levels: {8: 3}, ceiling: 69632, ran_out: exclude, concept: C2, band: mid}
