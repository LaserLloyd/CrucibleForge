      code: {label: Functions packs, short: Func+, max: 0, scoring: [coding], unlock_part: work}
      agentic: {label: Tool use packs, short: Tools+, max: 0, scoring: [tooluse], unlock_part: work}
      reasoning: {label: Predict + bug hunt packs, short: Predict+, max: 0, scoring: [codebank, codeagent],
                  unlock_part: work}
  chat:
