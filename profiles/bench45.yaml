  # rc2-main (Admin G2, lead 2026-11-14 evening; READINESS.md "Path to 4.5"): ONE FIXED SET for every model, no
  # routing (the rc1 locator straddled on every run and cost half the run: G2 locator note). Packs open per part at
  # ladder.unlock (0.9) of the part's own weighted share, then set by set, as on the published site. Fresh set names
  # (rc2_*) = fresh seeds: tonight's runs are an honest test of G2's predictions.
  # Ceilings (the owner R23, limit turns not tokens): every single-prompt cell at what the 73,728
  # window allows after its largest measured prompt (rounded down to 1,024); `ran_out: exclude` + the 25% unit rule
  # (scale: a cell where >25% of a model's units ran out reads "not measured"). Largest measured prompts: IMPLIED
  # L1:x3 1,686; TRACEVM L4 1,887 / L6 2,641 / L8 3,213; KNOWGAP L3 1,521. IMPLIED L1:x3 is a packed prompt: the
  # engine caps a packed prompt at chains.MAX_PROMPT_CEILING = 65,536 (21,845 x 3). Sessions keep their measured
  # per-turn ceilings (16,384; ledger history <= 49,000), inside the window. CB-C5 runs at the profile's bank_budget
  # (65,536; largest stored reply 28.2k). The empty-reply rule is the profile's (X's on_empty_stop): not overridden.
  # PYTRAP out (half the reference's units never converge: "not measured" every other run, and the run's long pole);
  # C3 out (gameable until the forgery fix; carrying patchfix L5 costs the reference ~51k tokens a unit). C5 "uses
  # tools" has no standard cell: TZ16 cannot run on the Claude Code route. CB-C5 is a stored code-PREDICTION case
  # (what does this program print), so its part is labelled as such (G2: it was called "C5" in the sizing note).
