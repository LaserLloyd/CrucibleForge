  # ---- rc1-main (Admin G2, g2-3, lead 2026-11-14 ~13:00): THE rc1 Main composition, one routed command per model.
  # DRAFT: decisions are in the g2-3 patch note; lines marked PENDING change when their rows land.
  # Packs (the owner 2026-11-14, the published 4.x rule): a part's pack = harder levels of that part's own families, a 4.x
  # ladder set file per part (cases/ladder/<section>/<part>/set-N.json, generator blocks + seed_case = today's measured
  # instances byte for byte), 1 point each, added on top of the part, its section and Total; it opens when the part's
  # standard share reaches `ladder.unlock` (bench45 top level; 0.9 = the published 90%, the owner 2026-11-14) and the model's
  # route reached the part's `unlock_from` module or a higher one (lead's rule: unlock_from = the lowest module holding
  # the part's hardest standard cells; modules are alternatives, so 'reached' is ordinal: low < mid < top). No pack sets in the routing; no max-0 pack parts. Part keys are
  # rc1-main's own (c1_..., h1_...) so main-routed's parts never see these packs. A part with no usable pack content
  # has no pack in rc1 ("we will add packs in the future as needed").
  rc1-main:
    # routed (scale.units): the plain cut rule only; zero + routing is refused at load (not part of 4.5)
    cut_at_full_budget: omit
    cases:
      perf: [P1-tiny, P2-short, P3-gen, P4-longctx]
      tooluse: [TZ16-pickup-dst-delay]
    core_generated: []
    # the owner 2026-11-14 (review of the build against his words and the site, all ten points: "I agree with your
    # recommendation. continue on until corrected"): rc1 is an INTERNAL candidate; gameable cells carry no points
    # until fixed (C3 patchfix L5 -> 0, measured only; Coding renormalised to 10: C1 5.9, C2 2.9, C5 1.2); the
    # planted_opt pack (C2 set-2) is closed. Labels and points only: no instance changed (tests pin every id and
    # instance against tests/fixtures/rc1_main_rc1_tree_instances.json).
    board_notes:
      status: "internal candidate: the reference sits near the top of Main; Chat is missing its judged, real-person, scene-change and planning parts; packs are staged pending the owner's review"
      work_main: "Repairs code (C3) is measured but carries no points in this candidate (patchfix L5 can be passed without a real repair); Coding = Builds what was meant 5.9 + Reads and traces code 2.9 + Uses tools 1.2."
      main_regime: "Main runs every model as its card prescribes, thinking on (the owner 2026-11-13). Run length is derived from the margin-of-error bar (2.5 points design, 5 pass); each row shows its measured minutes."
    routing:
      calibration: calibration/calibration-g2-3b.json
      section: all
      locator: [rt_implied_loc, rt_pytrap_loc, rt_state_loc, rt_istack_loc]
      modules:
        - {name: low, sets: [rt_implied_lo, rt_pytrap_lo, rt_state_lo, rt_istack_lo2, rt_istack_lo4, rt_attend_lo,
                             rt_ledger_lo, rt_know_lo, rt_scene_lo, patchmini_c3lo, patchmini_c3mid]}
        - {name: mid, sets: [rt_implied1, rt_implied3, rt_pytrap_mid, rt_patchfix5, rt_state_mid, rt_istack_mid,
                             rt_ledger_mid, rt_know_mid, rt_scene_mid, rt_mini1_mid, rt_mini2_mid]}
        - {name: top, sets: [rt_implied3_top, rt_pytrap_top, rt_state_top, rt_istack_top7, rt_istack_top8, rt_attend_top,
                             rt_ledger_top, rt_know_top, rt_scene_top, rt_mini1_top, rt_mini2_top], unlock: true}
      cuts: [-1.0, 0.6]
      straddle: half
    # SIZE B (lead 2026-11-14, the owner's "most efficient" rule): mid and top thin the cells where the reference and the
    # strong models sit at the ceiling -- session_state L10 mid 10->4 / top 8->4, istack mid L4 5->2 + L7 5->4 (6 -> 3
    # prompts), top L7 5->4, ATTEND L9 off the mid route (reference .98), ATTEND L10 off the top route (reference L9 .98 /
    # L11 .92 / L12 .96: L10 adds nothing). Thinning = lower counts on the same seeds: every remaining case is a g2-3
    # case with the same instance (tests/fixtures/rc1_main_g2_3_instances.json). KNOWGAP stays at 4 (H6's pack gate
    # floor; 13k tokens). The low route is NOT thinned: its cells are where weaker models differ. Code is not thinned.
    # SIZE A (~30 min, NOT adopted: the owner's call) would further set, on mid: IMPLIED L1 4->2 prompts, L3 3->2, PYTRAP
    # mid 4->3, patchfix L5 2->1, state 4->2, istack 3->1 prompt, ledger L2 4->3.
