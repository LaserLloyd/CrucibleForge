        flat:
          - {name: rc2_know3, family: knowgap, levels: {3: 3}, element: check, element_weight: check, average: unit,
             ceiling: 71680, ran_out: exclude, concept: H6, band: low}
      # Role-play (5): the nine 4.1 role-play cases of cases/rp.json (RP1-RP4 one reply, RPM1/RPM2 three scripted
      # turns, RPX1-RPX3 one scene reply), reused by id through the jcard family. 9 cards x 2 seeds.
