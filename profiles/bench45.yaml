# MakoBench / CrucibleForge 4.5 (draft, WP-05). Every score is /10 = a standard
# 8 + a hard 2 (PLAN-45-v2 section 6.1). Same 29 public main cases as 4.1; the
# hard sets are cases/hard/<score>/4.5.json (empty until WP-16). Overall =
# Coding + Chat (NSFW never in the total). No ladder: block (packs are the
# unit of authoring and rotation, not bonus points). 4.1 (bench.yaml) is
# untouched. Hard-part SCORING lands in WP-13b; until then `scores.<s>.hard`
# is declared and verified but not summed.
name: bench45
description: "4.5: Coding /10 + Chat /10 = Overall /20; NSFW /10 separate; generated bonus packs on top"
release_seed: "4.5.0"   # bumping it regenerates every seeded instance
# case tree: the live cases/ (bench = the frozen archive/4.1.0/cases)
cases_dir: cases
# The one judge (owner 2026-11-21, amendment r): the plain Qwen 3.8 27B, 8-bit. It is also the board's reference
# model, so its own rows are graded by itself and carry a note. Gemma 4 31B heretic (the 4.1 judge) stays a named
# candidate in models.yaml, never the default.
judge:
  provider: studioforge
  model_id: unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q8_0
  context_length: 16384
  thinking: true
  # 4.5: a hard-set judge call may take longer (v3 section 4)
  row_timeout_s: 1200
# 3.8.0 "as deployed" (2026-10-24, runner.REGIME_DEPLOYED): the model is
# measured the way its maker says to run it — chat-template default thinking,
# the maker's RECOMMENDED sampler (`recommended_samplers` below; a registry
# entry may pin its own `sampler:`; no rule = nothing sent), the SAME budget for rig and hosted models (provider
# overrides ignored), a 16k floor for thinking models so short chat cases do
# not starve them, and NO thinking-off retry: an answer that never arrives
# scores as missing. Sampled answers vary, so the deterministic categories run
# 3 repeats (one case flip used to move Coding ~11 points).
regime: deployed
# The tool-use revision (lead 2026-11-15 08:27): a tool call at a step that wanted a reply is fed back to the
# model with "not executed: tools are not available at this step" for EVERY provider and the rig (before, only
# reasoning-replay providers were told; the others saw an empty turn). It changes what is sent, so a stored
# tool-use row of this profile without the stamp reads stale and is re-made (version.tool_revision_current).
# 4.1 (profile bench) has no such key and is unchanged. LAG1/LAG2 run in the code-agent loop (no prose steps).
tool_call_feedback: all
# 4.5 engine (WP-13a): thinkers default to a 73,728 window (D14); judged cases run first so the
# judge overlaps generation; a context-truncated row is retried once, then errored (never scored).
thinker_context: 73728
judged_first: true
ctx_short_retry: 1
# M1 early stop (R3, crucibleforge/earlystop.py): from the 20th COMPLETED answer
# of a model's run START up to the 30th, stop the model if more than half its
# answers are blank (no answer in content, nor a finished answer in the
# reasoning channel), more than a fifth have a cut-off or missing answer (budget
# ran out; a long think that still answered does not count), or more than a
# quarter put a finished answer in the reasoning channel (template trap). Rows
# are kept, the meta gets `early_stop: {signal, value, threshold,
# after_answers}` and `publishable: false`, the batch goes on. Targeted reruns
# (a subset of this profile's cases), recover rounds and escalation rungs are
# not judged. Window order = completion order with the longest jobs started
# first (runner.schedule_jobs), NOT easy items first: re-calibrate with the
# replay tool when the packs change. Evidence: Nanbeige4.3-33B 2026-11-13;
# replay on every stored board run, lab EXP-20261113-14 (replay-v2: Nanbeige
# trips, 0 of 72 good run starts).
early_stop:
  enabled: true
  after_answers: 20
  max_answers: 30
  blank_rate_gt: 0.50
  token_limit_rate_gt: 0.20
  misrouted_rate_gt: 0.25
thinking_max_tokens_factor: 4
thinking_max_tokens_cap: 24576
thinking_max_tokens_floor: 16384
reasoning_overflow_recovery: false
# Escalation round ("Room" column, 2026-10-25, runner.DEFAULT_ESCALATION_RUNGS):
# after a run, every job whose answer ran out of the 24576 budget (thinking
# model, finish=length) is re-run at 65536, and what still runs out at 131072,
# the model reloaded with a wider context (fewer slots). Those rows never count
# on the board (same budget for everyone); Room = Overall with them swapped in.
# Maintainer: "smaller context with an increased retry round for anything that
# doesn't have enough". [] turns it off.
# 4.0 lite: ONE retry, at the next rung only, in a single pass at the end of a
# bench-all run (--escalate); no per-model inline escalation (3.9 spent 85 min
# on one model re-running at 64k and 128k).
escalation_rungs: [65536]
# 4.0 (3.8's rule restated, Fable concept review): a row that ran out of the
# board budget counts as failed on the board even after its retry; the retry
# counts only in the Room column (Overall with it swapped in). "As deployed":
# no coding-specific thinking cap to dodge overflow.
# 4.0 lite (validation 2026-10-31: 11 of 18 local CL rows hit 24,576 before
# writing any code): the CL function cases carry their own "budget": 65536 in
# cases/coding.json — one pass, load widened to 73,728, no retry rung (the maintainer:
# "I don't want to handicap a model based on how long it thinks").
escalation_on_board: false
# The maker's (or fine-tuner's) published sampler, first match wins (regex on
# "<provider>:<model_id>" or the label; runner.resolve_sampler). Maintainer
# 2026-10-25: "make sure we're using the recommended settings for all models".
# Why rules at all: llama-server takes temp/top_p/top_k from a GGUF's
# general.sampling.* keys (llama.cpp PR #17120) but none of these files sets
# min_p, so its built-in min_p 0.05 stayed on where Qwen/Gemma recommend 0, and
# Qwen's presence_penalty has no GGUF key. Values a card does not state are left
# to the GGUF/server, except min_p 0 for families whose maker publishes a
# transformers config (transformers has no min_p). Hosted APIs fix or ignore
# their sampler: nothing is sent. No rule (Noromaid, Celeste, Cydonia, SmolVLM,
# gemma-2-2b: their cards state nothing) = the server's defaults, stamped
# "default". Sources checked 2026-10-25.
# 4.5 reasoning replay (crucibleforge/replay_rule.py, EXP-20261114-11): whether a
# model gets its earlier reasoning back in a multi-turn conversation follows ITS
# OWN chat template at default settings (rendered without a GPU at plan time and
# recorded per model with the template's sha). These rules override the render
# where the maker documents something else (source: card) or a hosted API states
# its protocol (source: api-doc). Tool-call turns always carry their reasoning
# (runner._assistant_tool_turn), whatever the rule says for plain chat.
reasoning_replay_rules:
  - id: nanbeige4-chat
    match: "(?i)nanbeige4"
    value: false
    source: card
    url: https://huggingface.co/Nanbeige/Nanbeige4.3-33B
    quote: "`preserve_thinking` controls whether reasoning from previous assistant turns is retained in a multi-turn conversation. We recommend `False` for general chat and question answering, and `True` for multi-turn tool use, office tasks, and code-agent workflows."
  - id: flint-card
    match: "(?i)(^|/)(unsloth/)?flint"
    value: true
    source: card
    url: https://huggingface.co/RecursiveSI/flint
    quote: "Use the checkpoint's chat template and preserve returned `reasoning_content` in conversation history."
  - id: minimax-api
    match: "(?i)^minimax-"
    value: true
    source: api-doc
    url: https://platform.minimax.io/docs/guides/text-m2-function-call
    quote: "the complete model response (i.e., the assistant message) must be appended to the conversation history"
  - id: kimi-k3-api
    match: "(?i)^kimi-k3"
    value: true
    source: api-doc
    url: https://platform.kimi.ai/docs/guide/use-kimi-k2-thinking-model
    quote: "`kimi-k3.1-pro` and `kimi-k3` always enable Preserved Thinking."
  - id: deepseek-api-chat
    match: "(?i)^deepseek-v4"
    value: false
    source: api-doc
    url: https://api-docs.deepseek.com/guides/thinking_mode
    quote: "`reasoning_content` does not need to be passed back; even if passed to the API, it will be ignored"
