      character: {label: Character, short: Char+, max: 0, scoring: [rpdeep], cases: [], unlock_part: chat}
      writing: {label: Creative writing, short: Writing, max: 0, scoring: [rpdeep], cases: [], unlock_part: chat}
  nsfw:
    label: NSFW
    in_total: false
    parts:
      # MAIN NSFW: pending owner decision (J7); the four parts hold no cases until main_nsfw.enabled
