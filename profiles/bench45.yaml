      judged: "Judged parts: the judge's craft rubric with judge thinking off, two writer seeds per card; a role-play piece scores its weakest live mark / 10 (character, agency and consistency are left out: every capable model maxes them), a real-person piece its one mark / 10, a card the mean of its two pieces. Sounds like a real person is PROVISIONAL: whether short texts from small models truly read more human is going to the owner as a blind check, and the part stands only when he answers."
    chains:
