  # rc3-main (Admin G2, lead 2026-11-14 late): rc2-main with Predict on THREE stored programs instead of five
  # repeats of one (CB-C5 rested 2 Coding points on 5 graded questions: +-0.8, the largest term in Coding's margin).
  # CB-C5 (Python, 5 graded) x2 + CB-C6 (node, 8) x2 + CB-C3 (sqlite, 6) x1 = 19 graded questions, the same 5 calls.
  # C6 / C3 graders are proven on the 4.x board (C6 on 70 models; C5-vs-C6 shares correlate .88 there); C1 (python)
  # and C4 (bash) have never been run anywhere and stay out until their graders are proven. Every generated cell
  # keeps rc2's set names = rc2's instances (fresh seeds only for cells that change: none here), so rc2 rows count.
  # N2 (lead 2026-11-14 night; JUDGE's EXP-20261114-34 + SPEC-for-engine.md) adds Chat's judged parts and the adult
  # page on one judging: chains `judge_mode: rubric` = the rubric's 0-10 axes only, judge thinking OFF, output cap 1,024,
  # one judge sample, no element list in the prompt; piece = mean of the part's axes / 10 (constraints and explicitness
  # never in it; erotic only on a card whose brief has sex). TWO WRITER SEEDS PER CARD: set *_s2 asks the same cards as
  # *_s1 (seed_as) at creative seed 2 (gen_seed); `se_cluster: card` averages a card's two pieces, and the card (both
  # pieces together) is the unit the SE and the headline bootstrap resample. No rc2 cell or seed changes.
  # RETIRED at the cut (standard is built on it; never the default)
  rc3-main: &rc3main
    cases: &rc3cases
      perf: [P1-tiny, P2-short, P3-gen, P4-longctx]
      codebank: [CB-C5-predict-pyhouse, CB-C6-predict-node, CB-C3-predict-sqlite]
      # Option C (lead 2026-11-14 night, G2 EXP-20261115-39): the three 4.1 tool-use cases back as this tree has
