# reasoning-overflow recovery (re-ask the answer with thinking off) is skipped
# for these categories: 0 of 85 math recoveries ever produced a pass.
no_recovery: [math]
# 4.5 thinking fallback (EXP-20261114-09; maintainer: "switch off thinking ...
# when a reply doesn't exit thinking ... I only want to grade responses given").
# A reply with NO visible content -- finished inside its thinking block, ran to
# the cap without closing it, or empty -- is asked ONCE more with the model's own
# non-thinking switch (chat_template_kwargs enable_thinking=false; a provider
# that rejects the field gets the plain re-ask). That reply is graded and the row
# is stamped thinking_fallback {first, first_finish, first_completion_tokens,
# first_reasoning_chars, switch, fallback_visible}. Every model, no per-model
# setting; perf rows (recover=False) stay single-shot. Replaces the 4.0 plain
# empty-stop re-ask under this profile.
# OFF since 2026-11-14 (lead): the reference's own empty turns (reasoning cut
# mid-word at finish=stop on turns 7-12, 9 slots) look like a serving cut, and a
# fallback would change the test condition on ~14% of its turns. It returns for
# models that genuinely answer inside the thinking block once the cause is known.
thinking_fallback: false
# 4.5 empty stop (2026-11-14): a reply that FINISHED (finish=stop) with no
# visible content and no tool call -- on a llama-server reasoning parser an
# unclosed think block lands wholly in reasoning_content, so this is the shape
# "reasoning not closed" can be read as -- is stamped ``empty_stop`` on its row,
# counted as a blank by the early stop, counted per set in elemstats and on the
# board, and goes into a session's history as an EMPTY assistant turn (left out
# of what is sent, the user turns either side joined: the existing blank rule),
# never as the model's answer and never replayed as reasoning. Grading is not
# changed by this switch.
empty_stop_rule: true
# What such a reply gets first (lead 2026-11-14, adopted): ``regenerate`` -- the
# same request once more, nothing changed, session turns included (what a user does
# with an empty reply); the retry is graded and goes into history, the row records
# it (empty_stop_retry). Still empty after it: the empty_stop rule above.
# (thinking_off = the thinking fallback, for a model that answers inside its block;
# regenerate_then_thinking_off = regenerate, then -- only if the retry is again empty
# with its reply in the reasoning channel -- one attempt with thinking off: the
# generic rule that also covers a template trap such as Nanbeige's (at most two extra
# requests; every attempt in empty_stop_retry.chain); none = no retry.)
# the owner 2026-11-14: "regenerate, then thinking off if still empty". The 4.5 rule: an
# empty visible reply (finish=stop) is regenerated once with a fresh seed; still empty
# -> sent once more with the model's thinking switch off (seed retry 2) and that reply is
# graded (row answered_thinking_off); still empty -> empty_stop. A degenerate reply is
# never retried; a ran-out (finish=length) reply is not an empty stop.
on_empty_stop: regenerate_then_thinking_off
# Speaker tags (K 796344f, lead 2026-11-14): a tag after a leading quote or bullet ('Nell:, - Odo:) is a tag for the
# shared session checks (speaker:<Name> scopes, speaker_spread). Grading only; rows from wt-full are regraded.
speaker_tag_lead: true
# Template traps (2026-11-14): chat-template defects observed in a model
# family, with evidence. A RECORD, not a setting: every model runs as its card
# says; a reply that never leaves its thinking block is handled by the
# thinking fallback above. Read by card-check / a fixer.
template_traps:
  - id: nanbeige4-forced-think
    match: 'Nanbeige4'
    defect: "the generation prompt always opens <think>; in multi-turn persona chat the model often skips thinking without writing </think> (the reply is filed as reasoning, content empty) or loops inside the block to the cap"
    handled_by: thinking_fallback (off in bench45 since 2026-11-14) / empty_stop_rule
    source: "https://huggingface.co/Nanbeige/Nanbeige4.3-33B (\"`enable_thinking` ... It is enabled by default; set it to `False` for non-thinking mode.\"; \"`preserve_thinking` ... We recommend `False` for general chat\"); maker template unchanged since 2026-10-24; GGUF bartowski/Nanbeige_Nanbeige4.3-33B-GGUF"
    evidence: "lab EXP-20261113-18 (card-sampler retest: 9/16 rows answered only in reasoning, 4/16 at the cap) + EXP-20261114-09 (own 10-turn persona sessions: as run 8/10 turns with no visible reply; enable_thinking=false 30/30 ok over 3 seeds; single-turn shapes with thinking on 8/8 ok)"
# Code bank (codebank/codeagent and the long tier): every bank row gets ONE
# budget, 65,536 tokens, clamped so prompt + budget fits the context the model
# is served at (runner.bank_budget) — the regime the bank was built and
# piloted under (the maintainer 2026-10-28). Bank rows never escalate. Every other row
# keeps the board regime above (x4, cap 24576, floor 16384, escalation).
bank_budget: 65536
# 2026-11-19 (D10a): short-keyed parts: a reply cut at >= 98% of the budget sent "did not finish" -- graded as delivered, kept
# in the mean, printed with both figures (omit = plain D10: left out and counted). Written after the first fresh reference run.
cut_at_full_budget: zero
# 2026-11-19 (retry fairness, crucibleforge/attempts45.py): the scored attempt of a unit is the FIRST attempt that produced a
# reply (stop, length, a content filter on a refusal page); a later attempt replaces an earlier one only after an
# infrastructure failure. Later attempts are ignored and counted (report.json `attempts45`). Row selection at report time.
attempt_rule: first_reply
# Load floor (3.9): a model is loaded at least at this context (never below
# its registry context). rpdeep cases need 40960 (min_context) — at the rig's
# usual 32768 every rig model would otherwise skip RD1 (Fable final review,
# blocker 6). It changes no budget; it can cost the rig a parallel slot.
# A round that runs code-bank rows loads at bank_budget + 8192 = 73,728
# (runner.bank_context), so every bank row gets the full 65,536 on the rig too
# (2026-10-28, "don't decrease context or thinking cap").
context_floor: 40960
# Repeats (the maintainer 2026-10-28): code-bank fix/feature and math 1, every other
# deterministic category 2, Chat 1. ``case_repeats`` overrides one case.
# 4.0: coding 1 (the CL function set: 8 cases, partial credit per test); the
# ladder pack coding questions keep their 3.10 count of 2 (case_repeats).
# 4.0 time budget (the maintainer 2026-10-31): tooluse and
# codeagent 1 repeat too (per-step / per-group partial credit already).
repeats: {perf: 1, rp: 1, rpdeep: 1, nsfw: 1, story: 1, steer: 1, coding: 1, codebank: 1,
          codeagent: 1, tooluse: 1, instruct: 2, reasoning: 2, math: 1, longctx: 2}
case_repeats: {CB-C3-predict-sqlite: 1, CQ1-format-spec-from-scratch: 2,
               CQ2-regex-engine-from-scratch: 2, CQ3-spreadsheet-engine: 2}
max_tokens: {rp: 2000, rpdeep: 2000, nsfw: 2000, story: 3000, steer: 768, coding: 6144,
             tooluse: 1024, instruct: 768, reasoning: 6144, math: 6144}
# ---- Main + Frontier (T7, 2026-11-13): the 4.5 composition. PROVISIONAL: the Main Chat and Frontier Chat
# gates were re-opened 2026-11-13 16:15 and Main Coding may reweight after the rig check (MC2 4->2, MC1 2->3);
# every weight is the `max:` of one part below and every instance count a `count:` in core_generated ----------------------------
# Two tiers on the same profile and release seed (FABLE-RESET-45-v2 3). MAIN is the field test, calibrated on
# Sonnet 6-7.5 per section and built to fit 30 minutes at 20 tok/s; FRONTIER is a pack per section worth 10
# points that unlocks for a model only at 0.9 of the matching Main section (`ladder.unlock` below; Fable
# is meant to unlock). Seeds per model: 6 on the two Frontier search
# items (FC1 PATTERN n1-n6, FC2 combsyn p1-p6), 3 on every other generated item (delegated decision, PROGRESS-45
# 2026-11-13 14:53 / 15:09; undo = change the count / key list).
#   Main Coding  /10 = MC1 Functions and tools 3 (TZ16 + CB-C6) + MC3 Fix 3 + MC4 Solve 4 (TRACEVM L8 x8 is the bonus pack work/trace since rc1)
#   Main Chat    /10 = MH1 CC4 3 + MH2 RV2 4 + MH3 SESSION-STATE multi_hard L9 x2 (hard checks, 0 judge calls) 3
#   Main NSFW    /10 = mn1 NC3 2 + mn2 NX2 2 + mn3 UX1 2 + mn4 NC2 2.5 + mn5 NC1 1.5 (Admin N, EXP-20261113-21);
#                      Frontier NSFW is NOT wired (pending owner decision J11)
#   Frontier Coding /10 = FC1 PATTERN 4 + FC2 COMBSYN L7 4 (the 65k token rule applies) + FC3 COMPACTOR 1 + FC4 CQ1-3 1
#   Frontier Chat   /10 = FH1 LRVX classic 6 + FH2 LRV2 2 + FH3 LRD1-3 2
# The Main items are DATA here: `cases:` = byte-identical 4.1 cases (stored rows reused), `core_generated:` +
# `core_level:` = the generated instances; the Frontier items are the pack sets under cases/ladder/*/frontier/.
cases:
  perf: [P1-tiny, P2-short, P3-gen, P4-longctx]
  tooluse: [TZ16-pickup-dst-delay]                  # MC1
  codebank: [CB-C6-predict-node]                    # MC1
  rpdeep: [CC4-second-pitch, RV2-skarren-hut]       # MH1, MH2
  # nsfw: MN1-MN4 join here only when main_nsfw.enabled (profiles.apply_main_nsfw)
core_level:
  tracevm: 8                   # MC2: Haiku 0.51 / Sonnet 0.64 / Fable 1.00 on three instances (T1 F1)
  planted_opt: 4               # MC4: tier 4, Haiku 15 / Sonnet 69 / Fable 99, baseline 30
  patchfix: 7                  # MC3: lazy 0, reference 100 (whole-file and search/replace both accepted)
  session_state/multi_hard: 9  # MH3: hard checks only, 0 judge calls
core_generated:
  # R23 (the owner 2026-11-13: "let the models work as designed (full thinking)"): single-shot Main instances
  # get the context maximum (65,536 + pad = the 73,728 thinker window) instead of the 24,576 board cap.
  # Shakeout EXP-20261113-47: PATCHFIX-core-7-1 hit finish=length at 24,576 with no answer on the reference.
  - {family: patchfix, count: 2, part: work/mc3_fix, budget: 65536}
  - {family: planted_opt, count: 3, part: work/mc4_solve, budget: 65536}
  - {family: session_state, variant: multi_hard, count: 2, part: chat/mh3_state}
# ---- Selectable compositions (2026-11-14; profiles.apply_composition, env CF_COMPOSITION=<name>) ----------------
# Unset = `standard` (default_composition, below); "default" = the composition above. A composition replaces cases / core_level / core_generated whole and
# the Main parts it names; sampler rules, regime, judge, NSFW and packs stay the profile's. The name lands on the
# meta (`composition`).
# THE CUT (lead 2026-11-15): `standard` is the shipping composition (rc4-main under its release name) and the
# default: a bare `crucibleforge all --profile bench45` (after the flip a bare `crucibleforge all`) runs it with no
# CF_COMPOSITION set. rc4-main, the name tonight's stored rows and run metas carry, resolves to it. Every other
# composition here is RETIRED (rc1-*, rc2-main, rc3-main, main-*, locator, mod-*) or DEVELOPMENT (screen-*, calib-*,
# pack-*, packs2-*, pair-*, implied-check, nsfw-screen-1): kept so stored screens and scripts still resolve, never
# the default (tests/test_standard_composition_20261115.py).
default_composition: standard
composition_aliases: {rc4-main: standard}
compositions:
  # rc1-night (Admin G, EXP-20261113-20 COMPOSE.md "rc1-night LEVELS UPDATED 00:5x", FALLBACK form: single items,
  # one level per family, 0 judge calls): tracevm L8 x6, keyfunc L4 x10, istack-write L4 x10, session_state
  # multi_hard L10 x6, no attend. Section = mean over elements, so points follow element counts (Coding 6 + 10,
  # Chat 10 + 6). Per-family ceilings via `budget` (tracevm 49,152: L6 already took 20-25k on the reference).
  # Previous levels (tracevm 7 x12, keyfunc 4 x12, istack 4 x10, attend 6 x8, state 10 x2): commit 1044c29.
  rc1-night:
    cases:
      perf: [P1-tiny, P2-short, P3-gen, P4-longctx]
    core_generated:
      - {family: tracevm, level: 8, count: 6, part: work/rn_trace, budget: 49152}
      - {family: keyfunc, level: 4, count: 10, part: work/rn_keyfunc, budget: 42000}
      - {family: istack, variant: write, level: 4, count: 10, part: chat/rn_istack, budget: 32768}
      - {family: session_state, variant: multi_hard, level: 10, count: 6, part: chat/rn_state}
    scores:
      work:
        drop_parts: [mc1_functions, mc3_fix, mc4_solve]
        parts:
          rn_trace: {label: Trace, short: Trace, max: 3.75, scoring: [coding], cases: [], item: TRACEVM}
          rn_keyfunc: {label: Key function, short: Keyfn, max: 6.25, scoring: [coding], cases: [], item: KEYFUNC}
      chat:
        drop_parts: [mh1_conversation, mh2_character, mh3_state]
        parts:
          rn_istack: {label: Instructions (write), short: Instr, max: 6.25, scoring: [rpdeep], cases: [],
                      item: ISTACK-WRITE}
          rn_state: {label: Session state, short: State, max: 3.75, scoring: [rpdeep], cases: [],
                     item: SESSION-STATE}
  # rc1-night FULL form, levels updated 00:5x (COMPOSE.md "rc1-night LEVELS UPDATED", lead 00:5x; chains.py flat
  # elements, docs/CHAINS.md). Reference data: tracevm L6 = 1.00 at 20-25k thinking per item -> tracevm L8, single
  # items (5 per prompt cannot fit 65,536); attend at ceiling (L6 0.98 per turn) -> 2 items, measurement only,
  # 0 points; session_state multi_hard L10 = 0.61 -> the main Chat element, 6 items. keyfunc and istack-write
  # L3/L5 in 5-item prompts are unmeasured on the reference: this run is their screen. Section = mean over its
  # elements, so points follow element counts: Coding 6 trace + 10 keyfunc, Chat 10 istack + 6 state.
  # Previous form (tracevm 6/8 x10 N=5, attend 5x4 + 6x6 scored, state x3): commit a3fde40.
  rc1-night-full:
    cases:
      perf: [P1-tiny, P2-short, P3-gen, P4-longctx]
    core_generated: []
    chains:
      work/rn_trace:
        flat: [{family: tracevm, levels: {8: 6}, ceiling: 49152}]
      work/rn_keyfunc:
        flat: [{family: keyfunc, levels: {3: 5, 5: 5}, items_per_prompt: 5, ceiling: 42000}]
      chat/rn_istack:
        flat: [{family: istack, variant: write, levels: {3: 5, 5: 5}, items_per_prompt: 5, ceiling: 32768}]
      chat/rn_state:
        flat: [{family: session_state, variant: multi_hard, levels: {10: 6}, ceiling_per_turn: 16384}]
      chat/rn_attend:
        flat: [{family: attend, variant: host, levels: {6: 2}, element: turn, ceiling_per_turn: 2500}]
    scores:
      work:
        drop_parts: [mc1_functions, mc3_fix, mc4_solve]
        parts:
          rn_trace: {label: Trace, short: Trace, max: 3.75, scoring: [coding], cases: [], item: TRACEVM}
          rn_keyfunc: {label: Key function, short: Keyfn, max: 6.25, scoring: [coding], cases: [], item: KEYFUNC}
      chat:
        drop_parts: [mh1_conversation, mh2_character, mh3_state]
        parts:
