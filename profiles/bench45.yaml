  # ---- follow-up (Admin G2, 2026-11-14 pm): main-routed (the routing block), pack-unknown, calib-2; sceneshift (H3)
  # at 0 points in main-v1. Needs blackbox (23e09d0) and sceneshift (a257006) merged.
  #
  # main-routed: ONE run per model. Locator stage (the sets the routing names under `locator`), then the module its
  # locator ability picks (K's routing.py; calibration-g2-1, cuts -1.0 / +0.6 on the table's scale, reference = 0):
  #   below -1.0 -> low (the 8B, -1.5); -1.0..+0.6 -> mid (Q5 -.38, reference 0, DS flash +.18, MiniMax +.29,
  #   Grok -.57); +0.6 and above -> top, which UNLOCKS the packs (Haiku +.81, Sonnet +1.14). Within one SE of a cut:
  #   half of each neighbour.
  # top is NOT "packs only": every Main cell sits at or below +0.4, so a top model's section score would rest on
  # the locator alone. top = the hardest Main cells (shared instances with mid, below) + the pack cells.
  # Shared instances across a cut: a set cannot sit in two stages, so a neighbour's copy is a `seed_as` alias of the
  # mid set (same family / variant / level / deal; unit i = mid's unit i). low shares IMPLIED L1, PYTRAP L1,
  # session_state L10 and istack L4 with mid; top shares IMPLIED L3, session_state L10 and istack L7 with mid.
  # (seed_as onto a PACKED target needs the chains.py fix in this patch; before it, istack aliases drew other texts.)
  # Uncalibrated today (scale lists them as uncalibrated_cells and leaves them out of the ability until calib-1 is
  # refit): istack L2 / L4 (all packings), istack L7:x2 is calibrated; tracevm L8 is; blackbox and sceneshift are not.
  main-routed:
    # routed (scale.units): the plain cut rule only; zero + routing is refused at load (not part of 4.5)
    cut_at_full_budget: omit
    cases:
      perf: [P1-tiny, P2-short, P3-gen, P4-longctx]
      tooluse: [TZ16-pickup-dst-delay]
    core_generated: []
    routing:
      calibration: calibration/calibration-g2-1.json
      section: all
      locator: [rt_implied_loc, rt_pytrap_loc, rt_state_loc, rt_istack_loc]
      modules:
        - {name: low, sets: [rt_implied_lo, rt_pytrap_lo, rt_state_lo, rt_istack_lo2, rt_istack_lo4, rt_attend_lo]}
        - {name: mid, sets: [rt_implied1, rt_implied3, rt_pytrap_mid, rt_patchfix5, rt_state_mid, rt_istack_mid,
                             rt_attend_mid]}
        - {name: top, sets: [rt_implied3_top, rt_state_top, rt_istack_top7, rt_istack_top8, rt_attend_top,
                             rt_implied5_pack, rt_pytrap3_pack, rt_tracevm8_pack, rt_blackbox3_pack], unlock: true}
      cuts: [-1.0, 0.6]
      straddle: half
    chains:
      work/bk_implied:
        flat:
          - {name: rt_implied_loc, family: implied, levels: {1: 3}, items_per_prompt: 3, element: check,
             element_weight: check, average: unit, ceiling: 21000, deal: true, concept: C1, band: low}
