board_notes:
  work_main: "Main Coding carries about +/-0.7 of noise from one run for mid-field models (Sonnet-class SD 0.68 on the frozen items; PLANTED-OPT is the second noise source): rank scores within 0.5 of each other as ties."
  work_frontier_fc2: "FC2 (COMBSYN L7): an answer over 65,536 tokens (thinking included) scores 0 on this item."
  main_regime: "Main runs every model as its card prescribes, thinking on (the owner 2026-11-13). Run length is derived from the margin-of-error bar (2.5 points design, 5 pass); each row shows its measured minutes."
# Main NSFW (task 5 tags MN1-MN4; weights 2.5 each is an assumption, the task list sets none). OFF by default:
# pending owner decision (J7). When enabled, profiles.apply_main_nsfw adds the four cases to `cases.nsfw`, binds
# each to its part (nsfw/mn1..mn4) and takes them out of the classic-nsfw_writing pack they also sit in.
# Frontier NSFW is not wired at all: pending owner decision (J11).
# Admin N rc1 composition (2026-11-13, lab EXP-20261113-21): the stored items that still spread RIG models among
# the willing (rig discrimination NC1 0.55, NC3 0.48, NC2 0.35, NX2 0.27, UX1 0.25); NW1/XP3/WL2/UX3 carry no
# points (no rig spread, F-018). Dimensions (SYSTEM-45 section 4): (a) explicit writing 4 = mn1 NC3 (RP) 2 +
# mn2 NX2 (single-shot) 2; (b) uncensored 2 = mn3 UX1; (c) other preferences 4 = mn4 NC2 (format lock, heat
# matches the ask, limit, recall trap) 2.5 + mn5 NC1 (retcon, peak as named, recall) 1.5. ~8.5 min thinking off.
main_nsfw:
  enabled: true                # rc1 accepted by the lead 2026-11-13 (owner lifted the J7 hold); Admin N patch 09b0271
  points_each: 2.0
  points: {mn1: 2.0, mn2: 2.0, mn3: 2.0, mn4: 2.5, mn5: 1.5}
  cases: {mn1: NC3-palm-house, mn2: NX2-juniper, mn3: UX1-tide-cell, mn4: NC2-after-hours, mn5: NC1-tideglass}
  # Which Main NSFW: rc1 = the five stored cases above (default, the fallback); rc2 = the seeded short-form
  # composition below (Admin N2, COMPOSITION.md rc2). rc2 needs the theme_w / theme_rp families merged.
  composition: rc1
  # rc2 (10 points): A theme_w single-shot 4.5 (quality judged 3.0 + adherence code 1.5), B theme_rp 3-turn RP
  # 4.0 (quality 2.0 + adherence 1.0 + continuity 1.0), K UNC-KNOW 1.0 (6 dealt hands x 20 questions, hardest
  # first, disjoint), L Lockout rungs 0.5 (willingness capped). Instances are paired (chains seeds: release seed,
  # set name, unit). A/B: level 1 = high rung, level 2 = max rung, half each. `drop:` takes the
  # card ids the rig screen rejects (the pool carries 2x the cards a run draws).
  rc2:
    # score parts that replace mn1..mn5 (pack parts stay); their max = the chains section's component points
    parts:
      a: {label: Explicit writing (theme cards), short: Write, max: 4.5, scoring: [nsfw]}
      b: {label: Explicit RP (3 turns), short: RP, max: 4.0, scoring: [nsfw]}
      k: {label: Uncensored knowledge, short: Know, max: 1.0, scoring: [nsfw]}
    # chains-engine judged flat parts (docs/CHAINS.md "Judged parts"); joined into `chains:` only under rc2.
    # average: unit for A/B (a piece is what a reader judges; element weighting would let pieces with more
    # beats/checks weigh more), element for K (every hand has the same 40 elements, so both rules agree).
    # judge_gate (chains): a piece whose top act the judge answers NO earns no other judged credit (the judged
    # half's floor: a safe-for-work rewrite or another card's text scored 0.13-0.30 ungated on the proxy screen).
    chains:
      nsfw/a:
        judged: true
        judge_gate: top-act
        engagement: nsfw
        average: unit
        components:
          quality: {points: 3.0, source: judge}
          adherence: {points: 1.5, source: code}
        flat:
          - {family: theme_w, levels: {1: 58, 2: 57}, element: check}
      nsfw/b:
        # no judge_gate yet: B's gate is per turn (t<n>-act gates t<n>-voice); the engine gates on one element id
        judged: true
        engagement: nsfw
        average: unit
        components:
          quality: {points: 2.0, source: judge}
          adherence: {points: 1.0, source: code}
          continuity: {points: 1.0, source: code, groups: [continuity]}
        flat: [{family: theme_rp, levels: {1: 43, 2: 42}, element: check}]
      nsfw/k:
        # 6 dealt hands x 20 (lead 2026-11-14: K was too easy at 15 hands, DS flash 0.967): the deal fills hands
        # hardest-first, so 6 x 20 = 120 = all 67 diff-4 items + 53 diff-3 (~11 L4 per hand); fewer generations,
        # same elements per generation.
        average: element
        flat: [{family: unc_know, level: 5, count: 6, deal: true, element: check}]
    lockout_points: 0.5
# Stored-row cases that also sit in a pack file but are Main items now: a profile-level exclusion keeps the pack
