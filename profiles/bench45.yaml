          - {name: rt_istack_top7, seed_as: rt_istack_mid, family: istack, variant: write, levels: {7: 5},
             items_per_prompt: 2, ceiling: 65536, ran_out: exclude, concept: H1, band: mid}
          - {name: rt_istack_top8, family: istack, variant: write, levels: {8: 5}, items_per_prompt: 2,
