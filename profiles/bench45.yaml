          c2_trace: {label: Reads and traces code (C2), short: Trace, max: 3, scoring: [coding], cases: [], item: TRACEVM}
          # ONE stored program x5 repeats: the repeats measure repeat noise only. question_sd = the spread
          # between programs of this kind (G2 2026-11-14: per-model gap CB-C5 vs PYTRAP L1 .01-.56, PYTRAP
          # units within a model pooled sd .20) -> about +-0.8 of its 2 points, added in every resample
