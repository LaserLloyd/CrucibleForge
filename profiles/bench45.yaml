    cases:
      perf: [P1-tiny, P2-short, P3-gen, P4-longctx]
      codebank: [CB-C5-predict-pyhouse]
    # Code x1.5 (lead 2026-11-14): CB-C5 x5 here only (a composition's case_repeats merges onto the profile's)
    case_repeats: {CB-C5-predict-pyhouse: 5}
    core_generated: []
    board_notes:
      status: "internal candidate rc2: fixed set, no routing; Chat's judged parts (7 of 10 points) pending"
      main_regime: "Main runs every model as its card prescribes, thinking on (the owner 2026-11-13). One fixed set for every model; each row shows its measured minutes."
    chains:
      work/c1_implied:
        flat:
          - {name: rc2_implied1, family: implied, levels: {1: 18}, items_per_prompt: 3, element: check,
             element_weight: check, average: unit, ceiling: 21845, deal: true, ran_out: exclude, concept: C1, band: low}
