# "standard" — the 1-hour profile (target: a ~70 tok/s 27B, judged, < 60 min).
#
# Chat half (RP, NSFW, explicit peak, willingness, steer) + code half (coding,
# tools, instruct, reasoning) + speed. Weighted scorecard in the report
# (scoring: block in models.yaml overrides the default weights).
#
# Coding is deliberately brutal: 10 cases chosen so DeepSeek v4-flash scores
# ~20% at this budget (it fails CZ01/02/03/05/08/09/10 + CY01 and passes
# CZ04/CZ07 at the 16k thinking cap). Reason = reasoning + hard math pooled. — room for future models to climb.
# Budgets are per-category max_tokens; thinking models get ×4 up to the cap
# (coding 6144→24576, math/reasoning 4096→16384).
name: standard
description: ~1 h on a 70 tok/s 27B incl. judging — chat half + hard code half, weighted scorecard
# Judge: the 122B, the ONLY judge the board is comparable on. The earlier
# Gemma4-31B here is no longer on the rig at all (checked 2026-09-08 against
# /api/models) — with it named, `--profile standard` without `--judge` failed
# at judge load, which is exactly the "silently substitutes a smaller judge"
# gotcha the skill warns about, one step worse.
judge:
  provider: studioforge
  model_id: mradermacher/Qwen3.5-122B-A10B-heretic-v2-i1-GGUF/Qwen3.5-122B-A10B-heretic-v2.i1-Q5_K_M
  context_length: 16384
  thinking: true
# Thinking budgets raised 2026-09-08 (Jake: "plenty of time to think, full
# output"). At the old 8192 math / 16384 coding ceilings, 5-6 of 6 math rows
# and 1-2 of 10 coding rows per 27B run ended finish=length. The cap stays
# under the 32768 context (prompt + output must fit one slot).
thinking_max_tokens_factor: 4
thinking_max_tokens_cap: 24576
repeats: {perf: 2, rp: 1, nsfw: 1, steer: 1, coding: 1, tooluse: 1, instruct: 1, reasoning: 1, math: 1}
max_tokens: {rp: 1500, nsfw: 1500, steer: 768, coding: 6144, tooluse: 1024, instruct: 768, reasoning: 4096, math: 4096}
cases:
  perf: [P1-tiny, P2-short, P3-gen, P4-longctx]
  rp: [RP1, RP2, RP3, RP4, RPM1, RPM2]
  nsfw: [N1-suggestive, N2-explicit, N3-graphic, N4-kink, NM1-escalation]
  steer: [S1-sfw-enforce, S2-stay-in-character, S3-sfw-pressure]
  coding: [CZ01-prime-census, CZ02-segment-crossings, CZ03-lisp-machine, CZ04-dynamic-connectivity,
           CZ05-optimal-bst-cost, CZ07-convolve-mod, CZ08-triple-substring, CZ09-range-kth,
           CZ10-k-disjoint-subarrays, CY01-repeat-run]
  tooluse: [TZ01-contradicts-user-assumption, TZ02-unit-disambiguated-toolset, TZ03-strict-formats-tz-minor-enum,
            TZ04-one-clarifying-question, TZ05-policy-blocks-transfer, TZ06-three-parallel-one-turn,
            TZ07-retry-after-rate-limit, TZ08-doc-injection-no-exfil, TZ09-tax-round-half-up, TZ10-lookalike-order-ids]
  instruct: [IZ01-logistics-47-words, IZ02-json-single-line-typed, IZ03-no-letter-e-three-lines, IZ04-lowercase-except-http,
             IZ05-five-dash-lines-exact-26, IZ06-allcaps-recall-notice, IZ07-json-city-record, IZ08-two-questions-only]
  reasoning: [RX02-knights-knaves, RX08-water-jugs, RX13-recurrence-term, RH5-weboflies]
  math: [MH01-divisor-count-18, MH16-digit-sum-power, MH22-dual-base-palindrome, MH06-fermat-mod-prime, MH11-strings-no-adjacent-no-ABC, MH20-josephus-45th]
