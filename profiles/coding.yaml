# "coding" — the objective half, JUDGE-FREE, target < 30 min per model.
#
# Every case here is graded deterministically (executed tests, gold answers,
# tool-call checks, format checks), so no judge model is loaded and the rig
# is only leased for the benched model itself (bench-first picks the 5090s
# when the model fits there). Pair with `chat` on the same label — the two
# profiles accumulate onto one transcript, the report labels the row
# "profile chat+coding". Run coding FIRST with --fresh, then chat WITHOUT
# --fresh (--fresh archives the whole transcript, both halves).
#
# Budgets (Jake 2026-09-08: full output over speed): thinking models get
# coding 6144→24576, math/reasoning 4096→16384. On a ~35 tok/s 27B with 8
# slots the long pole is one 24k-token coding case (~12 min); the whole
# profile is ~25 min. A model that only gets 1-2 slots will overrun — the
# runner logs the plan, read it.
name: coding
description: objective half (code, tools, instruct, reasoning, math, speed) — deterministic graders, no judge, < 30 min
thinking_max_tokens_factor: 4
thinking_max_tokens_cap: 24576
repeats: {perf: 2, coding: 1, tooluse: 1, instruct: 1, reasoning: 1, math: 1}
max_tokens: {coding: 6144, tooluse: 1024, instruct: 768, reasoning: 4096, math: 4096}
cases:
  perf: [P1-tiny, P2-short, P3-gen, P4-longctx]
  coding: [CZ01-prime-census, CZ02-segment-crossings, CZ03-lisp-machine, CZ04-dynamic-connectivity,
           CZ05-optimal-bst-cost, CZ07-convolve-mod, CZ08-triple-substring, CZ09-range-kth,
           CZ10-k-disjoint-subarrays, CY01-repeat-run]
  tooluse: [TZ01-contradicts-user-assumption, TZ02-unit-disambiguated-toolset, TZ03-strict-formats-tz-minor-enum,
            TZ04-one-clarifying-question, TZ05-policy-blocks-transfer, TZ06-three-parallel-one-turn,
            TZ07-retry-after-rate-limit, TZ08-doc-injection-no-exfil, TZ09-tax-round-half-up, TZ10-lookalike-order-ids]
  instruct: [IZ01-logistics-47-words, IZ02-json-single-line-typed, IZ03-no-letter-e-three-lines, IZ04-lowercase-except-http,
             IZ05-five-dash-lines-exact-26, IZ06-allcaps-recall-notice, IZ07-json-city-record, IZ08-two-questions-only]
  reasoning: [RX02-knights-knaves, RX08-water-jugs, RX13-recurrence-term, RH5-weboflies]
  math: [MH01-divisor-count-18, MH16-digit-sum-power, MH22-dual-base-palindrome, MH06-fermat-mod-prime, MH11-strings-no-adjacent-no-ABC, MH20-josephus-45th]
