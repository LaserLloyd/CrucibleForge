# The single benchmark, suite 4.0 "lite" (2026-10-31):
# Overall /20 = Coding /10 + Chat /10; NSFW /10 beside it; ladder packs on top.
name: bench
# A local, git-ignored profiles/bench.private.yaml may add PRIVATE components
# (cases in cases/private/, their weight, label and budgets) on top of this
# file — they count on the local board and are scrubbed from every public
# artifact (`crucibleforge report --public`). docs/CASES.md "Private categories".
description: "4.0 lite: Coding /10 + Chat /10 = Overall /20; NSFW /10 separate; ladder packs add bonus points"
# Judge (2026-09-24 comparison of 8 judge runs on the same 65 chat rows): the
# Gemma-4-31B heretic Q8 reproduces the former 122B judge's verdicts (per-dim
# MAD 0.73, offset -0.05, Chat within 2.1, same bottom-two) on the two 5090s
# only, ~4x faster per row, canary 46 s. Was Qwen3.5-122B-A10B heretic v2
# Q5_K_M (all four cards). Rows judged by the 122B must be re-judged
# (`judge --models all --force`) — the board flags mixed judges.
judge:
  provider: studioforge
  model_id: llmfan46/gemma-4-31B-it-uncensored-heretic-GGUF/gemma-4-31B-it-uncensored-heretic-Q8_0
  context_length: 16384
  thinking: true
# 3.8.0 "as deployed" (2026-10-24, runner.REGIME_DEPLOYED): the model is
# measured the way its maker says to run it — chat-template default thinking,
# the maker's RECOMMENDED sampler (`recommended_samplers` below; a registry
# entry may pin its own `sampler:`; no rule = nothing sent), the SAME budget for rig and hosted models (provider
# overrides ignored), a 16k floor for thinking models so short chat cases do
# not starve them, and NO thinking-off retry: an answer that never arrives
# scores as missing. Sampled answers vary, so the deterministic categories run
# 3 repeats (one case flip used to move Coding ~11 points).
regime: deployed
thinking_max_tokens_factor: 4
thinking_max_tokens_cap: 24576
thinking_max_tokens_floor: 16384
reasoning_overflow_recovery: false
# Escalation round ("Room" column, 2026-10-25, runner.DEFAULT_ESCALATION_RUNGS):
# after a run, every job whose answer ran out of the 24576 budget (thinking
# model, finish=length) is re-run at 65536, and what still runs out at 131072,
# the model reloaded with a wider context (fewer slots). Those rows never count
# on the board (same budget for everyone); Room = Overall with them swapped in.
# Maintainer: "smaller context with an increased retry round for anything that
# doesn't have enough". [] turns it off.
# 4.0 lite: ONE retry, at the next rung only, in a single pass at the end of a
# bench-all run (--escalate); no per-model inline escalation (3.9 spent 85 min
# on one model re-running at 64k and 128k).
escalation_rungs: [65536]
# 4.0 (3.8's rule restated, Fable concept review): a row that ran out of the
# board budget counts as failed on the board even after its retry; the retry
# counts only in the Room column (Overall with it swapped in). "As deployed":
# no coding-specific thinking cap to dodge overflow.
# 4.0 lite (validation 2026-10-31: 11 of 18 local CL rows hit 24,576 before
# writing any code): the CL function cases carry their own "budget": 65536 in
# cases/coding.json — one pass, load widened to 73,728, no retry rung (the maintainer:
# "I don't want to handicap a model based on how long it thinks").
escalation_on_board: false
# The maker's (or fine-tuner's) published sampler, first match wins (regex on
# "<provider>:<model_id>" or the label; runner.resolve_sampler). Maintainer
# 2026-10-25: "make sure we're using the recommended settings for all models".
# Why rules at all: llama-server takes temp/top_p/top_k from a GGUF's
# general.sampling.* keys (llama.cpp PR #17120) but none of these files sets
# min_p, so its built-in min_p 0.05 stayed on where Qwen/Gemma recommend 0, and
# Qwen's presence_penalty has no GGUF key. Values a card does not state are left
# to the GGUF/server, except min_p 0 for families whose maker publishes a
# transformers config (transformers has no min_p). Hosted APIs fix or ignore
# their sampler: nothing is sent. No rule (Noromaid, Celeste, Cydonia, SmolVLM,
# gemma-2-2b: their cards state nothing) = the server's defaults, stamped
# "default". Sources checked 2026-10-25.
recommended_samplers:
  - id: api-vendor-fixed
    match: '^(deepseek|minimax|moonshot):'
    sampler: {}
    source: https://api-docs.deepseek.com/guides/thinking_mode https://platform.minimax.io/docs/api-reference/text-openai-api https://platform.kimi.ai/docs/guide/kimi-k3-quickstart
  - id: readyart-dark-scarlett
    match: 'Dark(er)?-Scarlett'
    sampler: {temperature: 1.0, top_p: 0.92, top_k: 20, min_p: 0.0}
    source: https://huggingface.co/ReadyArt/Dark-Scarlett-27B-v3.0-GGUF
  - id: readyart-gemma4
    match: 'ReadyArt/(Omega-Arsenal|Swish|Wicked-Tutu)'
    sampler: {temperature: 1.0, top_p: 0.92, top_k: 64, min_p: 0.0}
    source: https://huggingface.co/ReadyArt/Swish-31B-Final-GGUF
  - id: loki-scotoma
    match: 'Loki-Scotoma'
    sampler: {temperature: 1.0, min_p: 0.02, top_p: 1.0, top_k: 0}
    source: https://huggingface.co/CrucibleLab/Gemma-4-31B-Loki-Scotoma-V2.0-Swa-4096-GGUF
  - id: split-untied
    match: 'Split-Untied'
    sampler: {temperature: 1.0, min_p: 0.03, top_p: 1.0, top_k: 0, repeat_penalty: 1.0, dry_multiplier: 0.8}
    source: https://huggingface.co/Blazed-Forge/Split-Untied-31B
  - id: artemis
    match: 'Artemis-31B'
    sampler: {temperature: 1.0, min_p: 0.08, top_p: 1.0, top_k: 0, repeat_penalty: 1.06}
    source: https://huggingface.co/Abiray/Artemis-31B-v1.2-GGUF
  - id: orion
    match: 'Orion-26B'
    sampler: {temperature: 0.9, top_p: 0.95, top_k: 64, min_p: 0.0}
    source: https://huggingface.co/TheDrummer/Orion-26B-A4B-v1.1 (temp) + google/gemma-4 base
  - id: joyfox-thinking
    match: 'JoyFox'
    sampler: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
    source: https://huggingface.co/joyfox/JoyFox-Qwen3.6-35B-A3B-RP-Aggressive
  - id: qwen3-moe-thinking
    match: 'Qwen3\.5-122B|Qwen3\.6-35B'
    sampler: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 1.5}
    source: https://huggingface.co/Qwen/Qwen3.5-122B-A10B https://huggingface.co/Qwen/Qwen3.6-35B-A3B
  - id: qwen3-thinking
    match: 'Qwen3\.[68]|JAX-XORTRON'
    sampler: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0, presence_penalty: 0.0}
    source: https://huggingface.co/Qwen/Qwen3.8-27B https://huggingface.co/Qwen/Qwen3.6-27B
  - id: ling-thinking
    match: 'Ling-3\.0'
    sampler: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
    source: https://huggingface.co/trohrbaugh/Ling-3.0-flash-heretic
  - id: laguna
    match: 'Laguna-S'
    sampler: {temperature: 1.0, top_p: 1.0, top_k: 20, min_p: 0.0}
    source: https://huggingface.co/poolside/Laguna-S-2.1
  - id: deepseek-r1-distill
    match: 'DeepSeek-R1-0528-Qwen3-8B'
    sampler: {temperature: 0.6, top_p: 0.95, min_p: 0.0}
    source: https://huggingface.co/deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
  - id: hy-mt2
    match: 'Hy-MT2'
    sampler: {temperature: 0.7, top_p: 1.0, top_k: 0, min_p: 0.0, repeat_penalty: 1.0}
    source: https://huggingface.co/tencent/Hy-MT2-30B-A3B
  - id: qwen2.5-vl
    match: 'Qwen2\.5-VL'
    sampler: {temperature: 0.0, repeat_penalty: 1.05}
    source: https://huggingface.co/Qwen/Qwen2.5-VL-7B-Instruct (generation_config, greedy)
  - id: qwen2.5
    match: 'Qwen2\.5-'
    sampler: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0.0, repeat_penalty: 1.1}
    source: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct (generation_config)
  - id: nanbeige4
    match: 'Nanbeige4'
    sampler: {temperature: 0.6, top_p: 0.95}
    source: https://huggingface.co/Nanbeige/Nanbeige4.3-33B ("Reasoning and chat tasks" row; agentic row is 1.0 / 0.95; preserve_thinking False for chat = reasoning_replay off)
  - id: gemma4
    match: 'gemma-4|Goetia|Spectre|Broken-Tutu'
    sampler: {temperature: 1.0, top_p: 0.95, top_k: 64, min_p: 0.0}
    source: https://huggingface.co/google/gemma-4-31B-it
# reasoning-overflow recovery (re-ask the answer with thinking off) is skipped
# for these categories: 0 of 85 math recoveries ever produced a pass.
no_recovery: [math]
# Code bank (codebank/codeagent and the long tier): every bank row gets ONE
# budget, 65,536 tokens, clamped so prompt + budget fits the context the model
# is served at (runner.bank_budget) — the regime the bank was built and
# piloted under (the maintainer 2026-10-28). Bank rows never escalate. Every other row
# keeps the board regime above (x4, cap 24576, floor 16384, escalation).
bank_budget: 65536
# Load floor (3.9): a model is loaded at least at this context (never below
# its registry context). rpdeep cases need 40960 (min_context) — at the rig's
# usual 32768 every rig model would otherwise skip RD1 (Fable final review,
# blocker 6). It changes no budget; it can cost the rig a parallel slot.
# A round that runs code-bank rows loads at bank_budget + 8192 = 73,728
# (runner.bank_context), so every bank row gets the full 65,536 on the rig too
# (2026-10-28, "don't decrease context or thinking cap").
context_floor: 40960
# Repeats (the maintainer 2026-10-28): code-bank fix/feature and math 1, every other
# deterministic category 2, Chat 1. ``case_repeats`` overrides one case.
# 4.0: coding 1 (the CL function set: 8 cases, partial credit per test); the
# ladder pack coding questions keep their 3.10 count of 2 (case_repeats).
# 4.0 time budget (the maintainer 2026-10-31): tooluse and
# codeagent 1 repeat too (per-step / per-group partial credit already).
repeats: {perf: 1, rp: 1, rpdeep: 1, nsfw: 1, story: 1, steer: 1, coding: 1, codebank: 1,
          codeagent: 1, tooluse: 1, instruct: 2, reasoning: 2, math: 1}
case_repeats: {CB-C3-predict-sqlite: 1, CQ1-format-spec-from-scratch: 2,
               CQ2-regex-engine-from-scratch: 2, CQ3-spreadsheet-engine: 2}
max_tokens: {rp: 2000, rpdeep: 2000, nsfw: 2000, story: 3000, steer: 768, coding: 6144,
             tooluse: 1024, instruct: 768, reasoning: 6144, math: 6144}
# Standard level (3.9 step 6): about one case per
# point, partial credit inside each case. Removed items stay in the case files
# (some are ladder packs: cases/ladder/). Coding/Work re-calibrated in step 8
# so the reference model (MiniMax-M3) lands near
# half marks: trap items (spec traps, predict-output, rule traps in tool
# scripts, neighbour-rule counts) instead of big-but-plain ones.
cases:
  perf: [P1-tiny, P2-short, P3-gen, P4-longctx]
  # ---- Coding (deterministic, no judge) ----
  # 4.0 lite: CZ12/CZ13 (long, all-or-nothing), RX24/RX27 and MH28/31/33 left
  # the board (the case files keep them; reasoning/math packs stay packs).
  # Functions = the CL single-function set (cases/coding.json, partial credit =
  # share of unit tests passed, 1 repeat). Time budget (the maintainer 2026-10-31, Fable
  # concept review): CL1 and CL2 are cut first (they measure nothing above
  # class D); CL1-span-parse / CL2-cent-split stay in cases/coding.json.
  coding: [CL3-paragraph-wrap, CL4-workday-mask, CL5-sheet-rounding, CL6-number-format,
           CL7-span-by-example, CL8-machine-plan]
  # 4.0 time budget: CB-C3 left (noisy: deepseek-pro fails it, dark-scarlett passes)
  codebank: [CB-C5-predict-pyhouse, CB-C6-predict-node]
  codeagent: [CB-F1-larder-bughunt]
  tooluse: [TZ16-pickup-dst-delay, TZ19-hotel-cot-deadline, TZ20-swim-saturday-age-day]
  # ---- Chat (judged elements + deterministic facts; companion quality only) ----
  # Re-calibrated in step 9 so MiniMax-M3 lands near
  # half marks: long two-card / long-log sessions with late, indirect and
  # combined recall, inductive items, user mistakes to correct, card habits the
  # scene must trigger; Creative writing is an rpdeep co-writing session (share
  # of stacked deterministic constraints + quoted elements) — the story rubric's
  # judge craft dims (3/4 of story_block) put every competent story near 0.9.
  rpdeep: [RD1-marisol, RD4-kettle-saddle, CC3-tea-hut, CC4-second-pitch,
           RV1-three-at-the-table, RV2-skarren-hut, WR1-ninth-string, WR2-red-thread-key]
  # ---- NSFW (never in Overall) ----
  # 4.0 time budget: NMX1 left (near ceiling after the heat skip: mean 0.91,
  # 4/7 at 1.0), WL2R (WL2's twin: same signal) and UX2 (1.9/2 for most models)
  nsfw: [WL2-lighthouse, UX1-tide-cell, UX3-brass-roast,
         NC1-tideglass, NC2-after-hours, NC3-palm-house,
         NX2-juniper, XP3-named-peak, NW1-salt-and-cedar]
# ---- Scores (the maintainer 2026-10-28) ----
# "Break the scores into three categories: Coding/Work, Chat, NSFW. Don't add
# nsfw to the total score." Each category is out of 10 points and is the SUM
# of its sub-scores' points (sub-score points = its 0-1 share x its max; at
# most 4 sub-scores, whole-number maxima). Overall = Coding/Work + Chat (max
# 20; `headline.overall: sum`); NSFW is shown beside it, never added.
# A sub-score with no measured item is "pending" and the category is
# renormalised over the measured points (the board says so).
# Inside a sub-score, `scoring: [components]` weighs each component by its
# number of tier-1 cases (report._declared_weights); a mapping gives explicit
# weights. `cases:` limits the tier-1 rows a sub-score is computed from (the
# components are per category; this is how one category's cases split, e.g.
# the erotic-RP session must not feed Chat's RP identity checks).
scores:
  # 4.0 lite: Coding = Functions 5 + Predict & bug hunt 2.5 + Tool use 2.5.
  # The part KEYS stay code / reasoning / agentic so the existing ladder packs
  # (cases/ladder/work/<key>/) keep attaching: code <- CQ re-implementations,
  # reasoning <- LRZ exact-trace pack, agentic <- LAG agent tasks.
  work:
    label: Coding
    parts:
      code: {label: Functions, short: Func, max: 5, scoring: [coding]}
      reasoning: {label: Predict + bug hunt, short: Predict, max: 2.5,
                  scoring: [codebank, codeagent]}
      agentic: {label: Tool use, short: Tools, max: 2.5, scoring: [tooluse]}
  chat:
    label: Chat
    parts:
      deep_rp: {label: Deep RP, short: Deep RP, max: 3, scoring: [rpdeep],
                cases: [RD1-marisol, RD4-kettle-saddle]}
      conversation: {label: Conversation, short: Conv, max: 3, scoring: [rpdeep],
                     cases: [CC3-tea-hut, CC4-second-pitch]}
      character: {label: Character, short: Char, max: 2, scoring: [rpdeep],
                  cases: [RV1-three-at-the-table, RV2-skarren-hut]}
      writing: {label: Creative writing, short: Writing, max: 2, scoring: [rpdeep],
                cases: [WR1-ninth-string, WR2-red-thread-key]}
  nsfw:
    label: NSFW
    in_total: false
    parts:
      # W 0-4 willingness rung x card checks (report.willing_block)
      uncensored: {label: Uncensored, short: Unc, max: 2, scoring: [willing],
                   cases: [WL2-lighthouse, UX1-tide-cell, UX3-brass-roast]}
      # engagement x heat delivered x card checks (report.nsfw_gated_row)
      nsfw_rp: {label: NSFW RP, short: RP, max: 4, scoring: [nsfw_gated],
                cases: [NC1-tideglass, NC2-after-hours, NC3-palm-house]}
      nsfw_writing: {label: NSFW writing, short: Writing, max: 4, scoring: [nsfw_gated],
                     cases: [NX2-juniper, XP3-named-peak, NW1-salt-and-cedar]}
# Custom tests (docs/CUSTOM-TESTS.md): a user's own categories, declared
# under `custom:` (usually in the git-ignored profiles/bench.private.yaml),
# shown as extra columns and added to Overall / a category only when their
# `include_in` says so. A private category without a declaration is a custom
# test of its own (include_in: none) — never part of NSFW, Chat or Overall.
# Partial credit (EVAL-FABLE M2): these components score the share of a
# row's parts instead of pass/fail — programs by hidden-test group (cases
# with grader_config.test_groups), tools by script step, instruct and
# reasoning by element (e.g. RX20's 20 positions), steer by its judge
# verdict + elements + checks. A row with no parts is its pass/fail.
partial_credit: [coding, tooluse, instruct, reasoning, steer]
# Errored rows (EVAL-FABLE M4): a row whose request failed counts as failed
# (never dropped and renormalised away); Notes say n/N, a resume re-runs them.
errored_rows: fail
headline:
  overall: sum          # Overall = Coding + Chat on the 0-10 scales (max 20 without packs)
  # 4.0 Class (from Overall) and Lean (Chat - Coding), headline.capability_class /
  # headline.lean. Bands set from the 4.0 board on the 2026-10-31 results
  # (DeepSeek 17.2-17.6, best locals 14.3-14.9, MiniMax + other locals 11.4-12.2);
  # re-check once the CL function set has rows (it is half of Coding).
  classes: {S: 16, A: 13, B: 10, C: 0}
  # Lean = (Chat - board median) - (Coding - board median), tagged at >= 1.5
  lean_gap: 1.5
# ---- Ladders (ladder.py, the maintainer 2026-10-28) ----
# Harder questions come as SETS of 3 per sub-score, worth 1 point together:
# cases/ladder/<category>/<part>/set-<n>.json (level = unlock order). A
# level is given only after >= `unlock` on the standard level and on every
# set of every lower level. Replaces the T2/T3 tiers and gates.
ladder:
  unlock: 0.9
# Calibration (`crucibleforge calibrate`): a sub-score the reference model
# scores >= too_easy on is flagged "too easy: rethink difficulty / add
# examples" (the maintainer: "if minimax aces any section we need to rethink").
calibration:
  reference: minimax-m3
  too_easy: 0.9

# ---- Judge policy (step 5 judge) ----
# Per-row judge sample policy (judge.judge_policy, EVAL-FABLE S6). Derived from
# each row's rubric / elements / case tags, never from case ids:
#   craft-only rows (dimensions only)                      -> samples 1
#   an element decides a binary component (flag element,
#   willing / explicit_required tag + elements), PRIVATE
#   elements, willingness (W 0-4) rows                      -> samples 3
#   element/flag-only calls (no 0-10 dimensions)            -> samples 1, thinking
#                                                              off, max_tokens <= 4096
# An explicit `--samples N` overrides every row's count. The verdict records the
# policy used as judge["policy"]. samples3_rows / samples1_rows are case-id
# override lists (3 wins).
judge_policy:
  enabled: true
  craft_samples: 1
  binary_samples: 3
  private_samples: 3
  flag_only_thinking_off: true
  flag_only_max_tokens: 4096
  flag_only_exclude_rubrics: [reference]
  # fix 3.10 (Fable review I-judge-samples): NC1/NC2 decide most of NSFW RP's
  # 4 points through their explicitness elements; at one sample they were the
  # least reproducible verdicts on the board. 3 samples (+~2 x 2 judge calls per
  # model; the re-judge of stored rows follows from the sample-count rule).
  # 4.0 (first-results review): the four NSFW writing rows carry all 4 points of
  # NSFW writing; at one sample the judge scored openly explicit text 5/10 and
  # dropped verified elements on a one-word quote drift. 3 samples, like NC1/NC2.
  samples3_rows: [NC1-tideglass, NC2-after-hours, NC3-palm-house, NX2-juniper, XP3-named-peak, NW1-salt-and-cedar, WL2-lighthouse]
  # 3.9 step 6 (time budget): NSFW RP / writing rows
  # are scored engagement x heat x checks (report.nsfw_gated_row) — their
  # elements are shares of a row, not a binary component — and the five
  # Uncensored rows are averaged over a 5-rung W scale, so one sample each
  # (EVAL-FABLE S6/§11: ~7 min of judge on 2 non-headline points at 3 samples).
  # Steer and the private rows keep 3. If the one-time W calibration (S11)
  # shows the rung unstable across samples, move the WL2/UX rows to
  # samples3_rows (+~4.7 min judge per model).
  samples1_rows: [NMX1-needle-and-gull, NX2-juniper,
                  XP3-named-peak, NW1-salt-and-cedar, XP1-three-rooms, XP2-blindfold,
                  WL2-lighthouse, WL2R-lighthouse-twin, UX1-tide-cell, UX2-sledhouse,
                  UX3-brass-roast,
                  # 3.10 NSFW ladder packs
                  LUX1-bone-choir, LUX2-sermon-of-the-low-fire, LUX3-ferry-at-low-water,
                  LNC1-glasshouse-keys, LNC2-boathouse-three, LNC3-break-room,
                  LNW1-glasshouse-ledger, LNW2-last-crossing, LNW3-upright-in-august]
  long_canary: true

# ---- Run plan (step 5 runner) ----
# How `all` runs a model (crucibleforge/runner.py run_plan(); EVAL-FABLE M7, S8, S10).
run_plan:
  # Rig models: the rows that need a wide window (code-bank rows: bank_budget
  # 65,536 -> ctx 73,728; ladder sets with a budget or context) run in their
  # own load round AFTER the standard rows, which load at context_floor
  # (40,960), where the rig gives 8 parallel slots instead of 4 (STEP4).
  # Hosted APIs (nothing is loaded) always run one round.
  # 4.0 lite (time budget, 2026-10-31): ONE load at the bank window (73,728)
  # instead of two rounds and a reload. The 3.9 rounds showed the rig gives
  # gemma-26b / trohrbaugh-122b 8 slots at 73,728 too and omega-31b 4 at both,
  # so the split only cost the second round's tail (gemma -12 min, troh -28).
  # A model the rig serves with fewer slots at 73,728 runs slower; the planner
  # times it from its measured workers (estimate.measured_speed).
  split_rig_rounds: false
  # One output budget per row for every model (S8): a model the run does not
  # see as a thinker gets the same board budget (case x factor, floor, cap)
  # as one it does; bank rows keep bank_budget, ladder rows their set budget.
  one_budget: true
  # Escalation is opt-in (`all --escalate`, `bench-all --escalate`); a rung
  # round's requests are cut at this wall clock (a 131k rung at 30 tok/s
  # is over an hour) and the row is scored as run out, not errored.
  escalation_max_wall_s: 2700
