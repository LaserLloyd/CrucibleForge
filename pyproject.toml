[project]
name = "crucibleforge-bench"
version = "4.5.1"
description = "CrucibleForge — an LLM capability benchmark with a hard tier, deterministic graders, an LLM judge (local or remote), and a web GUI. Works with LM Studio, llama.cpp/StudioForge, Ollama, vLLM, DeepSeek, OpenRouter, OpenAI, Open WebUI — anything OpenAI-compatible."
readme = "README.md"
license = "MIT-0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["llm", "benchmark", "evaluation", "eval", "openai-compatible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6",
    # zoneinfo has no system tz database on Windows (case verify expressions use it)
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
crucibleforge = "crucibleforge.cli:main"
crucibleforge-test = "crucibleforge.quicktest:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crucibleforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Lint. The selection is deliberately narrow, and the reasoning is worth keeping
# because "why is your linter config so small" is a fair question.
#
# `F` is the half that finds real defects — unused imports, dead assignments,
# f-strings with no placeholders, undefined names — and it is never relaxed.
# Enabling it surfaced 14 genuine findings, all of which were fixed in the code
# rather than silenced here.
#
# `E4`/`E7`/`E9` add import placement, statement-level mistakes and syntax
# errors. E741 (ambiguous name `l`) is the one exclusion: it fires 30 times on
# short-lived loop and comprehension variables in line-splitting code, where `l`
# for "line" is the clearest name available. It reports no defect.
#
# Not selected: `I` (import sorting). It has 27 findings, all in files that are
# otherwise correct, and acting on them would mean a mechanical reordering diff
# across most of the package for no behavioural gain. Style rules that rewrite
# working code are not worth the churn in a repo this size — if that judgement
# changes, `uvx ruff check --select I --fix .` does it in one pass.
[tool.ruff]
target-version = "py312"
# codebank_src/ holds the code-bank task fixtures the benchmark grades (hidden
# tests, deliberately broken mutants, agent-task repos). They are not this
# project's code and must stay byte-exact, so the linter never touches them.
extend-exclude = ["codebank_src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

# Lint debt carried into 4.5.0, listed file by file so every other file and every new file is linted in full.
# Most of these files are byte-frozen: the stored benchmark rows carry a hash of their grader and generator source,
# so reformatting one of them would mark every stored row stale. They are cleaned in 4.5.1 together with a re-stamp.
# The list was generated from `ruff check .` at the 4.5.0 release; remove a line when its file is fixed.
[tool.ruff.lint.per-file-ignores]
