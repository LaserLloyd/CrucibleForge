[project]
name = "gauntlet-bench"
version = "3.1.0"
description = "Gauntlet — an LLM capability benchmark with a hard tier, deterministic graders, an LLM judge (local or remote), and a web GUI. Works with LM Studio, llama.cpp/StudioForge, Ollama, vLLM, DeepSeek, OpenRouter, OpenAI, Open WebUI — anything OpenAI-compatible."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gauntlet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
