[project]
name = "crucibleforge-bench"
version = "3.2.0"
description = "CrucibleForge — an LLM capability benchmark with a hard tier, deterministic graders, an LLM judge (local or remote), and a web GUI. Works with LM Studio, llama.cpp/StudioForge, Ollama, vLLM, DeepSeek, OpenRouter, OpenAI, Open WebUI — anything OpenAI-compatible."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["llm", "benchmark", "evaluation", "eval", "openai-compatible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.scripts]
crucibleforge = "crucibleforge.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crucibleforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
