<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How the MakoBench score is built</title>
<desc id="d">Code is 10 standard points (Writes 4, Fixes 3, Tools 2, Reads 1) plus up to 7 bonus points from packs. Chat is 10 standard points (Character 4, Memory 3.5, Co-write 1.5, Everyday 1) plus up to 7 bonus points. Code total plus Chat total is Overall, printed with its split; with today's packs the maximum is 34. The rank is on the total. NSFW+ is shown beside Overall and is never part of it.</desc>
<defs>
<linearGradient id="beam" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ea8ff"/><stop offset="1" stop-color="#00e6cf"/></linearGradient>
<pattern id="hash" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="7" fill="#00e6cf"/></pattern>
</defs>
<rect x="1" y="1" width="798" height="578" rx="28" fill="#0d1116" stroke="#242e3a" stroke-width="2"/>
