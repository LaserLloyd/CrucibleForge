<text x="283.5" y="380" text-anchor="middle" font-size="17" fill="#9aabbc">Memory</text>
<text x="389.4" y="380" text-anchor="middle" font-size="17" fill="#9aabbc">Co-write</text>
<text x="442.4" y="402" text-anchor="middle" font-size="17" fill="#9aabbc">Everyday</text>
<text x="611.8" y="380" text-anchor="middle" font-size="17" fill="#9aabbc">bonus, opened at 90%</text>
<path d="M40 424 H760" stroke="#242e3a" stroke-width="2"/>
<text x="400" y="458" text-anchor="middle" font-size="30" font-weight="700" fill="#eaf1f8">Code total + Chat total = Overall</text>
<text x="400" y="494" text-anchor="middle" font-size="19" fill="#9aabbc">Printed with its split, e.g. 20.7 of 34 = 16.9 standard + 3.8 bonus.</text>
<text x="400" y="522" text-anchor="middle" font-size="19" fill="#9aabbc">The rank is on the total. Today's maximum: 17 + 17 = 34.</text>
<text x="400" y="550" text-anchor="middle" font-size="19" fill="#9aabbc">NSFW+ is shown beside Overall, never part of it.</text>
