<text x="272.9" y="190" text-anchor="middle" font-size="17" fill="#9aabbc">Fixes</text>
<text x="378.8" y="190" text-anchor="middle" font-size="17" fill="#9aabbc">Tools</text>
<text x="442.4" y="212" text-anchor="middle" font-size="17" fill="#9aabbc">Reads</text>
<text x="611.8" y="190" text-anchor="middle" font-size="17" fill="#9aabbc">bonus, opened at 90%</text>
