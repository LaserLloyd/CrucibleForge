<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How the MakoBench score is built</title>
<desc id="d">Code is 10 points: Writes 4, Fixes 3, Tools 2, Reads 1. Chat is 10 points: Character 4, Memory 3.5, Co-write 1.5, Everyday 1. Code plus Chat is Overall out of 20.</desc>
<rect width="800" height="540" rx="28" fill="#0f172a"/>
<text x="40" y="76" font-size="30" font-weight="700" fill="#38bdf8">Code</text>
<text x="760" y="76" text-anchor="end" font-size="22" fill="#a5b4cc">10 points</text>
<clipPath id="c96"><rect x="40" y="96" width="720" height="64" rx="14"/></clipPath>
<g clip-path="url(#c96)">
<rect x="40.0" y="96" width="288.6" height="64" fill="#7dd3fc"/>
<text x="184.0" y="138" text-anchor="middle" font-size="26" font-weight="700" fill="#0b1220">4</text>
<rect x="328.0" y="96" width="216.6" height="64" fill="#38bdf8"/>
<text x="436.0" y="138" text-anchor="middle" font-size="26" font-weight="700" fill="#0b1220">3</text>
<rect x="544.0" y="96" width="144.6" height="64" fill="#0284c7"/>
<text x="616.0" y="138" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">2</text>
<rect x="688.0" y="96" width="72.6" height="64" fill="#075985"/>
<text x="724.0" y="138" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">1</text>
</g>
<text x="184.0" y="190" text-anchor="middle" font-size="19" fill="#a5b4cc">Writes</text>
<text x="436.0" y="190" text-anchor="middle" font-size="19" fill="#a5b4cc">Fixes</text>
<text x="616.0" y="190" text-anchor="middle" font-size="19" fill="#a5b4cc">Tools</text>
<text x="724.0" y="190" text-anchor="middle" font-size="19" fill="#a5b4cc">Reads</text>
<text x="40" y="262" font-size="30" font-weight="700" fill="#34d399">Chat</text>
<text x="760" y="262" text-anchor="end" font-size="22" fill="#a5b4cc">10 points</text>
<clipPath id="c282"><rect x="40" y="282" width="720" height="64" rx="14"/></clipPath>
<g clip-path="url(#c282)">
<rect x="40.0" y="282" width="288.6" height="64" fill="#6ee7b7"/>
<text x="184.0" y="324" text-anchor="middle" font-size="26" font-weight="700" fill="#0b1220">4</text>
<rect x="328.0" y="282" width="252.6" height="64" fill="#34d399"/>
<text x="454.0" y="324" text-anchor="middle" font-size="26" font-weight="700" fill="#0b1220">3.5</text>
<rect x="580.0" y="282" width="108.6" height="64" fill="#059669"/>
<text x="634.0" y="324" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">1.5</text>
<rect x="688.0" y="282" width="72.6" height="64" fill="#065f46"/>
<text x="724.0" y="324" text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">1</text>
</g>
<text x="184.0" y="376" text-anchor="middle" font-size="19" fill="#a5b4cc">Character</text>
<text x="454.0" y="376" text-anchor="middle" font-size="19" fill="#a5b4cc">Memory</text>
<text x="624.0" y="376" text-anchor="middle" font-size="19" fill="#a5b4cc">Co-write</text>
<text x="760" y="376" text-anchor="end" font-size="19" fill="#a5b4cc">Everyday</text>
<path d="M40 412 H760" stroke="#27375a" stroke-width="2"/>
<text x="400" y="462" text-anchor="middle" font-size="30" font-weight="700" fill="#f1f5f9">Code /10 + Chat /10 = Overall /20</text>
<text x="400" y="502" text-anchor="middle" font-size="20" fill="#a5b4cc">NSFW+ /20 is scored apart and shown beside Overall.</text>
</svg>
