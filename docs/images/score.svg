<text x="611.8" y="138" text-anchor="middle" font-size="24" font-weight="700" fill="#eaf1f8">+ packs</text>
</g>
<rect x="463.5" y="97" width="295.5" height="62" rx="0" fill="none" stroke="#00e6cf" stroke-width="2" stroke-dasharray="6 5"/>
