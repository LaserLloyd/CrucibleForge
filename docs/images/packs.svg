<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 846" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How MakoBench bonus packs work</title>
<desc id="d">A part scored at 90 percent or more opens its bonus pack of harder questions. Each pack is worth up to one bonus point. Bonus points are drawn as hashed bars after the solid standard score and never count in Overall.</desc>
<defs>
<linearGradient id="beam" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ea8ff"/><stop offset="1" stop-color="#00e6cf"/></linearGradient>
<pattern id="hash" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="7" fill="#00e6cf"/></pattern>
</defs>
<rect x="1" y="1" width="798" height="844" rx="28" fill="#0d1116" stroke="#242e3a" stroke-width="2"/>
<rect x="40" y="40" width="720" height="262" rx="18" fill="#12171e" stroke="#242e3a" stroke-width="2"/>
<circle cx="104" cy="102" r="30" fill="url(#beam)"/>
<text x="104" y="113" text-anchor="middle" font-size="30" font-weight="700" fill="#0d1116">1</text>
<text x="158" y="100" font-size="30" font-weight="700" fill="#eaf1f8">90% on a part opens its bonus pack</text>
<text x="559" y="164" text-anchor="middle" font-size="18" fill="#9aabbc">90% line</text>
<text x="70" y="201" font-size="22" fill="#eaf1f8">Uses tools</text>
<rect x="262" y="184" width="330" height="22" rx="11" fill="#242e3a"/>
<rect x="262" y="184" width="314" height="22" rx="11" fill="url(#beam)" fill-opacity="1"/>
<path d="M559 177 V 213" stroke="#eaf1f8" stroke-width="3" stroke-linecap="round"/>
<text x="612" y="201" font-size="22" font-weight="700" fill="#00e6cf">95%  open</text>
<text x="70" y="255" font-size="22" fill="#eaf1f8">Reads code</text>
<rect x="262" y="238" width="330" height="22" rx="11" fill="#242e3a"/>
<rect x="262" y="238" width="231" height="22" rx="11" fill="#2ea8ff" fill-opacity="0.55"/>
<path d="M559 231 V 267" stroke="#eaf1f8" stroke-width="3" stroke-linecap="round"/>
<text x="612" y="255" font-size="22" font-weight="700" fill="#9aabbc">70%  locked</text>
<path d="M400 308 V 324" stroke="#00e6cf" stroke-width="4" stroke-linecap="round"/>
<path d="M388 322 L400 334 L412 322" fill="none" stroke="#00e6cf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="338" width="720" height="130" rx="18" fill="#12171e" stroke="#242e3a" stroke-width="2"/>
<circle cx="104" cy="400" r="30" fill="url(#beam)"/>
<text x="104" y="411" text-anchor="middle" font-size="30" font-weight="700" fill="#0d1116">2</text>
<text x="158" y="398" font-size="30" font-weight="700" fill="#eaf1f8">The pack asks harder questions</text>
<text x="158" y="438" font-size="22" fill="#9aabbc">Up to 1 bonus point per pack. Packs open one by one.</text>
<path d="M400 474 V 490" stroke="#00e6cf" stroke-width="4" stroke-linecap="round"/>
<path d="M388 488 L400 500 L412 488" fill="none" stroke="#00e6cf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="504" width="720" height="302" rx="18" fill="#12171e" stroke="#242e3a" stroke-width="2"/>
<circle cx="104" cy="566" r="30" fill="url(#beam)"/>
<text x="104" y="577" text-anchor="middle" font-size="30" font-weight="700" fill="#0d1116">3</text>
<text x="158" y="564" font-size="30" font-weight="700" fill="#eaf1f8">Bonus points show as hashed bars</text>
<rect x="70" y="654" width="660" height="30" rx="15" fill="#242e3a"/>
<clipPath id="cb"><rect x="70" y="654" width="660" height="30" rx="15"/></clipPath>
<g clip-path="url(#cb)">
<rect x="70" y="654" width="418" height="30" fill="url(#beam)"/>
<rect x="488" y="654" width="150" height="30" fill="url(#hash)"/>
</g>
<rect x="488" y="655" width="150" height="28" fill="none" stroke="#00e6cf" stroke-width="2"/>
<text x="70" y="642" font-size="22" font-weight="700" fill="#eaf1f8">Code 9.5</text>
<text x="563" y="642" text-anchor="middle" font-size="22" font-weight="700" fill="#00e6cf">+3.4 bonus</text>
<text x="70" y="722" font-size="21" fill="#9aabbc">Solid: the standard score, out of 10. It counts in Overall.</text>
<text x="70" y="754" font-size="21" fill="#9aabbc">Hashed: bonus points. Shown apart, never part of Overall /20.</text>
</svg>
