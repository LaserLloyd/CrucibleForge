<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 874" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How MakoBench works</title>
<desc id="d">Five steps: the same questions for every model; your model answers; the answers are checked by code and one local judge; scores with a range; the board.</desc>
<rect width="800" height="874" rx="28" fill="#0f172a"/>
<rect x="40" y="40" width="720" height="130" rx="18" fill="#16213a" stroke="#27375a" stroke-width="2"/>
<circle cx="104" cy="105" r="30" fill="#38bdf8"/>
<text x="104" y="116" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">1</text>
<text x="158" y="97" font-size="30" font-weight="700" fill="#f1f5f9">The same questions for every model</text>
<text x="158" y="137" font-size="22" fill="#a5b4cc">Coding, tool use, chat and role-play. Fixed sets.</text>
<path d="M400 176 V 192" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
<path d="M388 190 L400 202 L412 190" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="206" width="720" height="130" rx="18" fill="#16213a" stroke="#27375a" stroke-width="2"/>
<circle cx="104" cy="271" r="30" fill="#38bdf8"/>
<text x="104" y="282" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">2</text>
<text x="158" y="263" font-size="30" font-weight="700" fill="#f1f5f9">Your model answers</text>
<text x="158" y="303" font-size="22" fill="#a5b4cc">Run it locally or through an API.</text>
<path d="M400 342 V 358" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
<path d="M388 356 L400 368 L412 356" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="372" width="720" height="130" rx="18" fill="#16213a" stroke="#27375a" stroke-width="2"/>
<circle cx="104" cy="437" r="30" fill="#38bdf8"/>
<text x="104" y="448" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">3</text>
<text x="158" y="429" font-size="30" font-weight="700" fill="#f1f5f9">The answers are checked</text>
<text x="158" y="469" font-size="22" fill="#a5b4cc">By code first. One local judge reads the rest.</text>
<path d="M400 508 V 524" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
<path d="M388 522 L400 534 L412 522" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="538" width="720" height="130" rx="18" fill="#16213a" stroke="#27375a" stroke-width="2"/>
<circle cx="104" cy="603" r="30" fill="#38bdf8"/>
<text x="104" y="614" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">4</text>
<text x="158" y="595" font-size="30" font-weight="700" fill="#f1f5f9">Scores with a range</text>
<text x="158" y="635" font-size="22" fill="#a5b4cc">Code /10 + Chat /10 = Overall /20, each ± a range.</text>
<path d="M400 674 V 690" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
<path d="M388 688 L400 700 L412 688" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="704" width="720" height="130" rx="18" fill="#16213a" stroke="#27375a" stroke-width="2"/>
<circle cx="104" cy="769" r="30" fill="#38bdf8"/>
<text x="104" y="780" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">5</text>
<text x="158" y="761" font-size="30" font-weight="700" fill="#f1f5f9">The board</text>
<text x="158" y="801" font-size="22" fill="#a5b4cc">Models side by side. Close scores show as ties.</text>
</svg>
