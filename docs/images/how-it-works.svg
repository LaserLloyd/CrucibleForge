<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 874" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How MakoBench works</title>
<desc id="d">Five steps: the same questions for every model; your model answers; the answers are checked by code and one local judge; scores with a range; the board.</desc>
<defs>
<linearGradient id="beam" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ea8ff"/><stop offset="1" stop-color="#00e6cf"/></linearGradient>
<pattern id="hash" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="7" fill="#00e6cf"/></pattern>
</defs>
<rect x="1" y="1" width="798" height="872" rx="28" fill="#0d1116" stroke="#242e3a" stroke-width="2"/>
<rect x="40" y="40" width="720" height="130" rx="18" fill="#12171e" stroke="#242e3a" stroke-width="2"/>
<circle cx="104" cy="102" r="30" fill="url(#beam)"/>
<text x="104" y="113" text-anchor="middle" font-size="30" font-weight="700" fill="#0d1116">1</text>
<text x="158" y="100" font-size="30" font-weight="700" fill="#eaf1f8">The same questions for every model</text>
<text x="158" y="140" font-size="22" fill="#9aabbc">Coding, tool use, chat and role-play. Fixed sets.</text>
<path d="M400 176 V 192" stroke="#00e6cf" stroke-width="4" stroke-linecap="round"/>
<path d="M388 190 L400 202 L412 190" fill="none" stroke="#00e6cf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="206" width="720" height="130" rx="18" fill="#12171e" stroke="#242e3a" stroke-width="2"/>
<circle cx="104" cy="268" r="30" fill="url(#beam)"/>
<text x="104" y="279" text-anchor="middle" font-size="30" font-weight="700" fill="#0d1116">2</text>
<text x="158" y="266" font-size="30" font-weight="700" fill="#eaf1f8">Your model answers</text>
<text x="158" y="306" font-size="22" fill="#9aabbc">Run it locally or through an API.</text>
<path d="M400 342 V 358" stroke="#00e6cf" stroke-width="4" stroke-linecap="round"/>
<path d="M388 356 L400 368 L412 356" fill="none" stroke="#00e6cf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="372" width="720" height="130" rx="18" fill="#12171e" stroke="#242e3a" stroke-width="2"/>
<circle cx="104" cy="434" r="30" fill="url(#beam)"/>
<text x="104" y="445" text-anchor="middle" font-size="30" font-weight="700" fill="#0d1116">3</text>
<text x="158" y="432" font-size="30" font-weight="700" fill="#eaf1f8">The answers are checked</text>
<text x="158" y="472" font-size="22" fill="#9aabbc">By code first. One local judge reads the rest.</text>
<path d="M400 508 V 524" stroke="#00e6cf" stroke-width="4" stroke-linecap="round"/>
<path d="M388 522 L400 534 L412 522" fill="none" stroke="#00e6cf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="538" width="720" height="130" rx="18" fill="#12171e" stroke="#242e3a" stroke-width="2"/>
<circle cx="104" cy="600" r="30" fill="url(#beam)"/>
<text x="104" y="611" text-anchor="middle" font-size="30" font-weight="700" fill="#0d1116">4</text>
<text x="158" y="598" font-size="30" font-weight="700" fill="#eaf1f8">Scores with a range</text>
<text x="158" y="638" font-size="22" fill="#9aabbc">Code /10 + Chat /10 = Overall /20, each ± a range.</text>
<path d="M400 674 V 690" stroke="#00e6cf" stroke-width="4" stroke-linecap="round"/>
<path d="M388 688 L400 700 L412 688" fill="none" stroke="#00e6cf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="704" width="720" height="130" rx="18" fill="#12171e" stroke="#242e3a" stroke-width="2"/>
<circle cx="104" cy="766" r="30" fill="url(#beam)"/>
<text x="104" y="777" text-anchor="middle" font-size="30" font-weight="700" fill="#0d1116">5</text>
<text x="158" y="764" font-size="30" font-weight="700" fill="#eaf1f8">The board</text>
<text x="158" y="804" font-size="22" fill="#9aabbc">Models side by side. Close scores show as ties.</text>
</svg>
