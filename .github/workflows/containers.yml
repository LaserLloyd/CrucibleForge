name: containers

# Every push and pull request: build the image (amd64), smoke-test it and run the offline end-to-end check
# (deploy/e2e: a fake provider, the one `test` command, its plain failures, the hostile-code jail selftest).
# No secret is used and nothing is pushed.
#
# Only a version tag (v*) publishes, in a separate job that never runs for a pull request:
#
#   ghcr.io/laserlloyd/crucibleforge:4.5.1, :4.5 and :latest   (from tag v4.5.1)
#
# linux/amd64 + linux/arm64. arm64 is smoke-tested under QEMU emulation before the push (the CLI, the first-run
# seed and the plain no-key failure); the jail selftest and the end-to-end run are amd64-only, because seccomp and
# setuid behave differently under user-mode emulation. The only credential is the workflow's own GITHUB_TOKEN.
# GHCR package visibility is the owner's setting (the first push creates the package private).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/laserlloyd/crucibleforge

permissions:
  contents: read

jobs:
  test:
    name: build / smoke / offline e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64, loaded locally, never pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: crucibleforge:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (scripts/docker-smoke.sh)
        run: IMAGE=crucibleforge:ci NO_BUILD=1 ENGINE=docker sh scripts/docker-smoke.sh

      - name: cases verify in the image (known findings only)
        # `cases verify` exits 1 on any finding, and 4.5 ships known findings (.github/cases-verify-known.txt, the
        # same list the CI workflow uses). It fails only on a finding NOT in that list, or when the command crashes.
        run: |
          set +e
          docker run --rm crucibleforge:ci cases verify --categories math,instruct,reasoning > verify.out 2>&1
          rc=$?
          set -e
          tail -n 5 verify.out
          if ! grep -q 'cases checked' verify.out; then
            echo "cases verify did not finish (exit $rc)"; cat verify.out; exit 1
          fi
          grep '^FAIL' verify.out \
            | sed -E 's#(FAIL ladder: ).*cases[/\\]+ladder[/\\]+([A-Za-z_0-9]+)[/\\]+([A-Za-z_0-9]+):#\1cases/ladder/\2/\3:#' \
            | sort -u > verify-found.txt || true
          sort -u .github/cases-verify-known.txt > verify-known.txt
          comm -23 verify-found.txt verify-known.txt > verify-new.txt
          echo "cases verify in the image: exit $rc, $(wc -l < verify-found.txt) finding(s), $(wc -l < verify-new.txt) new"
          if [ -s verify-new.txt ]; then cat verify-new.txt; exit 1; fi

      - name: Offline end-to-end (fake provider, hostile-code selftest, no secrets)
        run: ENGINE=docker IMAGE=crucibleforge:ci E2E_TMP="$RUNNER_TEMP" sh deploy/e2e/offline_e2e.sh

  publish:
    name: publish (v* tags only)
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write        # attach the SBOM + SHA256SUMS to the release
      packages: write        # push to GHCR
      id-token: write        # cosign keyless + attestations (OIDC)
      attestations: write    # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=true
          labels: |
            org.opencontainers.image.licenses=MIT-0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build arm64 for the emulated smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/arm64
          tags: crucibleforge:arm64-smoke
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: arm64 smoke test (QEMU)
        run: |
          docker run --rm --platform linux/arm64 crucibleforge:arm64-smoke --help | grep -q "usage: crucibleforge"
          docker run --rm --platform linux/arm64 crucibleforge:arm64-smoke config | grep -q "/data/models.yaml"
          set +e
          out=$(docker run --rm --platform linux/arm64 crucibleforge:arm64-smoke test some/model --yes 2>&1); rc=$?
          set -e
          echo "$out" | tail -n 3
          [ "$rc" -eq 20 ] && echo "$out" | grep -q "No OpenRouter key"
          echo "arm64: --help, config and the no-key failure work under emulation"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          sbom: false
          provenance: false

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: SHA256SUMS
        run: sha256sum sbom.cdx.json > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image and attach the SBOM (cosign, keyless)
        run: |
          cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@${{ steps.build.outputs.digest }}"

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attach SBOM + SHA256SUMS to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" sbom.cdx.json SHA256SUMS --clobber
