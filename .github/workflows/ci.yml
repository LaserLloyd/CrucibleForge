name: CI

on:
  push:
    # main is the release; dev is the weekly branch; rc* are release-candidate branches (rc45-rel)
    branches: [main, dev, "rc*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    # This repo's working tree is, by design, full of things that must never be
    # published: `results/` rows, run logs and `models.yaml` are transcripts of
    # a real rig — its endpoints, its LAN addresses, the models it serves. They
    # are git-ignored, and this job is what turns "git-ignored" from an
    # assumption into a check. It runs first and on its own runner: it takes
    # seconds, needs no toolchain, and a leak should fail the build before
    # anything else spends time on it.
    #
    # Read the note this prints. scripts/scrub-rules.local.txt is git-ignored on
    # purpose — publishing the list of words that must never be published is
    # its own leak — so in CI the personal-identifier rules are NOT loaded and
    # this job verifies the generic patterns only (keys, tokens, private keys,
    # JWTs, home paths, private/tailnet IPs, emails). The maintainer's clone is
    # where the name and hostname rules actually run, via the git hooks.
    name: no private data
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the commit-range step below needs the PR's base
      # commit, and the default shallow clone does not contain it — the scan
      # then fails with "unknown revision" on every pull request.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan the tree
        run: python3 scripts/scrub_check.py
      - name: Scan the TREE of every commit in the pull request
        if: github.event_name == 'pull_request'
        # Not just the head: a secret added in one commit and removed in the
        # next still publishes, and a head-only scan calls that clean.
        run: |
          for sha in $(git rev-list --reverse \
              "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            python3 scripts/scrub_check.py --rev "$sha"
          done
      - name: Scan the commit messages being pushed
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/scrub_check.py --commit-range \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Prove the scanner still works
        run: python3 scripts/scrub_check.py --selftest

  unit:
    # The suite is fully offline: every provider call is faked, and the sandbox
    # that executes coding answers is the same one the benchmark uses. Nothing
    # here contacts a model server, so it is safe to run on a public runner.
    name: tests (${{ matrix.os }})
    needs: privacy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest: the maintainer's rig is Windows, so the suite must be
        # green there. Like macOS it has no bubblewrap; the suite grants its OWN
        # fixtures the unsandboxed opt-in (tests/conftest.py) and the gold-answer
        # step below passes --allow-unsandboxed explicitly.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --all-extras --dev
      # Linux gets a REAL sandbox rather than an opt-out. The runner image does
      # not ship bubblewrap, and without it the coding graders refuse to run —
      # which is the correct behaviour, and not something to paper over with
      # the escape hatch when a two-second install gives real isolation.
      - name: Install bubblewrap (the sandbox the graders require)
        if: runner.os == 'Linux'
        # The grading sandbox mounts /usr and /bin but not /etc. On Debian and Ubuntu `awk` is a link into
        # /etc/alternatives, so it is missing inside the sandbox and one shell case of the 4.1 set cannot be
        # verified. Point the link at the real binary on the runner (the engine fix is listed for 4.5.1).
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo ln -sf "$(readlink -f /usr/bin/awk)" /usr/bin/awk
      # bubblewrap on PATH is not a sandbox. GitHub's ubuntu images restrict
      # unprivileged user namespaces (AppArmor), so bwrap installs fine and then
      # cannot create one -- and a suite that only checked `which bwrap` ran
      # graded code with the network wide open. The graders' own self-test
      # (probe_bwrap) starts the real sandbox and connects to a loopback port
      # from inside it, so ask that. If the runner cannot isolate, say so in the
      # annotations and opt in explicitly for the rest of the job; the sandbox
      # tests cover both modes. Nothing here is silent and nothing is weakened:
      # the code that runs is this repository's own fixtures.
      - name: Probe the sandbox (opt in explicitly if the runner cannot isolate)
        if: runner.os == 'Linux'
        run: |
          if uv run python -c "import sys; from crucibleforge import graders as g; r = g.unsandboxed_reason(); print(r or 'bwrap sandbox works and the network is isolated'); sys.exit(1 if r else 0)"; then
            echo "Using the real bubblewrap sandbox."
          else
            echo "::warning title=No usable bubblewrap sandbox on this runner::Running with CRUCIBLEFORGE_ALLOW_UNSANDBOXED=1 (explicit opt-in); the sandbox tests assert the refusal and opt-in paths instead of a blocked connect."
            echo "CRUCIBLEFORGE_ALLOW_UNSANDBOXED=1" >> "$GITHUB_ENV"
          fi
      # Ruff is version-pinned on purpose. `uvx ruff` resolves to whatever is
      # newest at run time, so an unpinned lint step turns every upstream
      # release into a build that breaks without anyone touching this repo.
      # The rule selection lives in pyproject.toml, next to its reasoning.
      # Linux only: lint results cannot differ by OS, so running it on both
      # legs would only duplicate the failure.
      - name: Lint
        if: runner.os == 'Linux'
        run: uvx ruff@0.16.5 check .
      # A failed test is run again up to twice before the job fails. Shared
      # runners are slow and noisy, and a few tests carry wall-clock limits
      # (for example the case-set check runs a coding case's mutant against an
      # 8-second limit while every core is busy with other tests). A test that
      # fails three times in a row still fails the job.
      - name: Tests
        run: uv run --with pytest-rerunfailures pytest -q -n auto --reruns 2 --reruns-delay 5
      # The gold answers are not taken on trust: every math/reasoning answer is
      # recomputed from its `verify` expression and every coding `reference`
      # solution is executed against its own tests. A case file edited by hand
      # fails here rather than silently mis-scoring a model.
      - name: Verify every case's gold answer
        # macOS and Windows have no bwrap and never will, so on those legs this
        # step executes the repo's OWN reference solutions unsandboxed — on a
        # disposable runner, with code that is in this repository and
        # reviewable, not a model's. That is exactly the deliberate choice
        # --allow-unsandboxed exists for, and naming it here keeps it visible in
        # the log instead of hidden in a default. On Linux the flag is absent and
        # the real sandbox is used. (bash on every leg: Windows runners default
        # to PowerShell.)
        shell: bash
        run: |
          # 4.5.0 ships 24 known findings of `cases verify` (pack folders of the 4.1 profile that the 4.5 profile
          # does not name, six cases without an element standard, three pack items): they are listed in
          # .github/cases-verify-known.txt and cannot be cleaned without moving row stamps (4.5.1). The step
          # fails on any finding that is NOT in that list. Linux is the reference system: on macOS and Windows the
          # same check runs unsandboxed and its findings are printed but do not fail the job.
          set +e
          if [ "${{ runner.os }}" = "Linux" ]; then
            uv run crucibleforge cases verify > verify.out 2>&1
          else
            uv run crucibleforge --allow-unsandboxed cases verify > verify.out 2>&1
          fi
          tail -n 5 verify.out
          grep '^FAIL' verify.out \
            | sed -E 's#(FAIL ladder: ).*cases[/\\]+ladder[/\\]+([A-Za-z_0-9]+)[/\\]+([A-Za-z_0-9]+):#\1cases/ladder/\2/\3:#' \
            | sort -u > verify-found.txt
          sort -u .github/cases-verify-known.txt > verify-known.txt
          comm -23 verify-found.txt verify-known.txt > verify-new.txt
          echo "cases verify: $(wc -l < verify-found.txt) finding(s), $(wc -l < verify-new.txt) not in the known list"
          if [ -s verify-new.txt ]; then
            cat verify-new.txt
            if [ "${{ runner.os }}" = "Linux" ]; then exit 1; fi
          fi
