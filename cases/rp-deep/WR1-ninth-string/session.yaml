id: WR1-ninth-string
user_name: the author
format_gate: chat
deep_rubric: chat_deep
rules: 'You are the co-writer described in the card below, working one-on-one in a chat with the user, an author
  who is writing a short story with you one section at a time.


  Rules (strict):

  1. Each reply is exactly the text the author asks for — the section itself, nothing before or after it: no greeting,
  no commentary, no notes, no questions back.

  2. Plain text only: no markdown, no headings, no bold or italics, no lists. A title, when asked for, is a plain
  line.

  3. Follow every instruction the author gives. Rules set in an earlier message hold for the whole story unless
  the author changes them.

  4. Count carefully: word limits are limits, and exact wording is exact.

  5. Keep every reply under 450 words.

  '
judge_card_summary: 'The Writing Desk co-writer: an author and a co-writer draft one short story section by section
  in a chat. The co-writer replies with exactly the requested section (no commentary, no markdown, title as a plain
  line). Rules set "for the whole piece" hold until the author changes them; a midway change ("from here on") holds
  forward only. Plain, concrete prose; feeling shown through hands, voices and objects; endings on something seen
  or heard; nothing planted is wasted.

  '
judge_key: 'The assistant is the co-writer; the user is the author. The story so far is the assistant''s replies,
  one section per turn. Whole-piece rules from turn 1: first person; narrator Wren Adair (34, piano tuner); banned
  words; past tense until the author''s note. Characters: Mr. Tobias Hale (81), owner of an upright piano; on turn
  1 his DAUGHTER Ines booked the visit. The author''s note on turn 2 changes two things from then to the end: she
  is now MARGIT, his GRANDDAUGHTER, and the story switches to PRESENT tense (section 1 is not rewritten). Section
  1 plants one small object inside the piano with one specific detail (a mark, number or word on it); section 3
  (turn 3, the last section) must pay it off THROUGH that detail. A second change on turn 3: the Hales live on a
  HOUSEBOAT on the canal, not a flat; the word ''flat'' is not used from turn 3 on. From turn 2 to the end of the
  story no word is longer than seven letters.'
temperature: 0.8
top_p: 0.95
max_tokens: 2000
min_context: 40960
turns:
- 'Hi! Let''s write a short story together, one section per message. Ground rules for the whole piece: first person,
  past tense; the narrator is Wren Adair, 34, a piano tuner. Never use these words anywhere in the story: suddenly,
  very, just, slowly, heart, smile (any form), glance (any form), realise/realize (any form).


  Section 1 (150-180 words, the title included): put the story''s title on the first line by itself, five words
  at most, then begin the section with exactly this sentence: "The piano had not been played since the winter the
  canal froze." Wren arrives at the flat of Mr. Tobias Hale, 81, to tune an old upright before it is sold; his daughter,
  Ines, booked the visit, so name her. Inside the piano, Wren finds one small object that seems unimportant: give
  it one specific, unusual detail (a mark, a number or a word on it), mention it, don''t explain it. The last section
  will turn on that detail.

  '
- 'Author''s note before section 2, three changes from here to the end of the story: (1) Ines is now called Margit,
  and she is Mr. Hale''s granddaughter, not his daughter; show that relation in a concrete line in section 2 and
  again in section 3. (2) Switch the narration to present tense. (3) No word longer than seven letters, names included.
  Don''t go back and fix earlier sections; write forward.


  Section 2 (140-170 words): Margit arrives at the flat. Exactly one line of dialogue in this section, and Margit
  speaks it; everything else is narration.

  '
- 'One more author''s change, from here to the end: the Hales live on a houseboat moored on the canal, not in a
  flat. Don''t use the word "flat" again, in any sense, and call it the boat. Earlier sections stay as they are.


  Section 3, the last one (160-190 words): pay off the object from section 1 through the specific detail you gave
  it. It has to change what happens. Mr. Hale goes to the piano, but don''t use the word "play" in any form (play,
  plays, played, playing) in this section. Use the word "string" (singular) exactly three times in this section.
  Show Mr. Hale''s grief only through his hands and the piano; don''t name any emotion (no sad, grief, sorrow, tears,
  cry/cried, wept). Bring back the phrase "the winter the canal froze" somewhere in the section. The final paragraph
  is a single sentence of exactly 20 words, and it is a concrete image, not a lesson.

  '
