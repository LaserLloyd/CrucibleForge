judge_elements:
- id: P1-object-pays-off
  ftype: applied
  turns:
  - 1
  - 3
  q: 'Concrete test, two parts, both required. (a) Turn 1: name the ONE specific detail on the object Wren finds
    inside the piano (a mark, number or word on it) and quote it. (b) Turn 3 (the last section): quote the line
    that names THAT SAME detail again (the same number / mark / word, not a new one), and say what happens BECAUSE
    of it — the detail itself must cause an action or explain an event (the number on it matches or opens something,
    the word on it is read and someone acts on it, it shows why the piano went silent). YES only if (a) and (b)
    both hold. NO if turn 1 gives no specific detail, if turn 3 does not repeat that exact detail, if turn 3 only
    mentions or describes the object, or if the payoff would work the same without the detail.'
  evidence:
  - src: turn
    text: give it one specific, unusual detail (a mark, a number or a word on it), mention it, don't explain it.
      The last section will turn on that detail.
  - src: turn
    text: pay off the object from section 1 through the specific detail you gave it. It has to change what happens.
  gold_quote: Seven forty, the ticket says.
  weight: 3.5
