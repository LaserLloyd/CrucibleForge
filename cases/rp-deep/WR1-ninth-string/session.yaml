    carries the feeling. NO if the section tells it instead: an emotion word (sad, grief, sorrow, loss, pain, heartbroken,
    tears, cried, wept), a line saying what something meant to him or what he felt or remembered, a description
    of his face or eyes or voice as the carrier, or narration explaining the moment.'
  evidence:
