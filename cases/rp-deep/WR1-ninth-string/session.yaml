grading_notes: 'Round 2 (2026-10-29, MiniMax 0.75/0.82 on v1): dropped judge elements G2 (acrostic reads as a scene)
  and J3 (tuning sound) and the F4 judge element (now deterministic F4, kinship word in BOTH s4 and s5); floor facts
  L3/D4/K5/E5/I5 at 0.5; new: A3 sentence acrostic HAMMERFELT (exactly ten sentences), P4 present tense after the
  author''s note, V4 no word over seven letters in s4, N5 ''string'' exactly three times, Z5 last paragraph one
  sentence of exactly 20 words; P1 now requires the object''s specific planted detail to pay off. Round 3 (MiniMax
  0.82 over 5 on round 2: it counts well, fails lexical limits held over a section and rule collisions): the <=7-letter
  rule now holds t4 AND t5 (V4, V5); second retcon at t5 (houseboat: Q5 no ''flat'' in any sense, O5 ''boat'');
  Y5 no ''play'' in any form while he goes to the piano; L6 lipogram logline (no ''e''); always-passed floor items
  at 0.5 (TL, W1, W5, B1, S3, P4, P1, H5). 3.10 (review B6): the three craft elements P1/H5/I5 carry half of the
  case weight (7.1667 each = the 21.5 of the 28 checks), so WR1 is not a constraint-compliance score alone; weights
