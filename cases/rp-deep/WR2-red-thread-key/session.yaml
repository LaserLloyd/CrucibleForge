id: WR2-red-thread-key
user_name: the author
format_gate: chat
deep_rubric: chat_deep
rules: 'You are the co-writer described in the card below, working one-on-one in a chat with the user, an author
  who is writing a short story with you one section at a time.


  Rules (strict):

  1. Each reply is exactly the text the author asks for — the section itself, nothing before or after it: no greeting,
  no commentary, no notes, no questions back.

  2. Plain text only: no markdown, no headings, no bold or italics, no lists. A title, when asked for, is a plain
  line.

  3. Follow every instruction the author gives. Rules set in an earlier message hold for the whole story unless
  the author changes them.

  4. Count carefully: word limits and word counts are exact, and exact wording is exact.

  5. Keep every reply under 450 words.

  '
judge_card_summary: 'The Writing Desk co-writer: an author and a co-writer draft one short story section by section
  in a chat. The co-writer replies with exactly the requested section (no commentary, no markdown, title as a plain
  line). Rules set "for the whole piece" hold until the author changes them; a midway change holds forward only
  and is absorbed into the story without comment. Plain, concrete prose; people rarely say what they mean, the weight
  sits in what they do with their hands and what they leave unsaid; endings on something seen or heard; nothing
  planted is wasted.

  '
judge_key: 'The assistant is the co-writer; the user is the author. The story so far is the assistant''s replies,
  one section per turn. Whole-piece rules from turn 1: third person, present tense; main character Odile Marsh,
  52, night cleaner at a bus depot; a banned-word list; no word ending in the letters l-y; no sentence begins with
  a pronoun; every pair of quotation marks holds exactly six words (five from the turn-3 note). Section 1 plants
  a brass key on a red thread and gives its tag ONE specific detail. Turn 3 note, forward only: the driver Piet
  becomes Pieta, a woman (she/her), with no explanation in the text; quotation marks now hold exactly five words.
  Sections 2 and 3 have sentences of 11 words or fewer; each paragraph of section 2 ends on a four-letter word.'
temperature: 0.8
top_p: 0.95
max_tokens: 2000
min_context: 40960
turns:
- 'Let''s write a short story together, one section per message. Ground rules for the whole piece: third person,
  present tense; the main character is Odile Marsh, 52, a night cleaner at a bus depot. Never use these words anywhere
  in the story: always, never, perhaps, seemed, tired, quiet, alone, silence, silent. No word anywhere in the story
  may end in the letters l-y: not only, not family, not early, not fly. No sentence may begin with a pronoun (she,
  he, it, they, her, his, its, their, them); that holds for sentences inside quotation marks too. Whenever anyone
  speaks, each pair of quotation marks holds exactly six words, no more and no fewer.


  Section 1 (110-140 words, the title included): put the story''s title on the first line by itself, four words
  at most, then begin the section with exactly this sentence: At 2:10 the last bus of the night noses into Depot
  Nine, and Odile is already waiting with the bucket. In the lost-property cage she finds one small object that
  seems unimportant: a brass key on a loop of red thread. Give the key''s tag one specific, unusual detail (a number,
  a mark or a word on it), mention it, don''t explain it. The driver, Piet, is still in his cab. The last section
  will turn on that detail. No dialogue in this section.

  '
- 'Section 2 (140-180 words): exactly three paragraphs. Odile mops the bus while Piet watches her from the doors,
  and the two of them talk. Piet must say this line, word for word, inside his quotation marks: Bay six went under
  in March. Odile does not ask about the key at any point and does not say aloud that she wants to know; show that
  she does by what she does with her hands and the bucket. Present tense, and the six-word rule for every pair of
  quotation marks still holds. In sections 2 and 3, every sentence is 11 words or fewer (a quoted line and the tag
  after it count as one sentence). Each of the three paragraphs of section 2 ends on a word of exactly four letters.

  '
- 'Author''s note before section 3, two changes from here to the end: (1) Piet is now Pieta, a woman, the night
  driver; use she and her for Pieta from here on, and don''t explain the change. (2) Every pair of quotation marks
  now holds exactly five words, not six. Don''t go back and fix earlier sections; write forward.


  Section 3 (80-110 words), still present tense, and the 11-word sentence limit still holds: Pieta walks Odile out
  to the old wash bay at the back of the depot, where the floor is still stained to knee height. Only the final
  sentence of the section may begin with the word The, and that final sentence is exactly this: The hose is still
  coiled where the water stopped.

  '
