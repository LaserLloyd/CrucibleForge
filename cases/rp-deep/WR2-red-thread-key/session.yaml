judge_elements:
- id: S2-wanting-shown-in-hands
  ftype: applied
  turns:
  - 2
  q: The author asked that Odile never ask about the key and never say she wants to know, but that her wish to know
    SHOW in what she does with her hands and the bucket. Does section 2 show her interest in the key through a specific
    physical action with the key, the tag or the cleaning things (not in a spoken question, not in narration saying
    she wonders or wants to know)? Quote the line. NO if she asks about the key, says she is curious, or the narration
    tells her thoughts about it instead of showing an action.
  evidence:
  - src: turn
    text: Odile does not ask about the key at any point and does not say aloud that she wants to know; show that
      she does by what she does with her hands and the bucket.
  gold_quote: Odile takes out the key to wipe mud off its tag.
  weight: 1.5
  pruned: '4.0 fix: all-pass on the 2026-10-31 board, half weight'
- id: A3-change-absorbed-silently
  ftype: applied
  turns:
  - 3
  q: The author's note changed the driver Piet into Pieta, a woman, and said not to explain the change. Does section
    3 simply present Pieta as the night driver, with she and her, and without ANY sentence that points at, explains
    or reconciles the change (no 'formerly Piet', 'now called', 'had changed her name', 'the new driver', no mention
    that the driver was once a man)? Quote Pieta's first appearance. NO if the text comments on the change in any
    way, or leaves the driver unnamed.
  evidence:
  - src: turn
    text: Piet is now Pieta, a woman, the night driver; use she and her for Pieta from here on, and don't explain
      the change.
  gold_quote: Pieta leads Odile through a side door to the wash bay.
  weight: 1
  pruned: '4.0 fix: all-pass on the 2026-10-31 board, half weight'
- id: TG3-tag-detail-acted-on
  ftype: applied
  turns:
  - 1
  - 3
  q: 'Two parts, both required. (a) Turn 1: the specific detail on the key''s tag (a number, mark or word). (b) Turn 3: a character DOES something with that same detail in the wash bay: reads it out, matches it to a locker, door, hook, pipe or number, counts to it, or tries the key. Your quote must be the section-3 line that repeats the detail AND shows the doing. YES only if (a) and (b) both hold. NO (empty quote) if section 3 never repeats the detail, or only mentions the tag or key in passing, or the detail is merely on the page (a shadow falling across it, a hand resting on it) and nobody does anything with it.'
  evidence:
  - src: turn
    text: 'Give the key''s tag one specific, unusual detail (a number, a mark or a word on it), mention it, don''t explain it.'
  gold_quote: 'counts the lockers to six'
  weight: 6
  scored: false
  pruned: '4.0 fix: not in the author''s brief / unreachable, kept as diagnostic'
- id: TK2-both-speak
  ftype: applied
  turns:
  - 2
  q: 'The author wanted the two of them to TALK. Quote ONE line that Odile herself says aloud in section 2: inside quotation marks and spoken by Odile (not by Piet). YES only if such a line exists. NO (empty quote) if only Piet speaks in quotation marks, or if Odile''s words are only described without quotation marks.'
  evidence:
  - src: turn
    text: 'Odile mops the bus while Piet watches her from the doors, and the two of them talk.'
  gold_quote: 'Rain keeps floors wet, Piet, sorry'
  weight: 2
  pruned: '4.0 fix: weight capped so one judge verdict is worth at most ~10% of the case'
grading_notes: ' 4.0 lite (time budget, 2026-10-31): cut to its first 3 turns (plant, the hands-not-words scene,
  the silent retcon); sections 4-6 left with their checks and elements; the two craft elements keep half of the
  case weight. 4.0 lite saturation fix (2026-10-31, grading only, prompts unchanged): WR2 scored 1.0 for most models. New checks DQ1 (no dialogue in section 1), KQ2 (nobody asks about the key), KT3 (key/thread/tag back in section 3), BY3 (bay six / March comes back), SP1 (stock phrases), OP1 (sentence-opener variety); new judge elements TG3 (the tag''s detail is acted on in section 3) and TK2 (Odile speaks too); S2/A3 weights lowered. Re-grade only (re-judge rows with --force).'
