judge_elements:
- id: J1-asks-about-council
  ftype: callback
  turns:
  - 1
  - 2
  q: 'On Sunday 8 November Ansel said he would ring the council on Friday about collecting the mattress, and Bram told him:
    ''tell me on Saturday how the call went. I''ll want to know.'' It is now Saturday 14 November and Ansel has not mentioned
    it. In either of these two replies, does Bram bring it up himself: ask how the call to the council / the mattress collection
    went? Quote the line. NO if he never mentions it.'
  evidence:
  - src: log
    text: I'm going to ring the council on Friday about collecting the mattress.
  - src: log
    text: tell me on Saturday how the call went. I'll want to know.
  gold_quote: did you get through to the council about the mattress
- id: C1-two-date-slips
  ftype: correction
  turns:
  - 1
  q: 'Ansel says the skip is coming ''Tuesday the 16th'' and that he has ''till the 30th''. From the earlier chats: the
    skip is delivered Tuesday the 17th of November (Monday is the 16th), and on 1 November completion moved from Monday
    30 November to Monday 7 December. Does Bram correct BOTH slips: the skip is Tuesday the 17th (not the 16th) AND completion
    is the 7th of December (not the 30th)? Quote the line(s). NO if either is missing or wrong.'
  evidence:
  - src: log
    text: delivered Tuesday the 17th of November
  - src: log
    text: Completion has moved from Monday the 30th of November to Monday the 7th of December.
  gold_quote: completion moved to Monday the seventh of December
- id: P1-loft-not-alone
  ftype: pushback
  turns:
  - 2
  q: 'Ansel says the ladder is wobbly but he will just nip up into the dusty loft for ten minutes, and mentions that Terry
    is away until Sunday night. From the earlier chats: he has asthma that dust sets off (blue inhaler), the aluminium ladder
    is wobbly, Terry had offered to foot it, and Bram told him ''Not on your own.'' The skip arrives on Tuesday, so the
    loft can wait till Monday. Does Bram tell him NOT to go up on his own now (wait until Terry is back / Monday / someone
    else foots the ladder) and give the reason from those facts: his asthma, the dust or the wobbly ladder? Quote the line.
    NO if he lets him go up alone (even with a mask), gives only generic care, or ignores that Terry is away.'
  evidence:
  - src: log
    text: I've got asthma and dust sets it off. I carry a blue inhaler.
  - src: log
    text: Terry, said he'd foot the ladder for me, it's one of those wobbly aluminium ones.
  gold_quote: Then it waits for Monday
- id: I1-eat-a-lasagne
  ftype: inductive
  turns:
  - 3
  q: 'Ansel says the freezer is ''still stacked with her stuff'' and he thinks it is cereal for tea again, no sense cooking
    for one. From the earlier chats: his mother''s freezer holds six portions of her lasagne, each labelled in her handwriting,
    which he can neither eat nor bin. Does Bram connect the two: tell him to have one of his mother''s lasagnes for tea
    (the freezer, the lasagnes), instead of cereal? Quote the line. NO if he only tells him to eat properly, suggests other
    food, or does not mention the lasagnes.'
  evidence:
  - src: log
    text: Her freezer is full of her lasagnes. Six portions, each in a foil tray with a label in her handwriting, Lasagne,
      March.
  gold_quote: there are six of your mum's lasagnes in that freezer
- id: K1a-radio-is-the-keeper
  ftype: inductive
  turns:
  - 4
  weight: 0.5
  q: 'Ansel can keep one of three things from box fourteen: a china ballerina, his mother''s transistor radio, a framed
    print of Whitby harbour. From the earlier chats: he took her kitchen radio home first (''It''s the sound I miss, not
    the things''), and chose teapots by use and not looks. Does Bram pick the transistor radio as the one to keep? Quote
    the line. NO if he picks the ballerina or the print, says keep all, or will not choose.'
  evidence:
  - src: log
    text: It's the sound I miss, not the things.
  gold_quote: Keep the radio, Ansel. It's the one that makes a sound
- id: K1b-ballerina-is-dust-with-a-face
  ftype: inductive
  turns:
  - 4
  weight: 0.5
  q: 'In the same triage: does Bram let the china ballerina go AND tie that to Ansel''s own earlier rule about ornaments
    (''dust with a face'', or that he keeps things by use/sound, not by looks)? Quote the line. NO if he keeps the ballerina,
    or lets it go with no link to Ansel''s rule.'
  evidence:
  - src: log
    text: I'm not keeping ornaments. They're dust with a face.
  gold_quote: The ballerina goes, because you called ornaments dust with a face
- id: D1-piano-already-promised
  ftype: combination
  turns:
  - 6
  q: 'Ansel says Keir is flying over and will take the piano on Saturday. From the earlier chats: Keir cannot take the piano
    because shipping to Calgary was £1,900; Keir agreed it should go to St Cuthbert''s church hall. Does Bram point out
    that the piano is already going to St Cuthbert''s (and/or that Keir agreed because of the shipping cost), so Keir should
    not plan on taking it? Quote the line. NO if he goes along with Keir taking the piano or does not mention St Cuthbert''s
    / the shipping agreement.'
  evidence:
  - src: log
    text: So St Cuthbert's church hall is having it.
  - src: log
    text: Keir agreed, he'd rather it was played than sat in a crate.
  gold_quote: the piano is already promised to St Cuthbert's, and Keir agreed to that because shipping was nineteen hundred
    pounds
- id: N2-piano-day-moves
  ftype: state
  turns:
  - 6
  q: In the same message Ansel adds that Mrs Dacey's men can now only come on Wednesday the 18th (the earlier arrangement
    was Thursday the 19th). Does Bram take the change on board in this reply, referring to the piano collection as Wednesday
    the 18th (or the 18th) rather than Thursday the 19th? Quote the line. NO if he ignores the new day or still says Thursday.
  evidence:
  - src: turn
    text: 'Also Mrs Dacey rang: her men can only come on Wednesday the 18th now.'
  gold_quote: Mrs Dacey's men now come on Wednesday the eighteenth
- id: Y1-photograph-the-door
  ftype: combination
  turns:
  - 8
  q: Ansel says he found his and his brother Keir's childhood height marks in pencil inside the airing cupboard door. From
    the earlier chats completion (handover of the house) is on Monday 7 December and Keir lives in Calgary. Does Bram give
    a practical step to keep the marks (photograph the door, or take the door/section) tied to the handover date and/or
    sending a copy to Keir? Quote the line. NO if he only sympathises, or tells him to leave it, or gives a step with no
    link to the sale date or to Keir.
  evidence:
  - src: log
    text: Completion has moved from Monday the 30th of November to Monday the 7th of December.
  - src: log
    text: My brother Keir is in Calgary, so it's mostly me.
  gold_quote: Photograph that door before the seventh of December and send Keir a copy
- id: D2-the-three-dates
  ftype: state
  turns:
  - 10
  q: 'Ansel asks what he still has to get done and by when, just the dates. Current facts: the skip is delivered Tuesday
    17 November; the piano collection was Thursday 19 November but Mrs Dacey changed it on turn 6 to WEDNESDAY 18 November;
    completion is Monday 7 December. Does Bram give ALL THREE dates correctly with the UPDATED piano day (skip Tue 17 Nov,
    piano Wed 18 Nov, completion Mon 7 Dec)? Quote the line. NO if any is missing or wrong, if the piano is still given
    as Thursday the 19th, or if he gives the old 30 November completion.'
  evidence:
  - src: log
    text: delivered Tuesday the 17th of November
  - src: turn
    text: her men can only come on Wednesday the 18th now
  gold_quote: Skip Tuesday the seventeenth, piano Wednesday the eighteenth
