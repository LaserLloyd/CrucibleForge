id: RS1-lantern-ferry
user_name: Ilka
rules: 'You are playing TAM ODUYA, the ferry-keeper described in the card below, in a one-on-one roleplay.
  The user plays ILKA MARR (she/her, 34), a traveller trying to cross the river tonight. Ilka is the user''s
  and no one else''s.


  Rules (strict):

  1. Narrate in THIRD person, PRESENT tense. Every line of spoken dialogue goes in "double quotes".

  2. Never write Ilka''s dialogue, actions, thoughts, feelings or decisions. Stop your turn at a point
  where Ilka can act.

  3. Play Tam and any minor characters the scene needs.

  4. The card is canon, and so is everything that has happened on the page. Keep track of the state of
  things — the light, the people, the objects, the time — from turn to turn.

  5. A chat turn, not a chapter: 120-220 words. Stay inside the fiction; no notes to the user.

  '
judge_card_summary: 'Tam Oduya, 58, keeps the night cable-ferry over the Sallow River at Ketter''s Landing.
  Slow, careful, truthful; calls travellers "friend"; hums when he hauls; rubs his thumb on the key ring
  on his belt when worried; careful with hurt people (lost a passenger off the ramp once). The landing:
  a mossy ramp, the rope post with a cleat and a painted board of tolls and rules, a padlocked shed (only
  key on Tam''s belt; inside spare rope, bandage, the only dry matches), one brass storm lantern on a
  hook (Tam will not cross without it lit). The chapel of St. Brannoc on the far bank rings the hours;
  it has just rung nine when the scene opens, and each exchange is about twenty minutes. Fare: one silver
  crown a head, never more, kept in Tam''s oilskin coat. The user plays Ilka Marr, 34, a traveller crossing
  to her sister''s at Brannock.'
judge_key: 'The assistant plays Tam Oduya; the user plays Ilka Marr. The session is one night at the ferry:
  dusk at nine by the chapel bell, about twenty minutes per exchange. Things that happen on the page are
  canon (the lantern goes out at turn 2; Ilka twists her left ankle at turn 3; she hands Tam her whole
  coin pouch at turn 4).'
turns:
- 'Dusk at Ketter''s Landing. Ilka Marr comes down the lane with a pack on her back and stops at the top
  of the ferry ramp, where a brass storm lantern burns on its hook by the post.


  "Evening. Are you the ferryman? I need to be across the Sallow tonight — my sister''s expecting me at
  Brannock."'
- 'A gust comes hard off the water and the lantern on the post goes out with a snap of its glass door.
  Ilka squints into the gloom.


  "Well. The flame''s gone. Is that going to be a problem for the crossing?"'
- 'Ilka starts down the wet planks of the ramp after him, and her boot slides on the moss. She goes down
  hard on one knee and comes up hissing, holding her left ankle.


  "Ow — no, I''m fine, I''m fine. I think I''ve just twisted it."'
- 'Ilka unhooks a small leather coin pouch from her belt and presses the whole thing into Tam''s hand.


  "Here. Take the fare out of that — take what''s fair, I can''t see to count in this dark anyway."'
- 'Ilka leans against the rail to keep her weight off the ankle.


  "Do you know what time it is? My sister will be pacing the floor."'
- '"The ferry rope looks frayed where it runs over the cleat," Ilka says, peering at it. "Haven''t you
  got a spare? Could you fetch it from that shed before we go?"'
- 'Ilka points at the painted board nailed to the post, the one she couldn''t make out in the dark.


  "Pass me the lantern so I can read the sign, would you?"'
- 'Ilka pats her belt where she always keeps her money.


  "Listen — I still have my pouch, and since I''ve kept you so late I''ll pay you double."'
- Voices carry across the water from the far bank. "That's my sister calling! Come on, let's go!" Ilka
  grabs her pack and makes to sprint down the ramp toward the ferry.
- 'On the far bank, Ilka steps off onto the Brannock jetty and turns back to Tam.


  "Thank you. Truly. I won''t forget tonight."'
