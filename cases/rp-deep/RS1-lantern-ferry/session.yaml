judge_elements:
- id: E1-lantern-out
  fact: E1
  ftype: state
  turns:
  - 2
  q: A gust has just put the lantern out. In this reply, is the lantern treated as OUT — dark, dead, needing
    to be relit — rather than still giving light? Quote the line that shows it is out. NO if the reply
    goes on describing the lantern's light or glow as if nothing happened.
  evidence:
  - src: turn
    text: the lantern on the post goes out with a snap of its glass door
  - src: card
    text: When it is out, the landing is dark except for the chapel windows on the far bank.
  gold_quote: The glass door of the lantern bangs and the light dies with it.
- id: E4-time-past-ten
  fact: E4
  ftype: time
  turns:
  - 5
  q: Asked the time, does Tam give a time AFTER ten o'clock and before eleven (the bell rang nine four
    exchanges ago, about twenty minutes each, so it is about twenty past ten; 'gone ten', 'the bell rang
    ten' or 'half ten' are fine)? Quote the line. NO if he says it is nine-something or a time of eleven
    or later, or dodges with no time at all.
  evidence:
  - src: card
    text: When this scene opens, the chapel bell has just rung nine. In this telling, each exchange between
      Tam and a traveller takes about twenty minutes of the night, so the hours move on as the talk does;
      Tam keeps time by the bell, not by any watch.
  gold_quote: So call it twenty past ten, give or take.
- id: E5-shed-key
  fact: E5
  ftype: applied
  turns:
  - 6
  q: Asked to fetch the spare rope from the shed, does Tam unlock the shed with the key from his belt
    (or ring) before going in — rather than the shed simply being open, or him sending the traveller in?
    Quote the line where he uses the key.
  evidence:
  - src: card
    text: The shed is always locked. The only key hangs on an iron ring on Tam's belt, beside his clasp
      knife, and he unlocks the shed himself — nobody else ever goes in.
  gold_quote: He unhooks the iron ring from his belt and picks out the heavy key by touch.
- id: E6-lantern-for-the-sign
  fact: E6
  ftype: state
  turns:
  - 7
  q: 'Asked to pass the lantern so the traveller can read the sign: the lantern went out at turn 2. Does
    the reply handle that correctly — Tam says it is out, or relights it on the page (a match struck,
    the wick lit) before using it? Quote the line. NO if a lit, shining lantern is simply handed over
    or held up with no relighting.'
  evidence:
  - src: turn
    text: the lantern on the post goes out with a snap of its glass door
  - src: card
    text: The tin in the shed holds the only dry matches on the landing; the river damp ruins anything
      carried in a coat pocket.
  gold_quote: touches the flame to the wick
- id: E3-pouch-retcon
  fact: E3
  ftype: retcon
  turns:
  - 8
  q: Earlier (turn 4) the traveller pressed the WHOLE coin pouch into Tam's hand. Now she says she still
    has her pouch. Does Tam correct this in character — he has the pouch, she gave it to him — rather
    than accepting that she still has it? Quote the line.
  evidence:
  - src: turn
    text: Ilka unhooks a small leather coin pouch from her belt and presses the whole thing into Tam's
      hand.
  gold_quote: You gave it to me an hour back
- id: E7-no-double-fare
  fact: E7
  ftype: applied
  turns:
  - 8
  weight: 0.5
  q: Offered double the fare, does Tam refuse to take more than the one-crown fare? Quote the line. NO
    if he accepts the extra money or does not answer the offer.
  evidence:
  - src: card
    text: He has never in thirty-one years taken a coin more than the fare, and he says so if anyone offers.
  gold_quote: And I'll not take double.
- id: E2-ankle-no-running
  fact: E2
  ftype: state
  turns:
  - 9
  q: The traveller twisted her left ankle on the ramp at turn 3 and now makes to sprint down the ramp.
    Does Tam react to the injured ankle — stop her, warn her, or have her go slowly with support — rather
    than letting the run go ahead as if she were unhurt? Quote the line. Writing what Ilka does or feels
    does not count; Tam's own words or actions must show it.
  evidence:
  - src: turn
    text: She goes down hard on one knee and comes up hissing, holding her left ankle.
  - src: card
    text: He is careful with hurt people — he lost a passenger off the ramp once, years ago, and he will
      not let anyone with a bad leg take the ramp at more than a walk.
  gold_quote: Not on that ankle, and not on this ramp.
