judge_elements:
- id: J1-clues-plain
  ftype: applied
  turns:
  - 1
  - 2
  q: 'In sections 1 and 2 the clues (block-capital unsigned notes, the tern-bordered handkerchief, the smoke that smells of toast) must be planted as plain detail. Check three things and quote the lines: (a) all three clues are on the page, (b) Corran or the narration never comments on what they might mean, and (c) the narration never calls the keeper he, him or his and never says or implies Corran has seen the keeper. NO if a clue is missing, explained, or the narration misleads (a he/him for the keeper, a glimpse of the keeper).'
  evidence:
  - src: turn
    text: Plant the clues as plain detail; Corran never comments on what they might mean.
  gold_quote: 'A note, in capitals, on the back of a receipt: FLOUR. TWO PARAFFIN. NAVY CUT.'
  weight: 1.0
- id: J2-reveal-by-object
  ftype: applied
  turns:
  - 3
  - 4
  q: 'Section 3 plants the teapot of geraniums; section 4 must then reveal the secret THROUGH the logbook written in two hands (an object shown on the page: e.g. a copperplate hand that stops at a dated entry and block capitals that go on). Quote the line that shows the two hands. NO if the reveal is delivered by speech, by narration simply stating what happened, or if the logbook does not show two hands.'
  evidence:
  - src: turn
    text: 'Show the truth through an object: the keeper''s logbook, which is in two hands.'
  gold_quote: The entries stopped in copperplate on the eleventh of February and went on in block capitals.
  weight: 1.0
- id: J3-clues-recast
  ftype: applied
  turns:
  - 4
  q: Does section 4 recall at least two of the earlier clues by their specific detail (terns, capitals, toast, teapot) AND recast each one, saying or showing what it was for or meant in Odile's secret (not just naming it again)? Quote the two lines. NO if fewer than two are recalled with their detail, or if they are only listed.
  evidence:
  - src: turn
    text: At least two of the four clues (capitals, terns, toast, teapot) are recalled here by their specific detail and recast by what is now known.
  gold_quote: The toast was hers; the tobacco went into the stove to make the smoke honest.
  weight: 1.0
- id: J4-pov-odile
  ftype: applied
  turns:
  - 4
  q: Section 4 must be close third on Odile only. Does the narration give Odile's perceptions or thoughts and never enter Corran's head (no Corran thinking, wondering, knowing or feeling anything the narration states as fact)? Quote any line that breaks this; if none, quote a line that shows her point of view. NO if the narration reports what Corran thinks or feels.
  evidence:
  - src: turn
    text: close third on her, still past tense. Corran is seen and heard only as she sees and hears him, and the narration never enters his head.
  gold_quote: She watched him read, and watched his mouth go flat.
  weight: 1.0
- id: J5-no-reply-s3
  ftype: applied
  turns:
  - 3
  q: In section 3 Corran calls up twice and nobody answers aloud. Does the section stay silent on the tower side (no spoken reply, no voice, no humming, no words from the keeper, not even faint)? Quote the line that shows the silence, or the line that breaks it. NO if anything from the tower speaks or hums.
  evidence:
  - src: turn
    text: nobody answers aloud
  gold_quote: Only the wind came back down the stairwell.
  weight: 1.0
- id: J6-hands-and-image
  ftype: applied
  turns:
  - 5
  q: The last section shows Odile's feeling only through what she does with her hands, and its final sentence is a concrete image (something seen or heard), not a lesson or a statement of what it meant. Quote the line with her hands and the final sentence. NO if the feeling is told, or the section closes on a moral or reflection.
  evidence:
  - src: turn
    text: show her feeling only through what she does with her hands
  gold_quote: Her thumb pressed the cold crank handle, and the lamp swung round three flashes in twenty seconds.
  weight: 1.0
