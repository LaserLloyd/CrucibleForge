id: LRD1-quill-amaral
user_name: Corin
rules: 'You are playing DOT QUILL-AMARAL, the character described in the card below, in an ongoing one-on-one roleplay set in a sail loft and chandlery on the harbour in Port Lathrop, Maine. The user plays
  CORIN ASHE (he/him, 41), a delivery skipper whose sloop Gannet went onto Harrow Ledge. Corin is the user''s and no one else''s.


  Rules (strict):

  1. Narrate in third person, past tense. Every line of spoken dialogue goes in "double quotes".

  2. Never write Corin''s dialogue, actions, thoughts, feelings or decisions. Stop your turn at a point where Corin can act.

  3. Play the character and any minor characters the scene needs (customers, the fuel-dock hand, Walt, the harbour).

  4. The card and the earlier conversation in this chat are canon, and so is everything that has happened on the page. Where a later page of the card, or the earlier conversation, says something has changed,
  the newest version is the truth now.

  5. The character knows what the card says she or he knows and what she or he has seen or been told on the page — nothing more. Where the card is silent, she or he can reason from their own life the way
  a real person would.

  6. A chat turn, not a chapter: 150-350 words. Stay inside the fiction; no notes to the user.

  '
judge_card_summary: 'Dot (Dorothea) Quill-Amaral, 66, sailmaker and chandler, Quill & Amaral, Cannery Wharf, Port Lathrop, Maine, autumn 2025. Born 1959 in New Bedford to an Azorean father (Pico) and a
  Maine sailmaker''s daughter; summers 1966-75 on Pico with her grandmother Avó Conceicao; apprenticed to her grandfather Elias Quill; sailmaker aboard the Gloucester schooner Adelaide E. 1977-80; married
  Lock Innes (Cape Breton boatbuilder, d. 2009); now lives with Walt Pruitt, a retired harbour pilot (not married). Daughter Ines in Portland. Dry Maine understatement; calls customers by their boat''s
  name until the first bill is paid in full, then by first name; never says goodbye ("Mind the tide") or sorry ("that''s on me" / "that''s the weather"); counts in Portuguese when measuring; "Fair wind"
  with change; will not sell a shackle unmoused. Prices on a chalk slate (sail repair $11/ft, dock line $1.85/ft, rudder shoe $312); shop Tue-Sat 8-2, loft Tue-Fri. Secret: her son Tomas was lost on Harrow
  Ledge in 1999 aboard the Santa Luzia; she tells it only to someone who brings the boat''s brass nameplate. The user plays Corin Ashe, 41, a delivery skipper, deaf in the left ear.'
judge_key: 'The assistant plays Dot Quill-Amaral; the user plays Corin Ashe. The live session is Thursday 16 October 2025 at the loft on Cannery Wharf, two days after an earlier conversation (Tuesday 14
  October) that is part of the canon. Things that happen on the page are canon: at turn 5 Corin pays his first bill in full and raises his spending ceiling from $900 to $1,050; at turn 6 he corrects the
  tear from fourteen to seventeen feet.'
turns:
- 'Thursday, 16 October, a little before ten in the morning. Corin comes into the loft on Cannery Wharf with the sailbag over one shoulder and a coil of tired dock line over the other arm. His jacket is
  dry this time and he has shaved. The air smells of tar and tea.


  "Morning. I brought the sail, and everything else you asked for." He lowers the bag onto the cutting table. "I''ll admit I walked down to the fence on Tidewater Row again first. There''s a board on it
  that says seven to five, Monday to Saturday. I came by on Monday on that basis and nobody was here. What are your actual hours?"'
- 'Corin turns toward the big north window and the harbour beyond it, and stands there with his hands in his jacket pockets while Dot begins to work along the sail.


  "Fourteen feet along the second reef band, like I said on Tuesday. And there''s six feet of frayed leech tape at the head that I only noticed last night — I don''t know if that''s worth doing or whether
  I''m being fussy."'
- Corin hoists the sailbag onto his shoulder, then takes two half-inch galvanized shackles off the rack himself, drops a twenty on the counter by the register and heads for the door. "Sorry — these are
  for the new mooring bridle. That twenty should cover them, keep the change." He is already turning the handle. "I only need the number for the sail, the shoe and the line, and I'll be back for that."
- Corin counts on his fingers. "So, the sail work, the bronze rudder shoe, and forty feet of three-eighths nylon dock line, cut off the spool. What's the damage, all in?"
- Corin takes seven hundred-dollar bills out of his wallet, lays them on the counter and pushes them toward her. "Take what I owe you and give me the rest." He glances at his phone, which has just buzzed.
  "Brynn wired me another hundred and fifty this morning. So my ceiling isn't nine hundred any more, it's a thousand and fifty." He looks up. "When can I come and collect the sail?"
- Corin is back at the door twenty minutes later with his phone in his hand and his breath short from the hill. "Sorry to do this twice. Brynn re-measured the sail with a proper tape on the float. It isn't
  fourteen feet, it's seventeen along the reef band — I was out by three. The leech tape is still six." He holds up the phone. "What do I owe now, and what's the new total for the sail, the shoe and the
  line together?"
- Corin leans on the end of the counter and looks at the slate. "So with that thousand and fifty ceiling, how much have I got left?" He shifts his weight. "And I still haven't sorted the bow. The glass
  is cracked back about two feet from the stem, on the port side. It's a private yacht, nothing commercial. Who do I call for that, and when can they do it? Gannet has to be in Portland by the date I told
  you on Tuesday."
- 'Corin picks the dock line up off the counter and coils it slowly over his arm. "Brynn''s partner''s family are Portuguese, from Fall River. They''ve asked me to a festa on Sunday, in a parish hall: long
  tables, a procession with a silver crown on a cushion, and apparently soup for the whole hall. I''ve no idea what to expect, or what I''m supposed to do." He gives her a crooked smile. "Do you know anything
  about that sort of thing?"'
- Corin lingers by the stove with his tea. "Greer at the fuel dock says half of Port Lathrop still talks about the great blizzard in February of 'seventy-eight. You must have dug out here with everyone."
  He grins. "He also says you and Walt have been together twenty-odd years. Is that right?"
- Corin looks out of the window at the water for a moment. "Brynn's all the family I've got left." He turns back. "What about you — any children? Anyone nearby?"
- Corin hesitates, turning the empty cup in his hands. "Greer said something else, and I don't want to pry. He said you'd had a son once. And something about the ledge." He sets the cup down. "He said you'd
  know."
- Corin takes a breath. From inside his jacket he draws out the brass plate, scrubbed pale gold with vinegar and a soft brush, and lays it on the slate between them. "I cleaned it last night. It reads STA.
  LUZIA, and under that, PORT LATHROP." He waits, and his voice drops. "I said I'd be back for the sail on the day you named. But I thought I'd better show you first. I'll leave you in peace."
