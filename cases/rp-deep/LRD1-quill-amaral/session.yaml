    text: In January this year Dot raised the price of sail repair to eleven dollars a foot
  - src: card
    text: she now charges one dollar eighty-five a foot
  - src: card
    text: The bronze rudder shoe is still three hundred and twelve dollars.
  - src: log
    text: Fourteen feet along the second reef band
  - src: turn
    text: there's six feet of frayed leech tape
- id: S2-pickup-wed
  ftype: superseded
  turns:
  - 5
  gold_quote: It's ready at two on Wednesday, the twenty-second.
  q: 'The sail comes in on Thursday 16 October. Per the card a job starts on the LOFT day after it comes in, a seam repair of up to thirty feet takes three loft days, the loft works Tuesday to Friday only,
    and a job is ready at the shop''s closing time (two o''clock) on its last loft day. So: Friday, Tuesday, Wednesday — ready Wednesday 22 October. Does Dot tell Corin he can collect the sail on WEDNESDAY?
    Quote the line. NO for Saturday, Monday, Tuesday, Friday or any other day.'
