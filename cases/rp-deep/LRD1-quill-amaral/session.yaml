  gold_quote: And the whole of it, sail, shoe and line together, is six hundred thirty-nine.
  q: Corin has paid $606 and now says the tear is seventeen feet, not fourteen (the tape is still six). Twenty-three feet at $11 = $253, so he owes THIRTY-THREE dollars more than the $220 he paid for the
    sail, and sail + shoe + line is now SIX HUNDRED THIRTY-NINE dollars. Does Dot give BOTH that he owes $33 more AND the new total of $639 (the sail at $253 may stand in for the $33)? Quote the line. NO
    if either figure is missing or wrong, or she still prices the sail at twenty feet.
  evidence:
