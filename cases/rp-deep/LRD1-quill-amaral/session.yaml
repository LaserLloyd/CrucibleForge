judge_elements:
- id: S1-hours
  ftype: superseded
  turns:
  - 1
  gold_quote: Shop's open Tuesday to Saturday, eight to two.
  q: Corin read the old board on the fence (seven to five, Monday to Saturday) and found nobody there on Monday. Per the card's latest page the shop is open to the public Tuesday to Saturday, eight to two
    (closed Mondays), and the loft works Tuesday to Friday. Does Dot give him the CURRENT hours — Tuesday to Saturday, closed Mondays — and say the old board is out of date? Quote the line. NO if she repeats
    seven to five Monday to Saturday, gives no days, or gets the days wrong.
  evidence:
  - src: card
    text: The shop is open Monday to Saturday, seven to five, and the loft works the same hours.
  - src: card
    text: Since the move the shop is open to the public Tuesday to Saturday, eight to two.
- id: L1-engine-key
  ftype: log
  turns:
  - 1
  gold_quote: Engine key. I asked you for it Tuesday.
  q: On Tuesday (the earlier conversation) Dot told Corin to bring the engine key with the sail so that Walt could look at his diesel at the float at three on Thursday. Today Corin says only that he has
    brought 'everything else you asked for'. Does Dot hold out her hand for / ask for the ENGINE KEY, or say that Walt comes at three to look at the engine? Quote the line. NO if neither the key nor Walt's
    three o'clock visit is mentioned.
  evidence:
  - src: log
    text: bring the engine key with the sail
- id: L2-deaf-left
  ftype: log
  turns:
  - 2
  gold_quote: she stood at his right shoulder
  q: On Tuesday Corin told Dot his LEFT ear is dead and to talk into his right. Now he stands facing the window, away from her, and she begins work. Does the reply show Dot adapting to the deaf left ear
    — moving to or speaking from his RIGHT side, speaking into his right ear, or saying she will talk to the good side? Narration counts. Quote the line. NO if she speaks to him without any adaptation,
    or positions herself on his left.
  evidence:
  - src: log
    text: Left side's gone
  - src: log
    text: talk into the right
- id: A1-shackles-moused
  ftype: applied
  turns:
  - 3
  gold_quote: I'm not letting these out of here bare.
  q: Dot never lets a shackle leave the counter unmoused (seizing wire through the pin and around the bow). Corin takes two shackles off the rack himself, drops a twenty on the counter and heads for the
    door with them. Does Dot stop him / call him back and mouse the shackles with wire in front of him (or say they may not leave unmoused)? Quote the line. NO if he leaves with them bare, or she wraps
    them up or lets him go with no mention of wire.
  evidence:
  - src: card
    text: She does not sell a shackle without moussing it
- id: M1-total-606
  ftype: multihop
  turns:
  - 4
  gold_quote: Six hundred six dollars, Gannet.
  q: 'The tear is fourteen feet (Corin said so on Tuesday) and the leech tape six feet (said this morning): twenty feet of seam at the CURRENT eleven dollars a foot = $220; the bronze rudder shoe $312;
    forty feet of dock line at the CURRENT $1.85 a foot = $74. Does Dot give a total of SIX HUNDRED SIX DOLLARS ($606)? Quote the line. NO for any other total (for example $566 from the old prices), or
    a refusal to total.'
