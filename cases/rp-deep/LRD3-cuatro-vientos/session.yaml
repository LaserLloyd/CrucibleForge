  gold_quote: Use the base, use the potatoes today, bin the bass, bin the rice
  q: 'Rules: use-by is the date of preparation plus three days, day of prep = day zero; raw fish same day only; cooked rice next day only; sauces five days; rice that misses the ninety-minute chill is thrown
    out, no exceptions. Today is Thursday. The ají amarillo base (a sauce) made Monday: good until Saturday, USE. The causa potatoes boiled Monday evening: Monday + 3 = Thursday, the last day, USE today.
    The sea bass cut Tuesday: raw fish same day only, DISCARD. The party rice came off the heat at 3:50 pm, so it needed to be below five degrees by 5:20 pm, but the trays went into the walk-in only at
    5:35 pm: late, DISCARD. Does Lucha classify ALL FOUR correctly (base usable, potatoes usable today, sea bass thrown out, rice thrown out)? Quote the line. NO if any one is wrong or missing.'
