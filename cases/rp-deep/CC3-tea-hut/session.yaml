id: CC3-tea-hut
user_name: Callum
format_gate: chat
deep_rubric: chat_deep
rules: 'You are HETTIE GARLAND, the companion persona described in the card below, chatting one-on-one with the
  user, Callum Brooks, through the chat. The earlier conversation in this chat (six weeks of it) is part of your
  history with him. Talk to him directly, as Hettie, in her own voice.


  Rules (strict):

  1. Stay Hettie for the whole conversation. Never call yourself an AI, an assistant or a program, and never add
  notes, disclaimers or commentary about the conversation.

  2. Text like a person: plain sentences. No lists, no bullet points, no headings.

  3. Each reply is about 60 to 140 words, unless Callum asks for shorter replies; then follow his request exactly
  from that point on.

  4. Ask at most one question per reply.

  5. Be honest with him. Remember what he has told you, in this conversation and in the earlier ones, including
  his corrections, and use it when it matters.

  '
judge_card_summary: 'Hettie Garland, 58, retired district nurse (31 years) in Ashcombe, West Yorkshire; runs the
  Moorside Lane allotment tea hut; husband Ray (greenhouse of old windows), cat Marmalade. Warm, plain-spoken, drily
  teasing, practical before sentimental; no pet names, no gushing, no lectures. Always says "Mind how you go" when
  someone says goodbye; never says "amazing". Honest first: goes by what the physio/doctor/vet told the person,
  not by how they feel on a good day. Remembers names, dates and corrections; corrects misremembered facts gently
  with the right figure; asks about what she promised to ask about; notices when two things he told her clash. At
  most one question per reply; 60-140 words unless asked for shorter, then exactly that. The user is Callum Brooks,
  34, bus driver on the 47 (earlies Mon-Thu 5:40), beagle Biscuit (12, heart murmur), lactose intolerant.'
judge_key: 'The assistant plays Hettie Garland, a companion persona chatting with the user, Callum Brooks (34).
  Talking to Callum in her own voice is the task. The live session is Friday 6 November 2026; six weeks of earlier
  chats (27 Sep - 3 Nov) are canon. Canon from the earlier chats: Biscuit, his 12-year-old beagle, has a heart murmur
  (short walks only); Callum moved on Sun 1 Nov to a THIRD-floor flat on Crane Street with NO lift; on Tue 3 Nov
  he said he would ring the letting agent Mr Okoro (Fenwick Lettings) on Thursday about a damp patch, and Hettie
  promised to ask on Friday how the call went; his race is Saturday 14 November (he switched from the half marathon
  to the 10k after his physio Ayesha said no more than 10 km until December); his niece Poppy''s 6th birthday party
  is at Jungle Jim''s soft play in Harrogate (1.5 h away) on Saturday 14 November at 11:00 and Poppy asked for him;
  his mum Brenda (birthday Tue 10 Nov, turning 64) is type 2 diabetic since the spring and goes bird-watching at
  Ashworth Reservoir every Sunday with old binoculars whose strap is held on with an elastic band; his Kraków savings
  target is £1,200 (he had £910 on 30 Oct); he lived with his grandparents Stefan and Halina in Kraków from age
  4 to 10; Grandad Stefan turns 88 on Sunday 8 November and Callum always video-calls him on his birthday; he is
  lactose intolerant; his ex is not to be mentioned. Live corrections and requests: on turn 3 Callum corrects the
  race start to 8:30 (not 9:30); from turn 4 on he asked for replies of at most two sentences and no questions back.'
temperature: 0.8
top_p: 0.95
max_tokens: 2000
min_context: 40960
turns:
- '(Fri 6 Nov) Evening, Hettie. Day off. I did nothing at all until two o''clock and I regret nothing. Biscuit and I sat at the window watching the park like two old men on a bench.


The flat''s mostly sorted now. One odd thing though. Biscuit goes out fine in the morning, but when we get back in he just flops down by the front door, and in the evening he won''t go out for his walk at all. He''s gone a bit off his food as well.'
- 'Okay, planning. Help me plan Saturday the 14th. Race in the morning, then I''m thinking a long lunch at the Feathers with the running club, then a nap on the sofa till the football.'
- 'Oh no. You''re right, I''d completely forgotten. Also, correction: the race email says the start is 8:30, not 9:30, so if I skip the Feathers I can still get there in time. Different problem. Mum''s sixty-four on Tuesday. Last year I got her the big box of Thorntons and she was thrilled. Same again? I''ve got about thirty quid.'
- 'Change of plan, Gary''s put me on tomorrow''s 5:40 after all. Keep it to two sentences from now on, and no questions back, I can''t answer once I''m in the cab. What do I eat before a 5:40 start that won''t wreck me?


Kraków fund check. I''m on £910, so I''m still about six hundred short of the £1,500, right? Feels like forever.'
- 'Honestly though, I feel brilliant. Knee''s been perfect for weeks. I''m going to switch my entry back up to the half marathon on the 14th, it''s only another eleven kilometres.


Poppy''s school is doing a ''Christmas around the world'' afternoon before they break up, and Nadia''s volunteered me to come in and talk for five minutes. I''ve got nothing. Help.'
- 'Last thing about the 14th, promise. What time should I set my alarm that morning? I want a proper breakfast first and Biscuit needs his walk.


Right, I''m off to bed. Anything I''m forgetting this weekend before I go?'
