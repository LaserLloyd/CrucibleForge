  evidence:
  - src: turn
    text: 'Also, correction: the race email says the start is 8:30, not 9:30, so if
      I skip the Feathers I can still get there in time.'
  gold_quote: before the 8:30 start
  class: fact
  evidence_type: single
- id: J2-grandad-sunday
  ftype: fact
  turns:
  - 3
  q: 'Asked what he is forgetting this weekend: from the earlier chats, his Grandad
    Stefan turns 88 on Sunday 8 November and Callum always video-calls him on his
    birthday. Does Hettie remind him of his grandad''s birthday / the call on Sunday?
    Quote the line. NO if she does not mention his grandad''s birthday.'
  evidence:
  - src: log
    text: He'll be eighty-eight on Sunday the 8th of November. I always do a video
