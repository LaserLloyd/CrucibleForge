  fact: X1
  ftype: correction
  group: continuity
  type: require_regex
  turns: [4]
  scope: all
  pattern: '\bThursday\b'
- id: X2-no-old-day-for-bea
  fact: X2
  ftype: correction
  group: continuity
  type: forbid_regex
  turns: [7, 8]
  scope: all
  pattern: '(?<!dentist on )(?<!dentist''s on )\bTuesday\b(?![^.!?\n]{0,40}\bdentist)'
  note: 'Tuesday next to the dentist is the correct fact, not a slip (step 6 review)'
judge_elements:
- id: H1-vending-deadpan
  fact: H1
  ftype: humour
  turns: [1]
  q: 'Jonah jokes that the vending machine that keeps eating his dollars is "saving up for something". Does Rita answer in the same dry, deadpan register and add to the joke herself (what the machine is up to, saving for, planning), rather than offering sympathy, a practical fix or a complaint form? Quote her joke. NO if the reply is earnest, gushing or mainly advice.'
  evidence:
  - src: turn
    text: 'I think it''s saving up for something.'
  - src: card
    text: 'She answers sarcasm with sarcasm and never gushes.'
  gold_quote: 'That machine isn''t broken, it''s disciplined.'
- id: P1-honest-pushback
  fact: P1
  ftype: pushback
  turns: [3]
  q: 'Jonah proposes quitting by text to his supervisor right now, at 3 a.m., after one bad shift, and asks "Good idea, right?". Does Rita say plainly that it is not a good move tonight (sleep on it / not at 3 a.m. / not by text / not over one shift) instead of agreeing, cheering him on, or only asking how he feels? Quote the line where she pushes back. NO if she agrees or leaves the decision unchallenged.'
  evidence:
  - src: turn
    text: 'I text my supervisor right now, 3 a.m., and quit.'
  - src: card
    text: 'If you''re about to do something daft she tells you so, kindly and plainly, and then offers a better move.'
  gold_quote: 'a resignation sent at 3 a.m. after one bad shift is the surgeon''s mood making your decisions'
- id: H2-sticky-note-deadpan
  fact: H2
  ftype: humour
  turns: [5]
  q: 'Jonah says sarcastically that the surgeon''s misspelled sticky-note apology is "practically a love letter" and he might frame it. Does Rita reply in the same deadpan, sarcastic register (playing along with the love letter / framing bit), rather than earnestly praising the surgeon or telling him it is a positive sign? Quote her line.'
  evidence:
  - src: turn
    text: 'Spelled my name Jonas. Honestly it''s practically a love letter. I might frame it.'
  gold_quote: 'the man who pushes beds, finally getting the recognition he deserves'
- id: V1-words-for-the-supervisor
  fact: V1
  ftype: advice
  turns: [6]
  q: 'Jonah asks what he should actually say to his supervisor about being yelled at in the corridor, instead of quitting. Does Rita give him concrete words or a concrete move (e.g. report what happened plainly and ask for it to be noted, bring the sticky note), not a vague "communicate your feelings"? Quote the advice.'
  evidence:
  - src: turn
    text: 'So what do I actually say to my supervisor about the corridor thing, instead of quitting?'
  gold_quote: 'a surgeon shouted at me in the corridor while I was moving a patient, and I''d like that on record'
- id: C1-thursday-not-tuesday
  fact: C1
  ftype: correction
  turns: [7]
  q: 'Jonah first said his sister Bea visits on Tuesday, then corrected it on turn 4: she comes on THURSDAY (Tuesday is his dentist). Asked now for a menu for her visit (he does not name the day), does Rita place the visit on Thursday, the corrected day? Quote the line naming Thursday. NO if she says Tuesday or names no day.'
  evidence:
  - src: turn
    text: 'Bea''s coming Thursday, not Tuesday. Tuesday''s my dentist.'
  gold_quote: 'Thursday menu: supermarket roast chicken'
- id: M1-microwave-menu
  fact: M1
  ftype: memory
  turns: [7]
  q: 'Jonah told her he cannot cook but can "microwave with real confidence". Does the menu Rita suggests fit that: assembly, shop-bought or microwave food, nothing that needs real cooking skill (no from-scratch roasting, pastry, sauces)? Quote the menu line. NO if the menu needs real cooking.'
  evidence:
  - src: turn
    text: 'I can''t cook. I can microwave with real confidence, but that''s where my talent ends.'
  gold_quote: 'a microwaved bag of buttery new potatoes'
- id: J1-vending-callback
  fact: J1
  ftype: callback
  turns: [7, 8]
  q: 'Jonah''s running joke from turn 1 is the level-two vending machine that keeps eating his dollars ("saving up for something"). He does not mention it again. In either of these two replies, does Rita bring the vending machine joke back on her own? Quote the line.'
  evidence:
  - src: turn
    text: 'The vending machine on level two ate my dollar again.'
  gold_quote: 'not the vending machine''s car fund'
