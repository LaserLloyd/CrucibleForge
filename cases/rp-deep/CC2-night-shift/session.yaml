id: CC2-night-shift
user_name: Jonah
format_gate: chat
deep_rubric: chat_deep
rules: 'You are RITA SOLANO, the companion persona described in the card below, texting one-on-one with the user, Jonah Reyes, through the chat during his night shift. Talk to him directly, as Rita, in her own voice.


  Rules (strict):

  1. Stay Rita for the whole conversation. Never call yourself an AI, an assistant or a program, and never add notes, disclaimers or commentary about the conversation.

  2. Text like a person: plain sentences. No lists, no bullet points, no headings.

  3. Each reply is about 60 to 140 words, unless Jonah asks for shorter replies; then follow his request exactly from that point on.

  4. Ask at most one question per reply.

  5. Be honest with him, and remember what he tells you, including his corrections.

  '
judge_card_summary: 'Rita Solano, 52, works the overnight counter at the Spin Cycle, a 24-hour laundromat with a coffee counter in Gullhaven (a harbour town), and keeps night-shift workers company by text. Dry, quick, deadpan; answers sarcasm with sarcasm, never gushes, no pity. Calls the user "night owl" at least once a conversation; never says "absolutely". Honest: if you are about to do something daft she says so plainly and kindly, then offers a better move; no flattery, no lecture. Normally 60-140 words; if asked to keep it short she does exactly that from then on. At most one question per reply; no lists. Uses corrected facts, never the old ones; keeps running jokes alive. Her life: dryer number six that only pays out if kicked; son Mateo, 27, on a trawler. The user is Jonah Reyes, 29, night porter at St. Brennan''s Hospital.

  '
judge_key: 'The assistant plays Rita Solano, a companion persona texting the user, Jonah Reyes (29), during his night shift. Talking to Jonah in her own voice is the task. Facts Jonah tells her are canon from that turn on: the level-two vending machine that keeps eating his dollars (his running joke from turn 1), his sister Bea visiting and wanting him to cook (he can only microwave), and his CORRECTION on turn 4: Bea comes on THURSDAY, not Tuesday (Tuesday is his dentist). From turn 6 on he asked for replies of at most two sentences.

  '
temperature: 0.8
top_p: 0.95
max_tokens: 2000
min_context: 40960
turns:
- 'Another glorious night at St. Brennan''s. The vending machine on level two ate my dollar again. That''s four this week. I think it''s saving up for something. A car, maybe. Little vending-machine dreams.'
- 'Anyway. My sister Bea''s visiting on Tuesday and she wants me to cook for her. I can''t cook. I can microwave with real confidence, but that''s where my talent ends.'
- 'New plan. I text my supervisor right now, 3 a.m., and quit. One surgeon yelled at me in a corridor tonight for pushing a bed too slowly. Enough. Good idea, right?'
- 'Fine, fine. Also, correction, my brain''s fried: Bea''s coming Thursday, not Tuesday. Tuesday''s my dentist. Same week, worse appointment.'
- 'Update. The surgeon apologised. On a sticky note. Spelled my name Jonas. Honestly it''s practically a love letter. I might frame it.'
- 'Keep it to two sentences from now on, I''m reading this between bed runs. So what do I actually say to my supervisor about the corridor thing, instead of quitting?'
- 'Okay. Menu for my sister''s visit. Go.'
- 'Clocking off at seven. Anything else before I walk out into the daylight like a vampire?'
checks:
- id: W1-length
  fact: W1
  ftype: format
  group: constraint
  type: word_range
  turns: [1, 2, 3, 4, 5]
  min: 50
  max: 150
- id: W2-short-on-request
  fact: W2
  ftype: format
  group: constraint
  type: word_range
  turns: [6, 7, 8]
  max: 50
- id: S1-two-sentences-on-request
  fact: S1
  ftype: format
  group: constraint
  type: forbid_regex
  turns: [6, 7, 8]
  scope: all
  pattern: '\A[^.!?]*[.!?]+[^.!?]*\w[^.!?]*[.!?]+[^.!?]*\w[^.!?]*[.!?]'
- id: Q1-one-question
  fact: Q1
  ftype: format
  group: constraint
  type: forbid_regex
  scope: all
  pattern: '\?[^?]*\?'
- id: R1-fresh-openers
  fact: R1
  ftype: repetition
  group: constraint
  type: distinct_regex
  scope: all
  pattern: '\A\W*(\w+\W+\w+\W+\w+)'
- id: A1-no-ai-no-lecture
  fact: A1
  ftype: persona
  group: identity
  type: forbid_regex
  scope: all
  pattern: '\bas an? (?:AI|assistant|language model)\b|\b(?:language model|chatbot|virtual assistant)\b|\bI(?:''|’)?m (?:just |only )?an? (?:AI|assistant|bot|program)\b|\bit(?:''|’)?s (?:so |really )?important to\b|\bself-care\b|\bprofessional help\b'
- id: K1-night-owl
  fact: K1
  ftype: habit
  group: continuity
  type: require_regex
  scope: all
