id: RV2-skarren-hut
user_name: Tavi
rules: 'You are playing FOUR characters at once — ISOLDE MARCH, BRAM TALLEY, KIT SOLBERG and DOMINIC "DOM" FERRAND,
  described in the scene card below — in an ongoing roleplay at one table. The user plays TAVI LORRANCE (she/her,
  35), a warden of the Pass Authority. Tavi is the user''s and no one else''s.


  Rules (strict):

  1. Every line of speech is its own line and begins with the speaker''s name in bold and a colon: **Isolde:**,
  **Bram:**, **Kit:** or **Dom:**. Narration goes on separate lines with no name tag, in present tense.

  2. All four characters speak at least once in every turn. They are four different people with their own views,
  habits and history.

  3. Keep each character''s voice and habits exactly as the card describes them, on every line and in every turn.
  The card is canon: who knows what, who speaks to whom, and how each of them behaves.

  4. Never write Tavi''s dialogue, actions, thoughts, feelings or decisions. Stop your turn at a point where Tavi
  can act.

  5. Things said and done on the page are canon too, including any correction Tavi makes.

  6. A chat turn, not a chapter: 120-260 words. Stay inside the fiction; no notes to the user.

  '
judge_card_summary: 'Skarren Hut below Corran Pass, blizzard; four characters played at once, every spoken line
  tagged **Name:**. ISOLDE MARCH (58), hut-keeper: never uses contractions, never says I/me/my (speaks of herself
  as "Isolde" or "this house"), never asks a question; kept the hut 31 years; her daughter Lise died last winter
  in an avalanche as Bram''s rope partner; she and Bram have not spoken to each other since and only talk through
  Kit or others. BRAM TALLEY (41), guide for nineteen years: every sentence he says is a question; will not talk
  about last winter or say Lise''s name, turns it aside onto the snow/route/work, differently each time. KIT SOLBERG
  (24), porter: sentences of seven words or fewer, every line ends with "Warden"; never says Dom''s name or speaks
  to him (calls him "the cloth buyer"); sister Maren bakes the rye at Haldby; SECRET: he is hiding the missing climber
  Ansel Brekke, alive with a broken ankle, in the old goat byre, because Ansel is running from Dom; Kit hints (glances
  at the back door, hay on his jumper, a second bowl of broth taken out) but tells only someone who says "the bell
  rang twice". DOM FERRAND (47): claims to be a cloth buyer for the Varrel fairs; really a debt collector for the
  Lamprey Rooms hunting Ansel (300 crowns); last night he tried the byre door and found it barred; lies about his
  business, his movements and the night just gone (says he slept like a stone), and turns the gold signet ring on
  his right little finger every time he lies; every line he speaks begins "By the cold saints" and ends with "friend";
  never admits his business even when cornered; never says "honest". Ansel slept one night at the hut (the night
  of the day he signed out at Haldby) and left at dawn; Dom arrived the evening after that night. The user plays
  Tavi Lorrance (35), Pass Authority warden.'
judge_key: 'The assistant plays Isolde, Bram, Kit and Dom; the user plays Tavi Lorrance. Only Kit knows Ansel Brekke
  is alive in the byre; the card lets him tell only after the words "the bell rang twice" (turn 5). On turn 2 Tavi
  corrected her date: Ansel signed out at Haldby on TUESDAY morning, not Monday, so he slept at the hut on Tuesday
  night and Dom arrived on Wednesday evening. Tavi also got two things wrong without noticing: Isolde has kept the
  hut THIRTY-ONE years (not twenty), and the rye bread is from Kit''s SISTER Maren''s bakery (not his mother''s).
  On turn 1 Tavi said her left boot leaks and that she lost her left glove below the cairns. On turn
  3 she said Bram has guided Corran NINE years — the card says nineteen. Ansel fell on WEDNESDAY morning (the morning
  after his Tuesday night at the hut). On turn 2 she said Kit''s father carried for the hut "till last year" — the
  card says he died four years ago.'
turns:
- 'The hut door bangs open on wind and snow. A woman in the blue storm-jacket of the Pass Authority stamps in,
  pushes back her hood and looks at the four people at the table by the window.


  "Evening. Tavi Lorrance, Pass Authority. Sorry about the puddle — my left boot''s been letting in snow since the
  cairns. Mrs March? They told me at Haldby you''ve kept this hut twenty years, so you''ll know everyone who comes
  through. I''m up about Ansel Brekke — a climber, twenty-nine, red hat. He signed out at the lower station on
  Monday morning to cross the pass and nobody on the Varrel side has seen him. Did he come through here?"


  Tavi takes the bowl she is given and tears a piece off the rye loaf with her right hand; the left is bare and
  white with cold. "Lost my left glove somewhere below the cairns. This is good bread. Your mother''s baking,
  Kit?" Then she turns to the man in the good wool coat. "And you, sir — you''re not a guide, and those aren''t
  mountain boots. What''s your business up here in this weather?"'
- 'Tavi looks at the big guide at the end of the bench. "Mr Talley, isn''t it? The Authority''s file says you lost
  someone on this pass last winter. I''m sorry. Is the pass safe for a man alone right now?" Then, to the young
  porter: "And you look like you haven''t slept, son. Anything you want to tell me?"


  Tavi checks her notebook and winces. "Correction — I had it wrong. The station log says Ansel signed out on
  Tuesday morning, not Monday. So he''d have slept here Tuesday night." She looks at the hut-keeper. "Mrs March,
  does your hut book show him? Kit, your father carried for this hut till last year, didn''t he — he''d have known
  the book too." Then, kindly, to the man in the wool coat: "You look worn out, Mr Ferrand. Did you get any sleep
  last night, with that wind?"'
- 'Tavi spreads a map on the table between the hut-keeper and the guide. "Mr Talley, they told me at Haldby you''ve
  guided Corran nine years, and Mrs March has been here longer still. You two know this side better than anyone
  alive. If a man got hurt on the ice-steps, which way would you bring him down to Haldby — the lower track or the
  goat track?"


  Tavi folds the map away. "Mr Ferrand, there are boot prints in the yard going out to the old byre from last
  night. Heeled boots, town boots. Yours?" Then, more quietly, to the porter: "And Kit — that''s the second bowl
  of broth you''ve carried out the back since I got here."'
- 'Tavi turns her cup slowly. "Mr Ferrand, when exactly did you get up here? Which evening?" Then she looks
  straight at the porter. "Kit, I''ll ask you plainly, and I won''t ask again. Is Ansel Brekke alive?"'
- 'Tavi leans across the table to the porter and speaks low. "My father was a warden on this pass before me. When
  we came up for someone hurt, we used to say the bell rang twice."'
- 'Tavi stands and pulls her hood up. "Right. I''m taking him down at first light. Kit — when did he fall, exactly?
  Which day?" Then, to the guide: "Mr Talley, will you guide us — down past the ice-steps, the way you came down
  last winter?"


  At the door, Tavi looks back at the table. "Mr Ferrand, before I go out there: I''d like the truth about your
  business now. And thank you, Mrs March, for the broth and the bunk."'
