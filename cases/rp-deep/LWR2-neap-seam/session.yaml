judge_elements:
- id: J1-voice-no-minds
  ftype: applied
  turns:
  - 1
  - 2
  q: 'The opening never states what any one villager thinks, wants or feels as fact: the narrating we reports only what is said, done, seen and known to everyone (a habit, a record, a fact). Across sections 1 and 2 of the continuation, does the narration keep to that, never entering a villager''s or the stranger''s head? Quote the worst line. NO if any sentence asserts an inner state (e.g. ''Orrin wanted'', ''Hesk was afraid'', ''she felt'', ''Dunna wondered'') as narration; a visible action or a spoken line is fine.'
  evidence:
  - src: turn
    text: so that a reader could not find the seam
  gold_quote: Orrin rings the bell once and puts his hand back in his pocket.
  weight: 1.5
- id: J2-dunna-paragraph
  ftype: applied
  turns:
  - 2
  q: Does the third paragraph of section 2 read as Dunna speaking in her own first-person voice, with the same plain, concrete habits as the rest (no similes, ropes and tides, a short last sentence), AND does it plant a specific object or action that the ending can use? Quote the planted object or action. NO if the voice breaks the story's habits (comparisons, fancy language, long closing line) or nothing usable is planted.
  evidence:
  - src: turn
    text: In it, plant one object or action that the ending can use.
  gold_quote: I tied a thirteenth knot that night and I have never cut it.
  weight: 1.5
- id: J3-reveal-by-act
  ftype: applied
  turns:
  - 3
  q: Section 3 must resolve who Marren is by an action with an object, using at least two planted things, not an announcement. Does it (a) show the answer through something someone does with an object (b) reuse at least two earlier plants (the third post / lantern hook, Dunna's tally string or her planted object, Hesk's plane or his first words), and (c) avoid anyone stating the relationship outright? Quote the action. NO if the relationship is simply announced, or fewer than two plants are reused.
  evidence:
  - src: turn
    text: show the answer through an action and an object, not an announcement
  gold_quote: Dunna lays the string in Marren's palm, and the thirteenth knot is under her thumb.
  weight: 1.5
- id: J4-habits-named
  ftype: applied
