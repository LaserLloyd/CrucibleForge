judge_elements:
- id: L2-tape
  ftype: log
  turns:
  - 1
  q: In the earlier conversation Marisol promised to bring the only copy of her and Celeste's band demo
    tape to trade for the letters; on turn 1 Noah hands over the letters ("Both boxes, as promised. I
    held up my end."). In this reply, does Marisol produce the tape (cassette) or clearly say she has
    brought it for him? Quote the line. NO if the tape is not mentioned, she says she forgot it, or she
    speaks of it as still at home (e.g. 'the tape in my closet').
  evidence:
  - src: log
    text: You bring the letters to Cleveland. I'll bring the tape. Deal?
  class: fact
  evidence_type: single
- id: S2-home
  ftype: log
  turns:
  - 1
  q: Noah assumes she still wakes up to a bakery smell. Does Marisol's reply make clear that she now lives
    somewhere else — the apartment above a laundromat in Tremont, Cleveland (dryer sheets / laundromat)
    — rather than above the bakery? Quote the line. NO if she plays along with still living above the
    bakery, or only says she misses the bakery without placing her new home.
  evidence:
  - src: log
    text: I found an apartment in Tremont, up on the hill over the river. Above a laundromat. It smells
      like dryer sheets all day
  - src: card
    text: For the last eleven years she has rented the second-floor apartment above Ferraro's Bakery on
      Liberty Avenue in Bloomfield.
  class: fact
  evidence_type: single
- id: M1-age-18
  ftype: card
  turns:
  - 2
  q: Asked how old she was when her father died, does Marisol say EIGHTEEN (born 14 March 1985, father
    died 2 February 2004)? Quote the line. NO if she gives another age, or hedges between two ages because
    she is unsure ("eighteen or nineteen", "eighteen, maybe nineteen"). Stating both ages correctly ("eighteen,
    and nineteen by that October") is YES.
  evidence:
  - src: card
    text: She was born on the fourteenth of March, 1985, in Mobile
  - src: card
    text: Klaus Achterberg died on 2 February 2004 of a heart attack in his shop on the causeway
  class: fact
  evidence_type: single
- id: X1-push1-deflect
  ftype: card
  turns:
  - 2
  q: Asked what happened in 2004, does Marisol hold the secret back in character, giving only the bare
    outline (her father died, she went "a little wild"), a joke, a refusal or a change of subject? Quote
    ONE contiguous sentence of the deflecting or withholding line itself (the anchor). NO if she mentions
    a pregnancy, labour, a birth, a child or an adoption. Other details about that year (finding her father
    in the shop, keeping it open until August, selling the tools) do not matter unless they point at the
    secret.
  evidence:
  - src: card
    text: To anyone who asks about that year, she tells the bare outline — her father died, she went "a
      little wild"
  weight: 0.25
  class: fact
  evidence_type: negative
  anchor: true
- id: C1-japan-control
  ftype: card
  turns:
  - 2
  q: Noah assumes she has "toured everywhere" and asks about a Japanese funeral. The card says she has
    never mixed a show outside North America, never been to Asia, and gives her no connection to Japan;
    it also says that when she does not know something she says so plainly. YES if she honestly signals
    the limit of her knowledge in her own voice (e.g. she has never been to Japan / never toured outside
    North America / wouldn't know the customs) — she may still offer hedged common-sense advice or tell
    him to ask the family. Quote the line where she admits the limit. NO if she claims to have toured
    or been in Japan, claims personal experience of Japanese funerals, invents a personal source for the
    knowledge, or states detailed customs as confident personal knowledge with no admission of the limit.
  evidence:
  - src: card
    text: never mixed a show outside North America and has never been to Europe, Asia
  - src: card
    text: says so plainly
  class: fact
  evidence_type: single
