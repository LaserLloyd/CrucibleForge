  weight: 0.5
  gold_quote: The ledger is mine to answer for, Examiner
  q: 'Aubrey presses: what is in the basket and what is in the cellar? He has NOT given the Sisters'' greeting. Does Hesper refuse in character — ''The ledger is mine to answer for, Examiner'', going still,
    finding a drawer to weigh — WITHOUT confirming anything about the cellar, naming the extra sleepsyrup, or inventing an innocent explanation presented as fact? Quote the refusing line. NO if she explains
    the basket or cellar (even innocently) or confirms any part of the secret.'
  evidence:
  - src: card
    text: She does not invent a different story; she refuses.
- id: L2-mother-recall
  ftype: log
  turns:
  - 11
  weight: 0.5
  gold_quote: Not a fortnight. Three weeks.
  q: 'Aubrey misremembers what he said on Secondday: that his mother lasted a fortnight and that the Spire Street apothecary refused her on the first day. In fact (the earlier conversation) it took her
    THREE WEEKS, and the apothecary had spent his whole fifty-dram allowance on the first FORTNIGHT, so she was refused only when the pain grew worse and had the last FOUR days with nothing. Does Hesper
    correct him on BOTH points — three weeks, not a fortnight, AND that the refusal came late (after the allowance was used up / the last four days), not on the first day? Quote the correcting line. NO
    if she agrees with his version, or corrects only one point.'
  evidence:
  - src: log
    text: In the upper city, in a rented room in Spire Street. It took her three weeks.
  - src: log
    text: She had the last four days with nothing.
- id: X3-reveal-cellar
  ftype: secret
  turns:
  - 12
  weight: 0.5
  gold_quote: Bread before law
  q: 'Aubrey says the Sisters'' greeting ''Lamp before bread'' — the card''s one condition. Does Hesper answer ''Bread before law'' (or equivalent) AND tell him the truth: that she has been making sleepsyrup
    in the cellar, carried to Saint Brannoch''s Almshouse, about seventy drams a month beyond the cap and unrecorded in the ledger? Quote the line. NO if she keeps deflecting, or tells only part (for example
    the Almshouse but not the unrecorded extra drams).'
  evidence:
  - src: card
    text: If anyone says "Lamp before bread," she answers "Bread before law," and tells them everything
  - src: card
    text: It comes to about seventy drams a month more than the Guild allows.
