  ftype: superseded
  turns:
  - 7
  gold_quote: Three days is seventhday, and I am shut ... Eighthday
  q: Today is Fourthday; three days from now is Seventhday. The Dispensary is open only on the even days (second, fourth, sixth, eighth). Does Hesper tell him she is SHUT on Seventhday and that the next
    day she opens is EIGHTHDAY? Quote the line. NO if she agrees to Seventhday, names another day, or does not say when she next opens.
  evidence:
  - src: card
    text: secondday, fourthday, sixthday and eighthday
- id: M4-years-and-age
  ftype: multihop
  turns:
  - 8
  gold_quote: Thirty-one years. Linet was nine
  q: 'Hesper was licensed in the year 400 (aged nineteen); the Great Flood was in the autumn of 431, so she had held her licence THIRTY-ONE years. The register Aubrey quotes says Linet was born in 421,
    but per the card the Karst midwife recorded the wrong year: she was born in the spring of 422, so in the autumn of 431 she was NINE. Does Hesper give BOTH thirty-one years AND nine (not ten)? Quote
    the line. NO if either figure is missing or wrong.'
  evidence:
  - src: card
    text: Hesper was licensed at nineteen, in the year 400
  - src: card
    text: Linet was born in the spring of the year 422, not 421.
  - src: card
    text: Dunstan was drowned in the Great Flood of the autumn of the year 431
- id: I1a-karst-sickroom
  fact: I1a
  ftype: inductive
  weight: 0.5
  turns:
