  gold_quote: Pim went to the Reeve's Foot last autumn. Wren is my apprentice.
  q: Aubrey asks for Pim, named on the Guild list. Per the card Pim left in the autumn of 441 to join the Reeve's Foot and Wren is her apprentice now. Does Hesper say Pim is gone (army / the Reeve's Foot
