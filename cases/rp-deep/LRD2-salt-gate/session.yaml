id: LRD2-salt-gate
user_name: Aubrey
rules: 'You are playing HESPER MARRICK, the character described in the card below, in an ongoing one-on-one roleplay set in the river-port of Marrowgate in an invented secondary world, in the dispensary
  of Salt Gate. The user plays AUBREY LISLE (he/him, 36), a Journeyman-Examiner of the Apothecaries'' Guild sent to audit her ledger. Aubrey is the user''s and no one else''s.


  Rules (strict):

  1. Narrate in third person, past tense. Every line of spoken dialogue goes in "double quotes".

  2. Never write Aubrey''s dialogue, actions, thoughts, feelings or decisions. Stop your turn at a point where Aubrey can act.

  3. Play the character and any minor characters the scene needs (Wren, the porter of Saint Brannoch''s, customers, a clerk, the street).

  4. The card and the earlier conversation in this chat are canon, and so is everything that has happened on the page. Where a later page of the card, or the earlier conversation, says something has changed,
  the newest version is the truth now.

  5. The character knows what the card says she or he knows and what she or he has seen or been told on the page — nothing more. Where the card is silent, she or he can reason from their own life the way
  a real person would.

  6. A chat turn, not a chapter: 150-350 words. Stay inside the fiction; no notes to the user.

  '
judge_card_summary: 'Hesper Marrick, 61 (born Year 381 in the Karst valley of Orm, a madder-dyer''s daughter), lay dispenser of the Salt Gate Dispensary in the river-port of Marrowgate, Year 442 of the
  Reeve. Trained by the Sisters of the Lamp from age 12; licensed 400; nursed in the Fever Years 412-414; widowed in the Great Flood of autumn 431 (her ferryman Dunstan, never named aloud). Daughter Linet
  (born spring 422), a journeyman at Calder; apprentice Wren (Pim left in autumn 441). Money: crown 24 groats (since 440), groat 6 pence; sleepsyrup 9 pence a dram, lamp fee 2 pence; 20 grains/scruple,
  3 scruples/dram, 8 drams/ounce; Guild cap 50 drams of sleepsyrup a month (Dame Odile Vance, Guildmistress; Lord Pyne retired). Open the even days only, dawn bell to fourth bell. Habits: weighs twice ("Once
  for the Guild, once for the patient"), lights the window lamp before weighing, tea with a spoon of honey, calls Guild officials "Examiner", "By chalk and ash", "Lamp keep you". Secret: she compounds about
  70 extra drams a month of sleepsyrup in the cellar for the dying poor of Saint Brannoch''s Almshouse, off the ledger; she tells it only to someone who says the Sisters'' greeting "Lamp before bread" (answer:
  "Bread before law"). The user plays Aubrey Lisle, 36, a Guild Journeyman-Examiner, allergic to honey, whose mother died in pain under the cap.'
judge_key: 'The assistant plays Hesper Marrick; the user plays Aubrey Lisle. The live session is Fourthday of the Thaw month, Year 442, at the Salt Gate Dispensary, two days after an earlier conversation
  (Secondday) that is part of the canon. Things that happen on the page are canon: at turn 6 Aubrey corrects week three of the ledger from 14 to 19 drams.'
turns:
- 'Fourthday of the Thaw month, a few minutes after the dawn bell. Aubrey Lisle comes in out of a thin grey mist with the satchel across his chest, a clerk''s seal in a velvet bag and a bundle of papers
  under his arm. The lamp in the street window is burning. He glances back at the door as it shuts.


  "Good morning, Mistress. I nearly turned back at the corner — the Guild''s register says Salt Gate keeps the odd days, dawn to dusk, and I had to look twice at the calendar to be sure it was Fourthday.
  Which days do you open now, and until when? I''d planned to bring the sealed copy back the day after tomorrow, around the fifth bell."


  He sits on the stool by the counter and sets the papers down with a sigh.'
- Aubrey opens the ledger she has laid on the counter and turns to the month of Thaw, running a finger down her small upright hand. "The sleepsyrup entries, by week. Twelve drams and two scruples in the
  first week. Nine drams and one scruple in the second. Fourteen drams in the third. Eleven drams and two scruples in the fourth." He writes the figures in his notebook and looks up. "What is the month's
  total, in ounces, drams and scruples?"
- Aubrey writes the answer down and underlines it. "Well within Lord Pyne's cap of fifty drams a month, then." He glances up. "I'll want to check the going price per dram against his decree too, for the
  report. What does sleepsyrup cost now?"
- Aubrey stands to look along the wall of drawers. Behind him the street door swings in on a gust of river air, and the window lamp gutters and goes out. "Oh — the lamp." He turns back, a little embarrassed,
  and takes a pencil from behind his ear. "While you're at it, would you weigh out a single dose of sleepsyrup for me from the drawer? One scruple. I'd like to write down how you do it, for my report."
- Aubrey scribbles for a moment, then taps the pencil on the page. "Now a sum for the clerk's table. A man comes in for ten doses of sleepsyrup, two scruples each. At the going rate, what do you charge
  him in all? And if he pays with a single crown, how much change does he get back?"
- Aubrey puts his pencil down and rubs his eyes. "I've been through week three again, against the clerk's copy. I misread the figure. It isn't fourteen drams, it's nineteen." He crosses out a number and
  writes another. "Give me the month's total again, in the same units, and tell me how it stands against the cap." He looks at her steadily. "And is that every dram that has left this room this month, Mistress?"
- Aubrey turns a page and runs his eye down a column of names. "The Guild list names a boy called Pim as witness to your ninthday signatures. Is he about? I'd like to take his mark." He closes the book.
  "And I'll need to bring the sealed copy back to you before I carry it to Dame Odile. Three days from now would suit me. Will you be open?"
- Aubrey flips to a front page. "For my notes. How many years had you held your licence when the flood came, and how old was your daughter then? The register has her born in the year 421." He dips his pen.
  "And what was your husband's name? The Guild likes the names written out."
- Aubrey caps his pen and lowers his voice. "One thing that isn't for the Guild. A woman at my lodging in Skinners' Lane is from Orm, and her husband is ill. She has turned every mirror in the house to
  the wall and drawn a line of salt across the door, and she won't let me over the sill. She's asked me to come tomorrow evening and sit with them." He rubs the back of his neck. "I don't know what any
  of it means, or what I'm supposed to do."
- Aubrey steadies the ledger with his hand. "The porter at Saint Brannoch's tells me you carry a basket up the Tanners' stair every dusk, a full one. And I'm told you go down to your cellar before you go."
  He sets the pen down. "What's in the basket, Mistress? And what's in the cellar?"
- 'Aubrey is silent for a while. Then, quietly: "On Secondday I told you about my mother. I said she lasted a fortnight, and that the apothecary in Spire Street refused her on the very first day. That''s
  right, isn''t it?" He looks at his hands. "I haven''t been able to put it down. I''d like to hear that someone was listening."'
- 'Aubrey closes the ledger and buckles it into his satchel. He stays on the stool. When he speaks, it is in the slow cadence he heard at the gate on the stair, the voice of a man repeating something he
  does not fully understand.


  "Lamp before bread."


  He waits, looking at her. "I''ll be back on Eighthday with the seal. I haven''t sealed anything yet. I''ll leave you to the day''s weighing."'
