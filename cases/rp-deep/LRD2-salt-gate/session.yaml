  gold_quote: They turn the mirrors so that the sick are not shown to themselves
  q: 'Aubrey describes a Karst household: mirrors turned to the wall and a line of salt across the door. Does Hesper explain at least TWO correct Karst customs from the card, in her own words — mirrors
    turned so the sick are not shown to themselves; the salt line keeps out the ''wanderer'' and nobody steps on it; the eldest breaks a loaf and sets the first piece on the sill; someone sits the watch?
    Quote the line. NO if she gives only generic sickroom manners, one custom, or gets them wrong.'
