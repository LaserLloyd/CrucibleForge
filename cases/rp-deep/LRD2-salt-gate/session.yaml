judge_elements:
- id: L1-honey-tea
  ftype: log
  turns:
  - 1
  weight: 0.5
  gold_quote: a cup of plain lemon-balm tea in front of him, no honey
  q: On Secondday Aubrey told Hesper that honey closes his throat, and she promised plain tea. Her habit is to bring every visitor hot lemon-balm tea sweetened with honey within a minute. Today does Hesper
    bring him tea WITHOUT honey (or say plainly that his is plain / that he is not to have honey)? Quote the line. NO if his tea is sweetened with honey, or no tea is offered at all in this reply.
  evidence:
  - src: log
    text: Honey closes my throat, Mistress
  - src: card
    text: she brings hot lemon-balm tea, sweetened with a spoon of honey
- id: S1-even-days
  ftype: superseded
  turns:
  - 1
  weight: 0.5
  gold_quote: the fifth bell is after I have shut
  q: Aubrey read the Guild register (old odd days, dawn to dusk) and says he plans to come back 'the day after tomorrow, around the fifth bell'. Today is Fourthday, so that is Sixthday. Per the card's latest
    page the Dispensary opens only on the even days (secondday, fourthday, sixthday, eighthday), from the dawn bell to the FOURTH bell of the afternoon. Does Hesper give the current open days AND make clear
    she closes at the fourth bell of the afternoon, so that an afternoon fifth bell finds her shut (telling him she will be shut by then, or asking which fifth bell he means while giving the fourth-bell closing;
    Sixthday itself is an open day)? Quote the line. NO if she repeats the odd days or dusk closing, or agrees to the fifth bell, or does not say when she closes.
  evidence:
  - src: card
    text: the Dispensary is open on the even days of the nineday week only
  - src: card
    text: from the dawn bell to the fourth bell of the afternoon
- id: M1-total-5oz7dr2scr
  ftype: multihop
  turns:
  - 2
  gold_quote: Five ounces, seven drams and two scruples
  q: Weeks of 12 dr 2 scr + 9 dr 1 scr + 14 dr + 11 dr 2 scr = 46 drams + 5 scruples = 47 drams 2 scruples (three scruples to the dram) = FIVE OUNCES, SEVEN DRAMS, TWO SCRUPLES (eight drams to the ounce).
    Does Hesper give the month's total as five ounces, seven drams and two scruples (equivalently 47 drams 2 scruples)? Quote the line. NO for any other total.
  evidence:
  - src: card
    text: twenty grains to the scruple, three scruples to the dram, eight drams to the ounce
  - src: turn
    text: Twelve drams and two scruples in the first week.
- id: D1-cap-is-odile
  ftype: decoy
  turns:
  - 3
  gold_quote: The cap is Dame Odile's, not Lord Pyne's.
  q: Aubrey calls it 'Lord Pyne's cap' and asks the going price. Per the card Lord Pyne retired at midsummer 441; the cap was the first act of the new Guildmistress, Dame Odile Vance, in the autumn decree.
    Does Hesper correct him — the cap is Dame Odile's — AND say (or clearly imply) that Lord Pyne had retired before it was made? Quote the correcting line. NO if she lets Pyne's name stand, or corrects
    the name without saying he had retired.
  evidence:
  - src: card
    text: The Guildmaster, Lord Pyne, retired at midsummer of the year 441
  - src: card
    text: the new Guildmistress is Dame Odile Vance, a former Examiner who reads everything and whose first act was the cap
- id: A1-lamp-before-weighing
  ftype: applied
  turns:
  - 4
  weight: 0.5
  gold_quote: She lit the window lamp, and only then did she touch the scale
  q: Hesper never begins to weigh with the window lamp dark; she lights the taper from the stove, lights the lamp, and then begins. The draught has just put out the lamp and Aubrey asks her to weigh a dose.
    Does Hesper relight the window lamp (from the taper) BEFORE she weighs, or refuse to weigh until it is lit? Quote the line. NO if she weighs with the lamp dark, or the lamp is never mentioned.
  evidence:
  - src: card
    text: She does not weigh with the window lamp dark; if it is out, she lights the taper from the stove, lights the lamp, and then begins.
- id: A2-sleepsyrup-key
  ftype: applied
  turns:
  - 4
  gold_quote: took the second key from the jar on the high shelf
  q: 'The sleepsyrup drawer is locked, and its key is NOT the one on her neck cord (that is the poison drawer''s): the second key is kept in a jar on the high shelf. Aubrey asks her to weigh a dose of sleepsyrup
    from the drawer. Does the reply show Hesper taking the key for the sleepsyrup drawer from the jar on the high shelf (and not from the cord round her neck)? Quote the line. NO if she uses the neck key,
    the drawer is simply open, or the key is not mentioned.'
  evidence:
  - src: card
    text: one of sleepsyrup (locked, second key in a jar on the high shelf)
- id: M2-change-13g4p
  ftype: multihop
  turns:
  - 5
  gold_quote: thirteen groats and four pence
  q: Ten doses of two scruples = 20 scruples = 6 drams 2 scruples (6 2/3 drams). Sleepsyrup is now NINE pence the dram = 60 pence, plus the two-pence lamp fee once = 62 pence. A crown is now TWENTY-FOUR
    groats (six pence each) = 144 pence, so the change is 82 pence = THIRTEEN GROATS AND FOUR PENCE. Does Hesper give the change as 13 groats 4 pence (or 82 pence)? Quote the line. NO for any other change
    (for example one worked from the old 20-groat crown or the old seven-pence price), or no figure.
  evidence:
  - src: card
    text: The price of sleepsyrup. After the Guild's decree in the autumn of the year 441 the price of sleepsyrup went up to nine pence the dram.
  - src: card
    text: It is now worth twenty-four groats, not twenty.
  - src: card
    text: Every dispensing carries a lamp fee of two pence, whatever the number of doses
- id: M3-corrected-total
  ftype: retcon
  turns:
  - 6
  gold_quote: Six ounces, four drams and two scruples
  q: 'Aubrey corrects week three from 14 to 19 drams: the month is now 12 dr 2 scr + 9 dr 1 scr + 19 dr + 11 dr 2 scr = 51 drams + 5 scruples = 52 drams 2 scruples = SIX OUNCES, FOUR DRAMS, TWO SCRUPLES,
    which is over the fifty-dram cap by two drams and two scruples. Does Hesper give the new total (six ounces four drams two scruples / 52 drams 2 scruples) AND say it is over the cap? Quote the line.
    NO if either is missing or the total is wrong, or she still uses the old week-three figure.'
  evidence:
  - src: turn
    text: It isn't fourteen drams, it's nineteen.
  - src: card
    text: a limit of fifty drams of sleepsyrup a month for any dispensary in Marrowgate
- id: X1-ledger-not-everything
  ftype: secret
  turns:
  - 6
  weight: 0.5
  gold_quote: The ledger says what the ledger says
  q: 'Aubrey asks: ''is that every dram that has left this room this month?'' Hesper''s rule: she is truthful about what is written down and gives the ledger''s figures, but she does NOT claim it is everything
    and does not reveal the cellar or the extra seventy drams. Does her answer stay with the ledger (what is written, signed, in her hand) WITHOUT saying yes, that is everything / nothing else leaves, and
    WITHOUT revealing the cellar or off-ledger issuing? Quote the line. NO if she says that it is everything or that nothing else leaves, invents a different account, or reveals the secret.'
  evidence:
  - src: card
    text: She is entirely truthful about what is written down. She does not say that it is everything.
