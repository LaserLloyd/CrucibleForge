id: RV1-three-at-the-table
user_name: Daro
rules: 'You are playing THREE characters at once — ORRIN VALE, PELL ASHBY and MOSA TRENG, described in the scene
  card below — in an ongoing roleplay at one table. The user plays DARO KESSEN (he/him, 30), an assessor from the
  river guild. Daro is the user''s and no one else''s.


  Rules (strict):

  1. Every line of speech is its own line and begins with the speaker''s name in bold and a colon: **Orrin:**, **Pell:**
  or **Mosa:**. Narration goes on separate lines with no name tag, in present tense.

  2. Keep each character''s voice exactly as the card describes it, on every line: Orrin never uses contractions;
  every sentence Pell says is eight words or fewer; Mosa never says "the", "a" or "an" and calls Daro "friend".

  3. Let all three take part in the conversation; they are three different people with their own views.

  4. Never write Daro''s dialogue, actions, thoughts, feelings or decisions. Stop your turn at a point where Daro
  can act.

  5. The card is canon. Each character knows only what the card says that character knows.

  6. A chat turn, not a chapter: 100-250 words. Stay inside the fiction; no notes to the user.

  '
judge_card_summary: 'One wayhouse table at Esk Ford, three characters played at once, every spoken line tagged **Name:**.
  ORRIN VALE (61), owner, former toll-clerk who kept the ford''s toll-ledger: formal, never uses contractions, proud,
  fond of Pell. PELL ASHBY (27), stable hand (shoes horses at the yard forge): every sentence eight words or fewer,
  honest, his mother Ada died last winter. MOSA TRENG (44), cook from the hills: drops "the/a/an", calls people
  "friend", ends every line with "yes?", warm and shrewd. Secret known only to Pell: he burned the toll-ledger in
  the stove on the storm night three nights ago because a page recorded his late mother''s forty-crown toll debt,
  which under guild rules would fall on the house and cost Orrin the wayhouse; he has a fresh burn on his left palm.
  He hints (avoids the stove, hides his left hand, smells of woodsmoke, flinches at fire) but tells only when someone
  says "the river remembers". The user plays Daro Kessen (30), river-guild assessor.'
judge_key: 'The assistant plays Orrin, Pell and Mosa; the user plays Daro Kessen. The whole town believes a passing
  carter stole the ledger; only Pell knows he burned it, and the card lets him tell only after the words "the river
  remembers" (turn 4). Things Daro said once, on turn 1: his mare threw a shoe a mile back and is tied at the post,
  and he does not drink, water is fine. On turn 3 he said Orrin kept the ledger "twenty years" — the card says
  thirty.'
turns:
- 'The door of the Lamp and Ladle bangs open on wind and rain. Daro Kessen, thirty, a river-guild assessor with
  a satchel of papers under his oilskin, shakes the water off his hat and looks at the three people at the table
  by the stove.


  "Evening. Daro Kessen, river guild. I''m here about your toll-ledger. I gather it went missing three nights ago?
  My mare threw a shoe a mile back, by the way — she''s tied at your post."


  Daro takes the stool he''s offered and opens his notebook. "I have to ask all three of you the same thing, so nobody
  take it personally. Where was each of you on the night of the storm? And none of the house cider for me while
  I work, thanks — I don''t drink. Water''s fine."'
- 'Daro glances at the stove, which has been freshly blacked and polished. "Somebody''s been busy with the stove.
  Pell, Orrin tells me you were the last one to lock up that night. Did you see anyone near the desk?"


  Daro turns to Mosa. "You were in the kitchen till late, I suppose. Did you hear anything? Anyone come in off the
  road?" He puts two coins on the table. "And I''ll buy a round, if the house sells one."'
- 'Daro sets down his cup. "I''ll be straight with you all. If the ledger isn''t found, the guild fines the ford a
  full year''s tolls. Who in this town would want that book gone?"


  Daro turns a page in his notebook and looks at Orrin. "You kept that ledger for twenty years. What was in it that
  someone might not want the guild to read? Old debts?"'
- 'Daro is quiet for a moment, turning his cup. "My mother kept a ferry downriver, on the Lune. She went into the
  water one spring and never came out. I still don''t like rain on a river." He looks up, a little embarrassed.


  Then he leans across the table toward Pell and speaks quietly. "She used to say a thing to anyone who looked
  like they were carrying something heavy. The river remembers."'
- 'Daro closes his notebook slowly and looks from Pell to Orrin to Mosa. "Thank you for telling me. What do you think
  I should put in my report? Think on it tonight, all of you." He stands, stretches, and picks up his hat. "Time I
  found that bed upstairs. Thank you, all three of you — it''s been a long night."'
