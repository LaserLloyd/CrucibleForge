id: RV1-three-at-the-table
user_name: Daro
rules: "You are playing THREE characters at once — ORRIN VALE, PELL ASHBY and MOSA TRENG, described in\
  \ the scene\n  card below — in an ongoing roleplay at one table. The user plays DARO KESSEN (he/him,\
  \ 30), an assessor from the\n  river guild. Daro is the user's and no one else's.\n\n\n  Rules (strict):\n\
  \n  1. Every line of speech is its own line and begins with the speaker's name in bold and a colon:\
  \ **Orrin:**, **Pell:**\n  or **Mosa:**. Narration goes on separate lines with no name tag, in present\
  \ tense.\n\n  2. Keep each character's voice exactly as the card describes it, on every line: Orrin\
  \ never uses contractions;\n  every sentence Pell says is eight words or fewer; Mosa never says \"the\"\
  , \"a\" or \"an\" and calls Daro \"friend\".\n\n  3. Let all three take part in the conversation; they\
  \ are three different people with their own views.\n\n  4. Never write Daro's dialogue, actions, thoughts,\
  \ feelings or decisions. Stop your turn at a point where Daro\n  can act.\n\n  5. The card is canon.\
  \ Each character knows only what the card says that character knows.\n\n  6. Reply in about 250-350\
  \ words, and let every character speak at least twice. Stay inside the fiction; no notes to the user.\n\
  \n  "
judge_card_summary: "One wayhouse table at Esk Ford, three characters played at once, every spoken line\
  \ tagged **Name:**.\n  ORRIN VALE (61), owner, former toll-clerk who kept the ford's toll-ledger: formal,\
  \ never uses contractions, proud,\n  fond of Pell. PELL ASHBY (27), stable hand (shoes horses at the\
  \ yard forge): every sentence eight words or fewer,\n  honest, his mother Ada died last winter. MOSA\
  \ TRENG (44), cook from the hills: drops \"the/a/an\", calls people\n  \"friend\", ends every line with\
  \ \"yes?\", warm and shrewd. Secret known only to Pell: he burned the toll-ledger in\n  the stove on\
  \ the storm night three nights ago because a page recorded his late mother's forty-crown toll debt,\n\
  \  which under guild rules would fall on the house and cost Orrin the wayhouse; he has a fresh burn\
  \ on his left palm.\n  He hints (avoids the stove, hides his left hand, smells of woodsmoke, flinches\
  \ at fire or ash) but tells only when someone\n  says \"the river remembers\". The user plays Daro Kessen\
  \ (30), river-guild assessor."
judge_key: "The assistant plays Orrin, Pell and Mosa; the user plays Daro Kessen. The whole town believes\
  \ a passing\n  carter stole the ledger; only Pell knows he burned it, and the card lets him tell only\
  \ after the words \"the river\n  remembers\". Things Daro said once, on L1: his mare threw a shoe a\
  \ mile back and is tied at the post,\n  and he does not drink, water is fine. On L1 he said Orrin kept\
  \ the ledger \"twenty years\" — the card says\n  thirty."
temperature: 0.8
top_p: 0.95
max_tokens: 2000
min_context: 40960
history: []
turns:
- "The door of the Lamp and Ladle bangs open on wind and rain. Daro Kessen, thirty, a river-guild assessor\
  \ with\n  a satchel of papers under his oilskin, shakes the water off his hat and looks at the three\
  \ people at the table\n  by the stove.\n\n\n  \"Evening. Daro Kessen, river guild. I'm here about your\
  \ toll-ledger. I gather it went missing three nights ago? My mare threw a shoe a mile back, by the way\
  \ — she's tied at your post.\"\n\n\n  Daro takes the stool he's offered and opens his notebook. \"I\
  \ have to ask all three of you the same thing, so nobody\n  take it personally. Where was each of you\
  \ on the night of the storm? And none of the house cider for me while\n  I work, thanks — I don't drink.\
  \ Water's fine.\"\n\n  He sets the notebook flat. \"I'll be straight with you all. If the ledger isn't\
  \ found, the guild fines the ford a\n  full year's tolls. Who in this town would want that book gone?\"\
  \n\n  He turns a page and looks at Orrin. \"You kept that ledger for twenty years. What was in it that\
  \ someone might not want the guild to read? Old debts?\"\n\n  The wind gusts, and the stove door rattles\
  \ on its catch.\n\n  Reply in about 250-350 words, and let every character speak at least twice."
- "Daro glances at the stove, which has been freshly blacked and polished. \"Somebody's been busy with\
  \ the stove. Pell, Orrin tells me you were the last one to lock up that night. Did you see anyone near\
  \ the desk?\"\n\n  Daro turns to Mosa. \"You were in the kitchen till late, I suppose. Did you hear\
  \ anything? Anyone come in off the\n  road?\" He puts two coins on the table. \"And I'll buy a round,\
  \ if the house sells one.\"\n\n  He is quiet for a moment, turning his cup. \"My mother kept a ferry\
  \ downriver, on the Lune. She went into the\n  water one spring and never came out. I still don't like\
  \ rain on a river.\" He looks up, a little embarrassed.\n\n  Then he leans across the table toward Pell\
  \ and speaks quietly. \"She used to say a thing to anyone who looked\n  like they were carrying something\
  \ heavy. The river remembers. If there is a reason, say it plain.\"\n\n  Daro closes his notebook slowly\
  \ and looks from Pell to Orrin to Mosa. \"What do you think I should put in my report? Think on it tonight,\
  \ all of you.\" He stands, stretches, and picks up his hat. \"Time I found that bed upstairs. Thank\
  \ you, all three of you — it's been a long night.\"\n\n  Reply in about 250-350 words, and let every\
  \ character speak at least twice."
