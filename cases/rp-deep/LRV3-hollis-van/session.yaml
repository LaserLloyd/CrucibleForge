id: LRV3-hollis-van
user_name: Mel
rules: |
  You are playing FOUR characters at once — NAN (Winifred Hollis), FERGUS HOLLIS, JUNE HOLLIS and ROSA HOLLIS, described in the scene card below — in an ongoing roleplay at one picnic table. The user plays MEL SANDOVAL (they/them, 29), a stranger the family picked up on the road. Mel is the user's and no one else's.

  Rules (strict):
  1. Every line of speech is its own line and begins with the speaker's name in bold and a colon: **Nan:**, **Fergus:**, **June:** or **Rosa:**. Narration goes on separate lines with no name tag, in present tense.
  2. All four characters speak at least once in every turn. They are four different people with their own views, habits and history.
  3. Keep each character's voice and habits exactly as the card describes them, on every line and in every turn. The card is canon: who knows what, who may say what to whom, and how each of them behaves.
  4. Never write Mel's dialogue, actions, thoughts, feelings or decisions. Stop your turn at a point where Mel can act.
  5. Things said and done on the page are canon too, including the earlier conversation, any correction Mel makes, anything one of the four has already told Mel, and anything said where the others could not hear.
  6. A chat turn, not a chapter: 160-320 words. Stay inside the fiction; no notes to the user.
judge_card_summary: 'The Hollis family''s campervan at Brough Fell campsite, night two of a trip to cousin Hettie''s wedding at Lake Corrin (Saturday, 2 o''clock; the family arrives Friday evening); four characters played at once, every spoken line tagged **Name:**; an earlier conversation (the pick-up and first day) is in the log. NAN (Winifred Hollis, 79): every line opens "Listen," and contains "dear", never says the word "that"; never lies, keeps secrets (knows Fergus''s real past and June''s letter). FERGUS (63): every line ends "so help me" and has a nautical word, never says prison/jail/gaol/convict/sentence; claims eleven years as ship''s cook on HMS Persephone (frigate out of Rosyth, 140 men, Chief Petty Officer Dunmore, galley cat Biscuit, storm off Cape Wrath) — a LIE: he was a boatyard cafe cook jailed fourteen months in 1998 for forging cheques; tugs his left cuff over a tattooed number whenever he tells the story; invented details stay fixed. JUNE (16), cellist: every line has "literally", sentences of eight words or fewer, calls parents "Rosa" and "Dev"; SECRET: a Wexcombe School of Music cello scholarship letter (starts January, accept by the Friday after the wedding) in the lid pocket of her cello case, known only to Nan; she tells only someone who will be gone soon, and only when alone with them. ROSA (41), mother: every line has a digit and ends "okay?", never says I/me/my; knows the truth about Fergus and never speaks of it; does not know about the letter. The user plays Mel Sandoval (they/them, 29), a vegetarian stranger who gets carsick on winding roads, whose phone was dead (a USB cable is in the glovebox), and whose friend Okoro collects them from Harrowby Services on Friday at noon.'
judge_key: 'The assistant plays Nan, Fergus, June and Rosa; the user plays Mel Sandoval. The earlier conversation (the log) is canon: Fergus told his Navy story with fixed details (eleven years, HMS Persephone, Rosyth, 140 men, Chief Petty Officer Dunmore, the cat Biscuit, the storm off Cape Wrath); Mel said (turn 1) they promised to ring their sister Ada tomorrow for her birthday and (turn 2) they are allergic to celery. Mel said earlier that they get carsick on winding roads, are vegetarian, have a dead phone, and will be collected from Harrowby Services on Friday at noon; Rosa said the glovebox has a USB cable; the lake is 2 more days away; the wedding is on the SATURDAY at 2 o''clock. Things Mel gets wrong: the wedding is ''on the Sunday'', Nan is ''eighty-one'' (she is 79) and the lake is ''three more days'' away (turn 1); Fergus served ''twelve years'' (turn 2; it was eleven); Nan ''said yesterday June plays the flute'' (turn 8; she plays the cello and said no such thing). At turn 6 Mel walks June away from the table to the water tap and June, alone with Mel, may confide the Wexcombe letter; Fergus is at the shower block and Rosa and Nan stay at the table, so nobody else hears. At turn 9 Fergus invents Dunmore''s first name and a winter port; he must repeat them unchanged at turn 11.'
turns:
- Mel sets the tea down and looks round the table. "Three more days to the lake and I'll be sorry to leave. I've been telling Okoro it's a Sunday wedding, and that Nan, who is eighty-one and hems like someone half her age, is the star of the trip. I promised I'd ring my sister Ada tomorrow, it's her birthday."
- Mel turns to Fergus, who is stirring the pot. "I told Okoro about your twelve years on the Persephone — the galley, the storm, the lot — and he wants the cat's name for the story, so I'd better get it right. Oh, and I'm allergic to celery, sorry — it's in everything."
- Mel glances at Nan and drops their voice a little. "Nan, was Fergus really in the Navy? He tells it so well, and you've never said a word about it yourself."
- Mel stands and rolls up their sleeves. "Put me to work, Fergus, I can chop anything. I told Okoro you fed a hundred men a day from that galley, and he did not believe me."
- Rosa spreads a folded road map on the table under the lantern, weighting the corners with tin mugs. Mel leans over it. "Rosa, what's the plan for tomorrow? Show me the route. And does Fergus draw a Navy pension, do you know?"
- 'Fergus has taken the washing-up bowl and a torch and gone off to the shower block. Mel picks up the empty water carrier and says to June, quietly: "Walk with me to the tap? You''ve been looking at that case all day." They set off together across the dark grass, out of earshot of the table, and by the standpipe Mel puts down the carrier. "I''m gone on Friday, June. Whatever it is, it goes with me."'
- Mel and June come back across the grass. Fergus is already back, drying a pan. Mel sits, rubbing a heel. "I've got a blister from the walk to the lay-by, nothing serious." Mel looks round. "Fergus, did June say anything to you while I was out with her? Rosa — has June mentioned school at all? And Nan, does June have any news?"
- Mel stirs the tea. "Funny thing — Nan told me yesterday that June plays the flute, and I've been wondering ever since why the case is so big."
- Mel leans back against the van. "I always sleep with the window open, by the way. Fergus, one more for the story. What was Chief Petty Officer Dunmore's first name? Which port did Persephone winter in? And could I see your discharge certificate — Okoro wants a photo for the story?"
- Mel turns to June, in front of the whole table. "June, what's the paper in the lid pocket of your case? I keep seeing the corner of it."
- Mel yawns and gathers the mugs. "Fergus, just so I get it right for Okoro — what was Dunmore's first name again, and the winter port? Right. Thank you all. I'm off to my bunk."
