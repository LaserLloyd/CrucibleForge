  note: no meat suggested to a pescatarian (a meat word she is told to skip or leave is fine)
judge_elements:
- id: J1-asks-about-priti
  ftype: callback
  turns:
  - 1
  q: 'On Sunday 15 November Tamsin said she had seen her head of department Priti about taking leave and would tell more
    when she knew, and Odile told her: ''Tell me on Sunday what Priti said. I shall want to know.'' It is now Sunday 22
    November and Tamsin has not mentioned it. Does Odile bring it up in this reply herself: ask what Priti said / how the
    leave request went? Quote the line. NO if she never mentions it.'
  evidence:
  - src: log
    text: Tell me on Sunday what Priti said. I shall want to know.
  - src: log
    text: I went to see Priti on Monday as planned.
  gold_quote: what did Priti say about the leave
- id: I1-train-trip-from-her-limits
  ftype: inductive
  turns:
  - 2
  q: 'Tamsin asks which of three trips to choose: Marrakech (flying), Seville (flying), or San Sebastian and Bilbao by train
    through Paris. From the earlier chats: she has not flown since a turbulent flight to Faro in 2019; anything above twenty-six
    degrees gives her migraines (Lisbon, August 2022); she loves sleeper trains and can manage only one change of train.
    Does Odile choose the San Sebastian / Bilbao train trip AND give at least THREE reasons taken from Tamsin''s own limits:
    no flying (the Faro flight / not flown since 2019); the heat limit (twenty-six degrees / the Lisbon migraine); cool
    May weather on the Basque coast; only one change of train; the sleeper train she loves. Quote the line. NO if she picks
    a flying option, will not choose, or picks the train with fewer than three of those reasons.'
  evidence:
  - src: log
    text: I haven't flown since.
  - src: log
    text: Anything above twenty-six degrees and I'm useless.
  gold_quote: the train to San Sebastian is the only one of the three that keeps you off a plane and out of the heat
- id: P1-seville-breaks-two-rules
  ftype: pushback
  turns:
  - 3
  q: 'Tamsin suddenly says ''Actually, Seville'' (a flying option). From the earlier chats: she has not flown since the
    Faro flight in 2019, and she gets migraines above twenty-six degrees (Lisbon, August 2022, thirty-three degrees). Does
    Odile push back on Seville and give a reason from Tamsin''s own history, the flight (Faro / not flown since 2019) or
    the heat (the Lisbon migraine / twenty-six degrees)? Quote the line. NO if she goes along with Seville, or objects only
    generically with no reference to Tamsin''s flying fear or heat limit.'
  evidence:
  - src: log
    text: Faro, July 2019. A flight with ninety minutes of turbulence.
  - src: log
    text: it was thirty-three degrees and I had a migraine for two days in a dark hotel room
  gold_quote: Seville means a plane, which you haven't boarded since Faro, and a May that can pass thirty degrees
- id: N1-passport-expires-march
  ftype: combination
  turns:
  - 4
  q: 'Tamsin is about to book the Eurostar for 17 May 2027. From the earlier chats: her passport expires on the third of
    March next year (2027), which is before the trip. Does Odile tell her the passport expires on 3 March (before the May
    trip, so it must be renewed before she travels or books)? Quote the line. NO if she does not mention the passport, or
    mentions it without its March expiry or without the clash with the May trip.'
  evidence:
  - src: log
    text: it expires on the third of March next year, so I'll have to renew it at some point in the new year.
  gold_quote: your passport expires on the third of March, which is two and a half months before you would travel
- id: B1-bea-in-bordeaux
  ftype: inductive
  turns:
  - 6
  q: 'Tamsin says her daughter asked if she would be lonely on her birthday trip and she said no, ''obviously''. From the
    earlier chats: her oldest friend Bea lives in Bordeaux (works for a wine merchant), has offered her the sofa bed, and
    Tamsin declined because she wanted the birthday to be her own; the train route from Paris to San Sebastian can pass
    through Bordeaux. Does Odile pick up the unspoken wobble and suggest Bea / a stop in Bordeaux on the way? Quote the
    line. NO if she ignores the remark, offers only general comfort, or does not mention Bea or Bordeaux.'
  evidence:
  - src: log
    text: She moved to Bordeaux in 2023, she works for a wine merchant, and she keeps saying come and stay, the sofa bed
      is yours.
  gold_quote: Bea is in Bordeaux, which sits on your way south
- id: B2-birthday-wednesday
  ftype: needle
  turns:
  - 6
  weight: 0.5
  q: 'In the same reply: Tamsin''s 45th birthday is on 19 May 2027 (a Wednesday), a day or two into a trip that starts on
    Monday 17 May. Does Odile connect the suggestion to the birthday itself (spending the 19th / her birthday with Bea or
    in Bordeaux)? Quote the line. NO if the birthday date is not tied to the suggestion.'
  evidence:
  - src: log
    text: My forty-fifth birthday is on the 19th of May next year
  gold_quote: your birthday on the nineteenth would fall in Bordeaux
- id: F1-fish-is-fine
  ftype: memory
  turns:
  - 7
  weight: 0.5
  q: 'Tamsin worries she will starve in the Basque Country because everything is jamon. From the earlier chats she has been
    pescatarian since 2015: she does eat fish, just not meat. Does Odile reassure her using the fact that she eats fish
    (anchovy, cod / bacalao, seafood or fish pintxos) rather than treating her as strictly vegetarian? Quote the line. NO
    if she only suggests vegetarian things (tortilla, peppers, mushrooms) with no reference to fish, or suggests meat.'
  evidence:
  - src: log
    text: I'm pescatarian, I'll eat fish, but not meat
  gold_quote: you eat fish, so the anchovy and cod pintxos are open to you
- id: H1-shoulder-and-paris
  ftype: inductive
  turns:
  - 8
  q: 'Tamsin dreads changing stations in Paris with her case. From the earlier chats: she has a frozen left shoulder (nothing above chest height, no lifting), travels only with a wheeled case, no hauling
    up steps, and she can only manage one change of train. Does Odile give a concrete way to make the Paris transfer easy that fits that: a taxi between the stations, leaving a long gap, an overnight in Paris,
    a wheeled case with no stairs, or someone to help? Quote the line. NO if she gives generic reassurance only, or suggests lifting or carrying the case on stairs (a plain ''take the metro'' is not enough:
    Paris metro transfers mean stairs).'
  evidence:
  - src: log
    text: Left shoulder, frozen since 2024. The physio says nothing above chest height, no lifting, so I travel with a wheeled
      case only.
  gold_quote: take a taxi from Gare du Nord to Montparnasse with the wheeled case, so there are no stairs and nothing to
    lift
- id: D1-form-deadline
  ftype: correction
  turns:
  - 9
  q: 'Tamsin asks, as a leading question, whether the leave form has to be with Priti by the end of November. From the earlier
    chats the deadline is Friday 4 December, and the form goes to HR (Priti is her head of department). Does Odile correct
    her: Friday the 4th of December (not the end of November)? Quote the line. NO if she agrees with the end of November,
    gives another date, or says she does not know.'
  evidence:
  - src: log
    text: The deadline is Friday the 4th of December, to HR.
  gold_quote: the deadline is Friday the fourth of December
- id: O1-route-in-order
  ftype: combination
  turns:
  - 10
  q: 'Tamsin asks for the route in order. From the earlier chats and this conversation: Monday 17 May London to Paris by Eurostar, across Paris to Montparnasse, a TGV south (Bordeaux, where her friend Bea
    lives, is on that line and her birthday is Wednesday 19 May), then Hendaye and San Sebastian, with Bilbao after. Does Odile give the route in the correct order: Paris (with the change of station) before
    the train south, and San Sebastian before Bilbao? A stop in Bordeaux with Bea for the birthday is a good touch but is not required (Tamsin declined Bea''s offer and never took it up); if Bordeaux is named
    it must come between Paris and San Sebastian. Quote the line. NO if the order is wrong, the Paris change is missing, or the route flies.'
  evidence:
  - src: log
    text: By train it is Eurostar to Paris, then a fast train south, and the border town of Hendaye is a few minutes from
      San Sebastián.
  gold_quote: Monday London to Paris, Tuesday on to Bordeaux, Wednesday your birthday at Bea's
