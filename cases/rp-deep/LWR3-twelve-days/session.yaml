- id: J1-waiting-vs-received
  ftype: applied
  turns:
  - 3
  - 5
  q: 'Perpetua''s letter 3 (turn 3, dated 24 March) must read as written by someone who has had NO reply: she says so and uses nothing from Dev''s replies. Her letter 5 (turn 5, dated 2 April) must treat Dev''s letter of 16 March as received (it arrived on 28 March) and answer its question about bolting, without reacting to anything from his letter of 30 March. Quote the line in letter 3 that shows she has no reply, and the line in letter 5 that answers him. NO if letter 3 says or implies she knows anything from Dev, or letter 5 does not use his March letter, or letter 5 reacts to the later one.'
  evidence:
  - src: turn
    text: A writer who has had no reply simply has none.
  gold_quote: I have had no word from you yet, so I cannot say whether the seed reached you.
  weight: 1.5
