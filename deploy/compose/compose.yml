# CrucibleForge - Docker Compose
#
#   cp deploy/compose/.env.example deploy/compose/.env     # optional; every value has a default
#   docker compose -f deploy/compose/compose.yml up -d
#   docker compose -f deploy/compose/compose.yml logs app  # prints the GUI URL (with a freshly generated token; a stored or env token is never logged: exec app crucibleforge gui token show). The URL names the container port 8777; from the host use HOST_PORT (default 8777)
#
# CLI inside the container (one-off, same volume):
#   docker compose -f deploy/compose/compose.yml run --rm app status
#   docker compose -f deploy/compose/compose.yml run --rm app all --models <label> --yes
#   docker compose -f deploy/compose/compose.yml run --rm --service-ports app view   # the report at http://localhost:8377 (Ctrl-C closes it)
name: crucibleforge

services:
  app:
    image: ${IMAGE:-ghcr.io/laserlloyd/crucibleforge:4.5.1}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-4.5.1}
    container_name: crucibleforge
    hostname: crucibleforge
    restart: unless-stopped
    stop_grace_period: 60s          # a benchmark in flight gets time to release the rig lease

    ports:
      # 8777 is the GUI's own default. Loopback only unless you opt out.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8777}:8777"
      # 8377 is the read-only results page (`view`, `test --serve`); only `run --service-ports` publishes it there
      - "${BIND_ADDR:-127.0.0.1}:${VIEW_PORT:-8377}:8377"

    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
      # Where the local LLM server lives, as seen FROM THE CONTAINER. Used once,
      # to seed /data/models.yaml on first start (edit that file afterwards).
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      # Stable GUI token (otherwise a fresh one is printed on every start).
      CRUCIBLEFORGE_GUI_TOKEN: ${CRUCIBLEFORGE_GUI_TOKEN:-}
      # Coding cases run model-written code through the image's jail helper
      # (another user, no network, limits; docs/deploy/docker.md). Set 1 only
      # to run it anyway when the helper cannot work (it then has network).
      CRUCIBLEFORGE_ALLOW_UNSANDBOXED: ${CRUCIBLEFORGE_ALLOW_UNSANDBOXED:-}
      # Hosted-provider keys: name them in models.yaml (api_key_env) and pass
      # them through .env. Listed here only so compose forwards them.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

    # Starts as root only to find the owner of /data (or PUID/PGID from .env)
    # and runs the benchmark as that user; compose.puid.yml is no longer needed.
    # Everything stateful is on the /data volume; the image filesystem is
    # read-only so a stray write fails loudly instead of vanishing on update.
    read_only: true
    tmpfs:
      - /tmp
    # starts as root only to run the benchmark as the /data owner and to start the jail helper that
    # runs model code as uid 65534 with no network (a setuid helper: no-new-privileges would disable it)
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]

    # Resolve host.docker.internal on Linux engines too (Docker Desktop has it).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # models.yaml + results/ live here. Set DATA_PATH to a host directory
      # (one you own) to keep them somewhere you can browse.
      - ${DATA_PATH:-crucibleforge-data}:/data

    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 3

    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT:-2g}
          cpus: "${CPU_LIMIT:-2.0}"
        reservations:
          memory: ${MEM_RESERVATION:-256m}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # `docker compose down` keeps this volume; `down -v` DELETES it.
  crucibleforge-data:
