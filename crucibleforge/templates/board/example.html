<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CrucibleForge Board</title><style>
:root{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--border:#30363d;--accent:#58a6ff;--warn:#d29922;--fail:#f85149;--ok:#3fb950;--row:#161b22;--soft:#1c2128;}
@media(prefers-color-scheme:light){:root{--bg:#ffffff;--fg:#1f2328;--muted:#57606a;--border:#d0d7de;--accent:#0969da;--warn:#9a6700;--fail:#cf222e;--ok:#1a7f37;--row:#f6f8fa;--soft:#eaeef2;}}
*{box-sizing:border-box}html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);}
header{padding:10px 16px;border-bottom:1px solid var(--border);}
h1{font-size:16px;margin:0 0 8px 0;font-weight:600;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px;}
.toolbar input,.toolbar button{background:var(--row);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer;}
.toolbar input{flex:1;min-width:140px;cursor:text;}
.toolbar button:hover{background:var(--border);}
.toolbar label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;}
.filters-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;padding-top:6px;border-top:1px dashed var(--border);}
.filters-row .flabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-right:6px;}
.filters-row .comp-filter{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:var(--row);border:1px solid var(--border);border-radius:6px;padding:3px 6px;}
.filters-row .comp-filter.is-active{border-color:var(--accent);color:var(--fg);}
.filters-row .comp-filter select{background:transparent;color:var(--fg);border:0;font-size:11px;cursor:pointer;outline:none;padding:0 2px;}
.filters-row .comp-filter .lbl{font-weight:600;}
table{width:100%;border-collapse:collapse;font-size:13px;border-top:1px solid var(--border);}
thead{position:sticky;top:0;z-index:10;background:var(--bg);}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle;}
th{background:var(--bg);font-weight:600;cursor:pointer;user-select:none;text-align:center;}
th:hover{background:var(--row);}
th .arrow{opacity:0.5;font-size:10px;}
tr:hover td{background:var(--soft);}
.warn{color:var(--warn);}.fail{color:var(--fail);}.muted{color:var(--muted);}
.warn-row td.notes{color:var(--warn);}.fail td.notes{color:var(--fail);}
td.strong{font-weight:600;}td.label{font-weight:500;}td.notes{font-size:12px;max-width:380px;}
.detail .group.wide{grid-column:1/-1;}
@media(max-width:640px){main{padding:0 16px 40px;}th,td{padding:6px;}td.notes{max-width:180px;}}
.num{text-align:center;font-variant-numeric:tabular-nums;}
main{padding:0 16px 60px;overflow-x:auto;}
.meta{font-size:12px;color:var(--muted);margin:8px 0;}
.toggle{background:transparent;border:0;color:var(--accent);cursor:pointer;font-size:14px;padding:0;width:18px;display:inline-block;}
.toggle:hover{color:var(--fg);}
.detail-row td{background:var(--row);padding:0;}
.detail{padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;font-size:12px;}
.detail .group{background:var(--soft);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
.detail .group h4{margin:0 0 6px 0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;}
.detail .group .val{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;}
.detail .group .meta-line{font-size:11px;color:var(--muted);margin-top:4px;word-break:break-all;}
.detail .comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;}
.detail .comp{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:6px 8px;cursor:pointer;text-align:center;}
.detail .comp:hover{border-color:var(--accent);}
.detail .comp .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;}
.detail .comp .val{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.sort-hint{font-size:11px;color:var(--muted);margin-top:8px;font-style:italic;}
</style></head><body><header><h1>CrucibleForge — Chat &amp; Coding</h1><div class="meta">example board — made-up numbers</div><div class="toolbar"><input id="filter" placeholder="filter model…" aria-label="filter"><button id="expandAll">Expand all</button><button id="collapseAll">Collapse all</button></div></header><main><div class="meta" id="count">5 models · click a column to sort · click ▸ for components</div><table><thead><tr><th style="width:24px"></th><th data-k="rank" scope="col"># <span class="arrow"></span></th><th data-k="label" scope="col">Model <span class="arrow"></span></th><th data-k="chat" scope="col">Chat <span class="arrow"></span></th><th data-k="coding" scope="col">Coding <span class="arrow"></span></th><th data-k="overall" scope="col">Overall <span class="arrow"></span></th><th data-k="tok_s" scope="col">tok/s <span class="arrow"></span></th><th data-k="date" scope="col">Run date <span class="arrow"></span></th><th data-k="notes" scope="col">Notes <span class="arrow"></span></th></tr></thead><tbody id="tbody"></tbody></table></main><script>const rows = [{"rank": 1, "label": "example-27b-a", "model_id": "publisher/example-27b-a-GGUF/example-27b-a-Q5_K_M", "provider": "studioforge", "chat": 86.5, "coding": 88.9, "overall": 87.6, "tok_s": 34.2, "date": "2026-09-23", "notes": "", "tier": 0, "components": {"RP": 88, "NSFW": 74, "Story": 68, "Explicit peak": 100, "Willing": 100, "Steer": 100, "Programs": 88.9, "Tools": 100, "Instruct": 75, "Reason": 50}}, {"rank": 2, "label": "example-27b-b", "model_id": "publisher/example-27b-b-GGUF/example-27b-b-Q5_K_M", "provider": "studioforge", "chat": 88.1, "coding": 77.8, "overall": 83.5, "tok_s": 31.0, "date": "2026-09-23", "notes": "", "tier": 0, "components": {"RP": 88, "NSFW": 74, "Story": 68, "Explicit peak": 100, "Willing": 100, "Steer": 100, "Programs": 77.8, "Tools": 100, "Instruct": 75, "Reason": 50}}, {"rank": 3, "label": "example-api", "model_id": "publisher/example-api-GGUF/example-api-Q5_K_M", "provider": "studioforge", "chat": 83.5, "coding": 80.6, "overall": 82.2, "tok_s": 140.0, "date": "2026-09-23", "notes": "", "tier": 0, "components": {"RP": 88, "NSFW": 74, "Story": 68, "Explicit peak": 100, "Willing": 100, "Steer": 100, "Programs": 80.6, "Tools": 100, "Instruct": 75, "Reason": 50}}, {"rank": 4, "label": "example-8b", "model_id": "publisher/example-8b-GGUF/example-8b-Q5_K_M", "provider": "studioforge", "chat": 72.0, "coding": 25.0, "overall": 50.9, "tok_s": 120.5, "date": "2026-09-23", "notes": "partial (30/33 cases)", "tier": 1, "components": {"RP": 88, "NSFW": 74, "Story": 68, "Explicit peak": 100, "Willing": 100, "Steer": 100, "Programs": 25.0, "Tools": 100, "Instruct": 75, "Reason": 50}}, {"rank": 5, "label": "example-bad-id", "model_id": "publisher/example-bad-id-GGUF/example-bad-id-Q5_K_M", "provider": "studioforge", "chat": null, "coding": null, "overall": null, "tok_s": null, "date": "2026-09-23", "notes": "FAILED: example/X-NVFP4 is not served…", "tier": 2, "components": {}}];
let sortKey = 'rank', sortDir = 1, filter = '';
const expanded = new Set();
const NUMERIC = new Set(['rank', 'chat', 'coding', 'overall', 'tok_s']);
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}
function num(v, d) {
  return (v === null || v === undefined || isNaN(v)) ? '<span class="muted">–</span>' : Number(v).toFixed(d);
}
function key(r, k) {
  const v = r[k];
  if (NUMERIC.has(k)) return (v === null || v === undefined) ? null : Number(v);
  return v === null || v === undefined ? '' : String(v).toLowerCase();
}
function compare(a, b) {
  const ka = key(a, sortKey), kb = key(b, sortKey);
  if (ka === null && kb === null) return a.rank - b.rank;
  if (ka === null) return 1;           // missing values always sort last
  if (kb === null) return -1;
  if (ka < kb) return -sortDir;
  if (ka > kb) return sortDir;
  return a.rank - b.rank;
}
function detail(r) {
  const comps = Object.entries(r.components || {}).map(([k, v]) =>
    '<div class="comp"><div class="lbl">' + esc(k) + '</div><div class="val">' + num(v, 0) + '</div></div>').join('');
  return '<div class="detail"><div class="group"><h4>Model id</h4><div class="meta-line">' + esc(r.model_id || '–') +
    '</div></div><div class="group"><h4>Provider</h4><div class="meta-line">' + esc(r.provider || '–') +
    '</div></div><div class="group wide"><h4>Components (Chat: RP · NSFW · Story · Explicit peak · Willing · Steer — ' +
    'Coding: Programs · Tools · Instruct · Reason)</h4><div class="comp-grid">' + comps + '</div></div></div>';
}
function render() {
  const f = filter.toLowerCase();
  const data = rows.filter(r => !f || r.label.toLowerCase().includes(f) || (r.model_id || '').toLowerCase().includes(f));
  data.sort(compare);
  document.getElementById('tbody').innerHTML = data.map(r => {
    const open = expanded.has(r.label);
    const cls = r.tier >= 2 ? 'fail' : (r.tier >= 1 ? 'warn-row' : '');
    return '<tr class="data-row ' + cls + '" data-label="' + esc(r.label) + '">' +
      '<td><button class="toggle" aria-expanded="' + open + '" data-toggle="' + esc(r.label) + '">' + (open ? '▾' : '▸') + '</button></td>' +
      '<td class="num">' + r.rank + '</td><td class="label">' + esc(r.label) + '</td>' +
      '<td class="num strong">' + num(r.chat, 1) + '</td><td class="num strong">' + num(r.coding, 1) + '</td>' +
      '<td class="num">' + num(r.overall, 1) + '</td><td class="num">' + num(r.tok_s, 1) + '</td>' +
      '<td>' + esc(r.date || '–') + '</td><td class="notes">' + esc(r.notes || '') + '</td></tr>' +
      (open ? '<tr class="detail-row"><td colspan="9">' + detail(r) + '</td></tr>' : '');
  }).join('');
  document.querySelectorAll('th[data-k]').forEach(th => {
    const a = th.querySelector('.arrow');
    a.textContent = th.dataset.k === sortKey ? (sortDir === 1 ? '▲' : '▼') : '⇅';
  });
  document.getElementById('count').textContent = data.length + ' of ' + rows.length +
    ' models · click a column to sort · click ▸ for components';
}
function init() {
  document.getElementById('filter').addEventListener('input', e => { filter = e.target.value; render(); });
  document.getElementById('expandAll').addEventListener('click', () => { rows.forEach(r => expanded.add(r.label)); render(); });
  document.getElementById('collapseAll').addEventListener('click', () => { expanded.clear(); render(); });
  document.querySelectorAll('th[data-k]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir = -sortDir;
    else { sortKey = k; sortDir = (k === 'rank' || k === 'label' || k === 'notes') ? 1 : -1; }
    render();
  }));
  document.getElementById('tbody').addEventListener('click', e => {
    const t = e.target.closest('[data-toggle]');
    if (!t) return;
    const l = t.dataset.toggle;
    if (expanded.has(l)) expanded.delete(l); else expanded.add(l);
    render();
  });
  render();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script></body></html>
